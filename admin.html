<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Donna — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#13243d; --ink-2:#22375a; --canvas:#eef1f7; --surface:#ffffff;
    --line:#dfe5f0; --line-2:#eef1f7; --muted:#5d6e8c; --muted-2:#8b99b3;
    --signal:#e0892e; --signal-soft:#fbf0e0; --signal-line:#f0c790;
    --ok:#2f9e6f; --ok-soft:#e5f3ec; --danger:#c0492f; --danger-soft:#f7e7e3;
    --warn:#b0790f; --warn-soft:#fbf2dc; --info:#1f6f8a; --info-soft:#e2f0f4;
    --r:13px; --r-sm:9px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45}
  h1,h2,h3,.display{font-family:'Bricolage Grotesque','Inter',sans-serif;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit;font-size:14px;color:var(--ink)}
  :focus-visible{outline:2.5px solid var(--signal);outline-offset:2px;border-radius:4px}

  /* top bar */
  .top{background:var(--ink);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:12px}
  .top .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(150deg,var(--signal),#e6a85a);display:grid;place-items:center;color:#fff;flex:none}
  .top .mark svg{width:17px;height:17px}
  .top b{font-family:'Bricolage Grotesque';font-size:18px;font-weight:700;letter-spacing:-.02em}
  .top .tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7e8db0;margin-left:2px}
  .top .sp{flex:1}
  .top .who{font-size:12.5px;color:#bcc9dc}
  .top .out{background:none;border:1px solid #3a4c6e;color:#cdd8ea;border-radius:8px;padding:6px 12px;font-size:12.5px}
  .top .out:hover{background:#1c2d49}

  .wrap{max-width:1180px;margin:0 auto;padding:26px 22px 80px}

  /* auth */
  .auth{min-height:70vh;display:grid;place-items:center}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px}
  .auth .card{width:100%;max-width:380px}
  .auth h2{font-size:21px;margin-bottom:4px}
  .auth p{color:var(--muted);font-size:13.5px;margin-bottom:18px}
  label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:12px 0 5px}
  .in{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fbfcfe}
  .in:focus{border-color:var(--signal);background:#fff;outline:none}
  .btn{background:var(--signal);color:#fff;border:none;border-radius:var(--r-sm);padding:10px 16px;font-weight:600;font-size:13.5px}
  .btn:hover{filter:brightness(1.04)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.full{width:100%;margin-top:16px}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--line-2)}
  .btn.sm{padding:7px 12px;font-size:12.5px}
  .msg{font-size:12.5px;margin-top:10px;min-height:16px}

  /* stat row */
  .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:22px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
  .stat b{display:block;font-family:'Bricolage Grotesque';font-size:26px;font-weight:700;letter-spacing:-.02em}
  .stat span{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-2)}

  h1.page{font-size:22px;margin-bottom:3px}
  .lede{color:var(--muted);font-size:13.5px;margin-bottom:18px}

  /* table */
  .tbl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-2);padding:11px 14px;border-bottom:1px solid var(--line);font-weight:600;background:#f8fafc}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{cursor:pointer;transition:.1s}
  tbody tr:hover{background:#f8fafc}
  .co{font-weight:600;color:var(--ink)}
  .sub{color:var(--muted);font-size:11.5px}
  .num{font-variant-numeric:tabular-nums}

  .pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;letter-spacing:.02em}
  .pill.trial{background:var(--warn-soft);color:var(--warn)}
  .pill.active{background:var(--ok-soft);color:var(--ok)}
  .pill.paused{background:var(--line-2);color:var(--muted)}
  .pill.cancelled{background:var(--danger-soft);color:var(--danger)}
  .pill.starter{background:var(--line-2);color:var(--muted)}
  .pill.pro{background:var(--signal-soft);color:var(--signal)}
  .pill.enterprise{background:var(--info-soft);color:var(--info)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .dot.on{background:var(--ok)} .dot.off{background:var(--muted-2)}

  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(19,36,61,.4);display:none;z-index:40}
  .scrim.show{display:block}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(560px,94vw);background:var(--canvas);border-left:1px solid var(--line);transform:translateX(100%);transition:.22s;z-index:50;overflow-y:auto}
  .drawer.show{transform:none}
  .dhead{background:var(--surface);border-bottom:1px solid var(--line);padding:20px 22px;position:sticky;top:0;z-index:2}
  .dhead h2{font-size:20px}
  .dhead .x{position:absolute;top:16px;right:18px;background:none;border:none;font-size:22px;color:var(--muted);line-height:1}
  .dbody{padding:20px 22px;display:flex;flex-direction:column;gap:16px}
  .sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
  .sec h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-2);margin-bottom:12px}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line-2)}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--muted)} .kv .v{font-weight:500;text-align:right}
  .row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
  .row .fld{flex:1;min-width:120px}
  .uitem{font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line-2)}
  .uitem:last-child{border-bottom:none}
  .callitem{font-size:12px;padding:8px 0;border-bottom:1px solid var(--line-2)}
  .callitem:last-child{border-bottom:none}
  .mono{font-variant-numeric:tabular-nums}

  .steps{counter-reset:s;list-style:none}
  .steps li{position:relative;padding:8px 0 8px 32px;font-size:13px;border-bottom:1px solid var(--line-2)}
  .steps li:last-child{border-bottom:none}
  .steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:8px;width:21px;height:21px;border-radius:50%;background:var(--signal-soft);color:var(--signal);font-size:11px;font-weight:700;display:grid;place-items:center}

  .sec.health{background:#0f2740;color:#eaf0f8;border-color:#1c3a5c}
  .sec.health .hrow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .sec.health .hgrow{flex:1}
  .sec.health .hsetup{font-size:12px;font-weight:600;color:#f0c790;background:rgba(224,137,46,.16);padding:3px 10px;border-radius:20px}
  .sec.health .hsetup.all{color:#8fe3bf;background:rgba(47,158,111,.2)}
  .sec.health .hline{font-size:12.5px;color:#aebfd6;margin-bottom:12px}
  .sec.health .checks{display:grid;grid-template-columns:1fr 1fr;gap:7px 16px}
  .sec.health .chk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#cdd8ea}
  .sec.health .chk .ci{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
  .sec.health .chk.ok .ci{background:rgba(47,158,111,.25);color:#8fe3bf}
  .sec.health .chk.no{color:#8b99b3}
  .sec.health .chk.no .ci{background:rgba(192,73,47,.22);color:#e8a594}
  @media(max-width:520px){ .sec.health .checks{grid-template-columns:1fr} }
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .banner{background:var(--info-soft);border:1px solid #bcdbe4;color:#17596e;border-radius:var(--r-sm);padding:11px 14px;font-size:12.5px;margin-bottom:18px}
  @media(max-width:860px){ .stats{grid-template-columns:repeat(3,1fr)} .hide-s{display:none} }
</style>
</head>
<body>
<div class="top">
  <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V4M9 13h.01M15 13h.01M8 19v2M16 19v2"/></svg></span>
  <b>Donna</b><span class="tag">Admin</span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button class="out" id="signout" style="display:none">Sign out</button>
</div>
<div id="root"></div>

<!-- tenant drawer -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="dhead"><button class="x" id="dclose">&times;</button><h2 id="dtitle">Tenant</h2><div class="sub" id="dsub"></div></div>
  <div class="dbody" id="dbody"></div>
</aside>

<script>
const SUPABASE_URL = "https://hingbdtmxozbjetzwibj.supabase.co";
const SUPABASE_KEY = "sb_publishable_eCiC9HkJ8PO3D1N_0vtwWQ_Bphb6RXX";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (s,el=document)=>el.querySelector(s);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const root = document.getElementById("root");
const state = { accounts:[], stats:null, openId:null };

function api(action, extra){ return db.functions.invoke("admin-api",{ body:Object.assign({action},extra||{}) }); }
function fmtNum(n){ return (n==null?0:Number(n)).toLocaleString(); }
function prettyPhone(p){ if(!p) return ""; const d=String(p).replace(/\D/g,""); if(d.length===11&&d[0]==='1') return `(${d.slice(1,4)}) ${d.slice(4,7)}-${d.slice(7)}`; if(d.length===10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`; return p; }
function ago(iso){ if(!iso) return "never"; const d=new Date(iso), s=(Date.now()-d.getTime())/1000; if(s<3600) return Math.max(1,Math.round(s/60))+"m ago"; if(s<86400) return Math.round(s/3600)+"h ago"; if(s<86400*30) return Math.round(s/86400)+"d ago"; return d.toLocaleDateString(); }
function dt(iso){ return iso?new Date(iso).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}):""; }

/* ===================== AUTH ===================== */
function renderAuth(err){
  document.getElementById("signout").style.display="none";
  document.getElementById("who").textContent="";
  root.innerHTML = `<div class="wrap"><div class="auth"><div class="card">
    <h2>Admin sign in</h2>
    <p>Platform administrators only.</p>
    <label>Email</label><input class="in" id="em" type="email" autocomplete="username">
    <label>Password</label><input class="in" id="pw" type="password" autocomplete="current-password">
    <button class="btn full" id="go">Sign in</button>
    <div class="msg" style="color:var(--danger)">${esc(err||"")}</div>
  </div></div></div>`;
  const go=$("#go");
  const submit=async()=>{
    const email=$("#em").value.trim(), password=$("#pw").value;
    if(!email||!password){ $(".msg").textContent="Enter your email and password."; return; }
    go.disabled=true; go.textContent="Signing in…";
    const { error }=await db.auth.signInWithPassword({ email, password });
    if(error){ renderAuth(error.message); return; }
    boot();
  };
  go.onclick=submit;
  $("#pw").onkeydown=e=>{ if(e.key==="Enter") submit(); };
}

async function signOut(){ await db.auth.signOut(); renderAuth(); }

/* ===================== DASHBOARD ===================== */
async function loadAll(){
  root.innerHTML=`<div class="wrap"><div class="empty">Loading tenants…</div></div>`;
  const la = await api("list_accounts");
  if(la.error || !la.data || !la.data.ok){
    const m=(la.data&&la.data.error)||(la.error&&la.error.message)||"Could not load.";
    // 403 => signed in but not an admin
    if(/not authorized/i.test(m)){ renderNotAdmin(); return; }
    renderAuth(m); return;
  }
  state.accounts = la.data.accounts || [];
  renderDash();
}

function renderNotAdmin(){
  document.getElementById("signout").style.display="";
  root.innerHTML=`<div class="wrap"><div class="auth"><div class="card">
    <h2>Not authorized</h2>
    <p>This login isn't a platform administrator. If that's a mistake, your admin id needs to be added to the platform_admins list.</p>
    <button class="btn ghost full" onclick="signOut()">Sign out</button>
  </div></div></div>`;
}

function statCard(n,l){ return `<div class="stat"><b class="num">${fmtNum(n)}</b><span>${l}</span></div>`; }

function renderDash(){
  document.getElementById("signout").style.display="";
  // All-tenant operational metrics, computed from the loaded accounts.
  const A=state.accounts||[]; const now=Date.now(), wk=7*864e5;
  const st={
    tenants:A.length,
    active:A.filter(a=>a.status==='active').length,
    trial:A.filter(a=>a.status==='trial').length,
    needsSetup:A.filter(a=>!a.twilio_number).length,
    calls7:A.reduce((n,a)=>n+(Number(a.calls_7d)||0),0),
    new7:A.filter(a=>a.created_at && (now-new Date(a.created_at).getTime())<wk).length
  };
  const rows = state.accounts.map(a=>`
    <tr data-id="${a.id}">
      <td><div class="co">${esc(a.name||"—")}</div><div class="sub">${esc(a.industry||"—")}</div></td>
      <td class="hide-s"><div>${esc(a.owner_name||"—")}</div><div class="sub">${esc(a.owner_email||"")}</div></td>
      <td><span class="pill ${esc(a.plan||'starter')}">${esc(a.plan||'starter')}</span></td>
      <td><span class="pill ${esc(a.status||'trial')}">${esc(a.status||'trial')}</span></td>
      <td class="hide-s">${a.twilio_number?`<span class="mono">${esc(prettyPhone(a.twilio_number))}</span>`:'<span class="sub">none</span>'}</td>
      <td class="num">${fmtNum(a.calls_7d)}<span class="sub"> / ${fmtNum(a.call_count)}</span></td>
      <td class="num hide-s">${fmtNum(a.contact_count)}</td>
      <td class="sub hide-s">${ago(a.last_call_at)}</td>
    </tr>`).join("");
  root.innerHTML=`<div class="wrap">
    <div class="stats">
      ${statCard(st.tenants,"Tenants")}
      ${statCard(st.active,"Active")}
      ${statCard(st.trial,"On trial")}
      ${statCard(st.needsSetup,"Need setup")}
      ${statCard(st.calls7,"Calls · 7d")}
      ${statCard(st.new7,"New · 7d")}
    </div>
    <h1 class="page">Tenants</h1>
    <div class="lede">Every account on Donna. Click a row to manage its plan, status, and number.</div>
    <div class="tbl">
      ${state.accounts.length?`<table>
        <thead><tr>
          <th>Business</th><th class="hide-s">Owner</th><th>Plan</th><th>Status</th>
          <th class="hide-s">Number</th><th>Calls 7d/all</th><th class="hide-s">Contacts</th><th class="hide-s">Last call</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`:`<div class="empty">No tenants yet.</div>`}
    </div>
    <h1 class="page" style="margin-top:30px">Needs review</h1>
    <div class="lede">Interactions worth a look across all tenants, last 30 days. Click a tenant to open it.</div>
    <div id="review-section" class="tbl"><div class="empty">Loading…</div></div>
    <h1 class="page" style="margin-top:30px">Invite codes</h1>
    <div class="lede">Closed beta: only people with a code can sign up. Create one for each person you invite.</div>
    <div id="invite-section" class="tbl">
      <style>
        .iv-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
        .iv-form label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;font-weight:600}
        .iv-inp{padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;background:var(--surface,#fff);color:var(--ink,#111)}
        .iv-code{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.03em}
        .iv-copy,.iv-revoke{border:1px solid var(--line);background:var(--surface,#fff);border-radius:7px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
        .iv-used{color:var(--muted);font-size:12px}
      </style>
      <div class="iv-form">
        <div><label>Label (who it is for)</label><input class="iv-inp" id="iv-label" placeholder="e.g. Ian at Goodwin" style="min-width:220px"></div>
        <div><label>Uses</label><input class="iv-inp" id="iv-uses" type="number" min="1" value="1" style="width:84px"></div>
        <button class="btn" id="iv-create">Create code</button>
        <span class="sub" id="iv-msg"></span>
      </div>
      <div id="iv-list"><div class="empty">Loading…</div></div>
    </div>
  </div>`;
  document.querySelectorAll("tbody tr[data-id]").forEach(tr=>tr.onclick=()=>openTenant(tr.dataset.id));
  loadReviewQueue();
  const ivc=document.getElementById("iv-create"); if(ivc) ivc.onclick=createInvite;
  loadInvites();
}
async function createInvite(){
  const btn=document.getElementById("iv-create"), msg=document.getElementById("iv-msg");
  const label=(document.getElementById("iv-label").value||"").trim();
  const uses=Math.max(1, parseInt(document.getElementById("iv-uses").value,10)||1);
  btn.disabled=true; const o=btn.textContent; btn.textContent="Creating…"; if(msg){msg.style.color="var(--muted)";msg.textContent="";}
  let r; try{ r=await api("create_invite",{label,max_uses:uses}); }catch(e){ r=null; }
  btn.disabled=false; btn.textContent=o;
  if(!r||r.error||!r.data||!r.data.ok){ if(msg){msg.style.color="var(--danger)";msg.textContent=(r&&r.data&&r.data.error)||"Could not create code.";} return; }
  document.getElementById("iv-label").value="";
  if(msg){ msg.style.color="var(--ok)"; msg.textContent="Created "+r.data.code; }
  loadInvites();
}
async function loadInvites(){
  const host=document.getElementById("iv-list"); if(!host) return;
  let r; try{ r=await api("list_invites"); }catch(e){ host.innerHTML=`<div class="empty">Could not load invite codes.</div>`; return; }
  if(!r||r.error||!r.data||!r.data.ok){ host.innerHTML=`<div class="empty">${esc((r&&r.data&&r.data.error)||"Could not load invite codes.")}</div>`; return; }
  paintInvites(r.data.invites||[]);
}
function inviteStatus(iv){
  if(iv.active!==true) return '<span class="pill paused">revoked/used</span>';
  if(iv.expires_at && new Date(iv.expires_at).getTime()<Date.now()) return '<span class="pill cancelled">expired</span>';
  return '<span class="pill active">available</span>';
}
function paintInvites(list){
  const host=document.getElementById("iv-list"); if(!host) return;
  if(!list.length){ host.innerHTML=`<div class="empty">No invite codes yet. Create one above to invite your first tester.</div>`; return; }
  host.innerHTML=`<table><thead><tr><th>Code</th><th>Label</th><th>Used</th><th>Status</th><th></th></tr></thead><tbody>${
    list.map(iv=>`<tr>
      <td><span class="iv-code">${esc(iv.code)}</span></td>
      <td>${esc(iv.label||"—")}</td>
      <td class="iv-used">${iv.used_count||0} / ${iv.max_uses||1}${iv.last_used_email?`<div class="sub">${esc(iv.last_used_email)}</div>`:''}</td>
      <td>${inviteStatus(iv)}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="iv-copy" data-copy="${esc(iv.code)}">Copy</button>
        ${iv.active===true?`<button class="iv-revoke" data-revoke="${esc(iv.code)}">Revoke</button>`:''}
      </td>
    </tr>`).join("")
  }</tbody></table>`;
  host.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{ try{ navigator.clipboard.writeText(b.dataset.copy); b.textContent="Copied"; setTimeout(()=>b.textContent="Copy",1200); }catch(e){} });
  host.querySelectorAll("[data-revoke]").forEach(b=>b.onclick=async()=>{ b.disabled=true; try{ await api("revoke_invite",{code:b.dataset.revoke}); }catch(e){} loadInvites(); });
}
const RQ_LABEL={knowledge_gap:["Knowledge gap","warn"],failed_call:["Failed call","cancelled"],abrupt_call:["Abrupt call","starter"],no_action_call:["No action","starter"],emergency_msg:["Emergency","cancelled"],repeat_caller:["Repeat caller","pro"]};
async function loadReviewQueue(){
  const host=document.getElementById("review-section"); if(!host) return;
  let r; try{ r=await api("review_queue",{days:30}); }catch(e){ host.innerHTML=`<div class="empty">Could not load the review queue.</div>`; return; }
  if(!r || r.error || !r.data || !r.data.ok){ host.innerHTML=`<div class="empty">${esc((r&&r.data&&r.data.error)||"Could not load the review queue.")}</div>`; return; }
  paintReviewQueue(r.data.items||[]);
}
function paintReviewQueue(items){
  const host=document.getElementById("review-section"); if(!host) return;
  if(!items.length){ host.innerHTML=`<div class="empty">Nothing needs review. Donna is handling things cleanly.</div>`; return; }
  // group by account, preserving the API's weight/recency order
  const groups=[]; const byId={};
  items.forEach(it=>{ let g=byId[it.account_id]; if(!g){ g={id:it.account_id,name:it.account,items:[]}; byId[it.account_id]=g; groups.push(g); } g.items.push(it); });
  host.innerHTML=`
  <style>
    .rq-acct{border:1px solid var(--line);border-radius:12px;padding:0;margin-bottom:12px;overflow:hidden}
    .rq-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--line-2,#f4f6f8);cursor:pointer}
    .rq-head .co{font-weight:700} .rq-head .cnt{margin-left:auto;color:var(--muted);font-size:12px}
    .rq-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
    .rq-detail{font-size:13px;color:var(--ink,#111)} .rq-when{margin-left:auto;color:var(--muted);font-size:11.5px;white-space:nowrap}
  </style>
  ${groups.map(g=>`
    <div class="rq-acct">
      <div class="rq-head" data-id="${esc(g.id)}"><span class="co">${esc(g.name)}</span><span class="cnt">${g.items.length} ${g.items.length===1?'item':'items'}</span></div>
      ${g.items.slice(0,40).map(it=>{ const lab=RQ_LABEL[it.reason]||[it.reason,"starter"]; return `<div class="rq-item"><span class="pill ${lab[1]}">${esc(lab[0])}</span><span class="rq-detail">${esc(it.detail||"")}</span><span class="rq-when">${esc(ago(it.at))}</span></div>`; }).join("")}
    </div>`).join("")}`;
  host.querySelectorAll(".rq-head[data-id]").forEach(el=>el.onclick=()=>openTenant(el.dataset.id));
}

/* ===================== TENANT DRAWER ===================== */
function closeDrawer(){ $("#drawer").classList.remove("show"); $("#scrim").classList.remove("show"); state.openId=null; }
$("#dclose").onclick=closeDrawer; $("#scrim").onclick=closeDrawer;

async function openTenant(id){
  state.openId=id;
  $("#scrim").classList.add("show"); $("#drawer").classList.add("show");
  $("#dtitle").textContent="Loading…"; $("#dsub").textContent=""; $("#dbody").innerHTML=`<div class="empty">Loading…</div>`;
  const r = await api("account_detail",{account_id:id});
  if(r.error || !r.data || !r.data.ok){ $("#dbody").innerHTML=`<div class="empty">${esc((r.data&&r.data.error)||"Could not load.")}</div>`; return; }
  paintTenant(r.data);
}

function paintTenant(d){
  const a=d.account, asst=d.assistant, routing=(asst&&asst.routing)||{};
  const summ = state.accounts.find(x=>x.id===a.id)||{};
  $("#dtitle").textContent=a.name||"Tenant";
  $("#dsub").innerHTML=`${esc(a.industry||"—")} · joined ${dt(a.created_at)}`;
  // Mirror the live call-routing logic: Pro accounts with a directory transfer
  // to the directory's general contact; everyone else uses the single number.
  const tr = (routing && routing.transfer) || {};
  const dir = Array.isArray(routing.directory) ? routing.directory.filter(p=>p&&String(p.phone||"").trim()) : [];
  const useDir = (a.plan==="pro") && dir.length>0;
  let xfer;
  if(tr.enabled!==true){ xfer = (dir.length||tr.number) ? "off" : "not set"; }
  else if(useDir){
    const gen = dir.filter(p=>p.general===true).sort((x,y)=>(Number(x.order)||99)-(Number(y.order)||99));
    const primary = gen[0]||dir[0];
    xfer = prettyPhone(primary.phone) + (primary.name?` · ${esc(primary.name)}`:"") + (dir.length>1?` (+${dir.length-1} more)`:"");
  }
  else if(tr.number){ xfer = prettyPhone(tr.number); }
  else { xfer = "not set"; }
  const langs = (asst&&asst.languages&&asst.languages.length)?asst.languages.join(", "):"en";
  const users = (d.users||[]).map(u=>`<div class="uitem"><b>${esc(u.full_name||"—")}</b> · ${esc(u.role||"")}<br><span class="sub">${esc(u.email||"")}${u.phone?" · "+esc(prettyPhone(u.phone)):""}</span></div>`).join("")||`<div class="sub">No users.</div>`;
  const emails = (d.email_addresses||[]).map(e=>`<div class="uitem mono">${esc(e.address||e.email||JSON.stringify(e))}</div>`).join("")||`<div class="sub">No inbound email configured.</div>`;
  const calls = (d.recent_calls||[]).map(c=>`<div class="callitem"><b>${esc(prettyPhone(c.from_number)||"Unknown")}</b> <span class="sub">· ${esc(c.outcome||c.status||"")} · ${ago(c.started_at)}</span>${c.summary?`<br><span class="sub">${esc(c.summary.slice(0,120))}</span>`:""}</div>`).join("")||`<div class="sub">No calls yet.</div>`;

  // Health summary + setup checklist (mirrors how the dashboard/backend read each item)
  const sc = d.setup_counts||{};
  const settings = a.settings||{};
  const bh = (routing && routing.business_hours) || {};
  const checks = [
    ["Phone number", !!(asst&&asst.twilio_number)],
    ["Knowledge loaded", (Number(sc.knowledge)||Number(summ.knowledge_count)||0)>0],
    ["Business hours", (Number(sc.availability_rules)||0)>0 || (Array.isArray(bh.windows)&&bh.windows.length>0)],
    ["Transfer set", !!(tr.enabled===true && (tr.number || dir.length))],
    ["Inbound email", !!settings.inbound_address || (Array.isArray(d.email_addresses)&&d.email_addresses.length>0)]
  ];
  const doneCount = checks.filter(c=>c[1]).length;
  const c7 = Number(summ.calls_7d)||0;
  const healthLine = `${c7} call${c7===1?"":"s"} this week · last call ${ago(summ.last_call_at)}`;
  const setupNote = (asst&&asst.twilio_number) ? "" : " · no number yet";

  $("#dbody").innerHTML=`
    <div class="sec health">
      <div class="hrow">
        <span class="pill ${esc(a.status||'trial')}">${esc(a.status||'trial')}</span>
        <span class="pill ${esc(a.plan||'starter')}">${esc(a.plan||'starter')}</span>
        <span class="hgrow"></span>
        <span class="hsetup ${doneCount===checks.length?'all':''}">${doneCount}/${checks.length} set up</span>
      </div>
      <div class="hline">${esc(healthLine)}${esc(setupNote)}</div>
      <div class="checks">
        ${checks.map(c=>`<div class="chk ${c[1]?'ok':'no'}"><span class="ci">${c[1]?'✓':'✗'}</span>${esc(c[0])}</div>`).join("")}
      </div>
    </div>

    <div class="sec">
      <h3>Plan &amp; status</h3>
      <div class="row">
        <div class="fld"><label>Plan</label>
          <select class="in" id="d-plan">
            ${["starter","pro","enterprise"].map(p=>`<option value="${p}" ${a.plan===p?"selected":""}>${p}</option>`).join("")}
          </select></div>
        <div class="fld"><label>Status</label>
          <select class="in" id="d-status">
            ${["trial","active","paused","cancelled"].map(p=>`<option value="${p}" ${a.status===p?"selected":""}>${p}</option>`).join("")}
          </select></div>
        <button class="btn sm" id="d-save-plan">Save</button>
      </div>
      <div class="hint">A number can only be provisioned once status is <b>active</b>.</div>
      <div class="msg" id="d-plan-msg"></div>
    </div>

    <div class="sec">
      <h3>Open tenant dashboard</h3>
      <div class="sub" style="margin-bottom:10px">Opens this tenant's dashboard in a sandbox window so you can set it up or troubleshoot as them. It's held in memory only, never saved on this device, and locks itself after 5 minutes of inactivity. You stay signed in as admin in this window.</div>
      <button class="btn" id="d-imp">Open tenant view</button>
      <div class="msg" id="d-imp-msg"></div>
    </div>

    <div class="sec">
      <h3>Password &amp; access</h3>
      <div class="fld" style="margin-bottom:10px"><label>Login</label>
        <select class="in" id="d-pwuser">
          ${(d.users||[]).map(u=>`<option value="${esc(u.id)}" data-email="${esc(u.email||"")}">${esc(u.full_name||u.email||"User")} · ${esc(u.role||"")}</option>`).join("")}
        </select></div>
      <div class="row">
        <div class="fld"><label>Set a new password</label><input class="in" id="d-pw" type="text" placeholder="at least 8 characters" autocomplete="new-password"></div>
        <button class="btn sm" id="d-pw-set">Set</button>
      </div>
      <div class="hint">Setting it here changes their password immediately. Share it with them securely, and they can change it later.</div>
      <div class="row" style="margin-top:10px">
        <button class="btn sm ghost" id="d-pw-reset">Email them a reset link</button>
      </div>
      <div class="hint">Sends a link to their email so they choose their own password.</div>
      <div class="msg" id="d-pw-msg"></div>
    </div>

    <div class="sec">
      <h3>Donna number</h3>
      ${asst&&asst.twilio_number
        ? `<div class="kv"><span class="k">Current number</span><span class="v mono">${esc(prettyPhone(asst.twilio_number))}</span></div>
           <div class="hint">To change it, enter a new area code below and replace.</div>`
        : `<div class="sub" style="margin-bottom:10px">No number yet.</div>`}
      <div class="row" style="margin-top:10px">
        <div class="fld"><label>Area code</label><input class="in" id="d-area" maxlength="3" placeholder="817" inputmode="numeric"></div>
        <button class="btn sm" id="d-prov">${asst&&asst.twilio_number?"Replace number":"Get number"}</button>
      </div>
      <div class="msg" id="d-prov-msg"></div>
    </div>

    <div class="sec">
      <h3>Assistant</h3>
      <div class="kv"><span class="k">Name</span><span class="v">${esc(asst&&asst.assistant_name||"Donna")}</span></div>
      <div class="kv"><span class="k">Answering</span><span class="v"><span class="dot ${asst&&asst.is_active?"on":"off"}"></span>${asst&&asst.is_active?"On":"Off"}</span></div>
      <div class="kv"><span class="k">Languages</span><span class="v">${esc(langs)}</span></div>
      <div class="kv"><span class="k">Live transfer to</span><span class="v mono">${esc(xfer)}</span></div>
    </div>

    <div class="sec">
      <h3>Usage</h3>
      <div class="kv"><span class="k">Calls (7 days / all)</span><span class="v num">${fmtNum(summ.calls_7d)} / ${fmtNum(summ.call_count)}</span></div>
      <div class="kv"><span class="k">Contacts</span><span class="v num">${fmtNum(summ.contact_count)}</span></div>
      <div class="kv"><span class="k">Email threads</span><span class="v num">${fmtNum(summ.conversation_count)}</span></div>
      <div class="kv"><span class="k">Knowledge entries</span><span class="v num">${fmtNum(summ.knowledge_count)}</span></div>
    </div>

    <div class="sec"><h3>People</h3>${users}</div>
    <div class="sec"><h3>Inbound email</h3>${emails}</div>
    <div class="sec"><h3>Recent calls</h3>${calls}</div>

    <div class="sec">
      <h3>Rename business</h3>
      <div class="row">
        <div class="fld"><label>Business name</label><input class="in" id="d-name" value="${esc(a.name||"")}"></div>
        <div class="fld"><label>Industry</label><input class="in" id="d-ind" value="${esc(a.industry||"")}"></div>
        <button class="btn sm ghost" id="d-save-name">Save</button>
      </div>
      <div class="msg" id="d-name-msg"></div>
    </div>`;

  // plan + status
  $("#d-save-plan").onclick=async(e)=>{
    const btn=e.target, m=$("#d-plan-msg"); btn.disabled=true; const o=btn.textContent; btn.textContent="Saving…"; m.textContent="";
    const r=await api("set_plan",{account_id:a.id, plan:$("#d-plan").value, status:$("#d-status").value});
    btn.disabled=false; btn.textContent=o;
    if(r.data&&r.data.ok){ m.style.color="var(--ok)"; m.textContent="Saved."; await refreshRow(a.id); }
    else { m.style.color="var(--danger)"; m.textContent=(r.data&&r.data.error)||"Could not save."; }
  };
  // open tenant dashboard (sandbox impersonation)
  $("#d-imp").onclick=()=>{
    const m=$("#d-imp-msg");
    // open the window synchronously so pop-up blockers don't stop it
    const w=window.open(location.origin+"/?imp=1","_blank");
    if(!w){ m.style.color="var(--danger)"; m.textContent="Allow pop-ups for this site, then try again."; return; }
    m.style.color="var(--muted)"; m.textContent="Opening tenant view…";
    let tokens=null, ready=false, done=false;
    const trySend=()=>{ if(ready&&tokens&&!done){ done=true; w.postMessage(Object.assign({type:"donna-imp-session"},tokens), location.origin); window.removeEventListener("message",onMsg); m.style.color="var(--ok)"; m.textContent="Tenant view opened in a new window."; } };
    const onMsg=(e)=>{ if(e.origin!==location.origin) return; if(e.data&&e.data.type==="donna-imp-ready"){ ready=true; trySend(); } };
    window.addEventListener("message", onMsg);
    api("impersonate",{account_id:a.id}).then(r=>{
      if(r.data&&r.data.ok){ tokens={access_token:r.data.access_token, refresh_token:r.data.refresh_token}; trySend(); }
      else { try{w.close();}catch(e){} window.removeEventListener("message",onMsg); m.style.color="var(--danger)"; m.textContent=(r.data&&r.data.error)||(r.error&&r.error.message)||"Could not open tenant view."; }
    }).catch(()=>{ try{w.close();}catch(e){} window.removeEventListener("message",onMsg); m.style.color="var(--danger)"; m.textContent="Could not open tenant view."; });
  };
  // password: set directly
  $("#d-pw-set").onclick=async(e)=>{
    const btn=e.target, m=$("#d-pw-msg"); const pw=$("#d-pw").value;
    if(pw.length<8){ m.style.color="var(--danger)"; m.textContent="Password must be at least 8 characters."; return; }
    const uid=$("#d-pwuser").value;
    btn.disabled=true; const o=btn.textContent; btn.textContent="Setting…"; m.textContent="";
    const r=await api("set_password",{account_id:a.id, user_id:uid, password:pw});
    btn.disabled=false; btn.textContent=o;
    if(r.data&&r.data.ok){ m.style.color="var(--ok)"; m.textContent="Password set. Share it with them securely."; }
    else { m.style.color="var(--danger)"; m.textContent=(r.data&&r.data.error)||"Could not set password."; }
  };
  // password: send reset email
  $("#d-pw-reset").onclick=async(e)=>{
    const btn=e.target, m=$("#d-pw-msg");
    const sel=$("#d-pwuser"); const email=sel.options[sel.selectedIndex]?sel.options[sel.selectedIndex].getAttribute("data-email"):"";
    btn.disabled=true; const o=btn.textContent; btn.textContent="Sending…"; m.textContent="";
    const r=await api("send_reset",{account_id:a.id, email});
    btn.disabled=false; btn.textContent=o;
    if(r.data&&r.data.ok){ m.style.color="var(--ok)"; m.textContent="Reset link sent to "+esc(r.data.email||email)+"."; }
    else { m.style.color="var(--danger)"; m.textContent=(r.data&&r.data.error)||"Could not send reset link."; }
  };
  // provision
  $("#d-prov").onclick=async(e)=>{
    const btn=e.target, m=$("#d-prov-msg"); const area=($("#d-area").value||"").replace(/\D/g,"");
    if(area.length!==3){ m.style.color="var(--danger)"; m.textContent="Enter a 3-digit area code."; return; }
    const replace = !!(asst&&asst.twilio_number);
    if(replace && !confirm("This releases the current number and gets a new one. Continue?")) return;
    btn.disabled=true; const o=btn.textContent; btn.textContent="Working…"; m.style.color="var(--muted)"; m.textContent="";
    const r=await api("provision_number",{account_id:a.id, area_code:area, replace});
    btn.disabled=false; btn.textContent=o;
    if(r.data&&r.data.ok){ m.style.color="var(--ok)"; m.textContent="Number: "+(r.data.phone_number_pretty||prettyPhone(r.data.phone_number)); await refreshRow(a.id); setTimeout(()=>openTenant(a.id),700); }
    else { m.style.color="var(--danger)"; m.textContent=(r.data&&r.data.error)||"Could not get a number."; }
  };
  // rename
  $("#d-save-name").onclick=async(e)=>{
    const btn=e.target, m=$("#d-name-msg"); btn.disabled=true; const o=btn.textContent; btn.textContent="Saving…"; m.textContent="";
    const r=await api("update_account",{account_id:a.id, name:$("#d-name").value, industry:$("#d-ind").value});
    btn.disabled=false; btn.textContent=o;
    if(r.data&&r.data.ok){ m.style.color="var(--ok)"; m.textContent="Saved."; $("#dtitle").textContent=$("#d-name").value; await refreshRow(a.id); }
    else { m.style.color="var(--danger)"; m.textContent=(r.data&&r.data.error)||"Could not save."; }
  };
}

async function refreshRow(id){
  const r=await api("list_accounts");
  if(r.data&&r.data.ok){ state.accounts=r.data.accounts||[]; const kept=state.openId; renderDash(); state.openId=kept; }
}

/* ===================== BOOT ===================== */
async function boot(){
  const { data:{ session } } = await db.auth.getSession();
  if(!session){ renderAuth(); return; }
  const { data:{ user } } = await db.auth.getUser();
  document.getElementById("who").textContent = user&&user.email ? user.email : "";
  document.getElementById("signout").onclick=signOut;
  loadAll();
}
boot();
</script>
</body>
</html>
