  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 'Figtree',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
  button{font:inherit;cursor:pointer;border:0}

  .top .sub{font-size:13px;opacity:.85;margin-top:1px}

  .wrap{padding:16px 16px 0;max-width:560px;margin:0 auto}

  .big.warn{background:#fff;color:var(--warn);border:2px solid #f0dcb6;box-shadow:none}
  .big{scroll-margin-bottom:120px}
  .big:active{transform:scale(.985)}
  .big:disabled{opacity:.55}
  .big svg{width:28px;height:28px;flex:none}
  .row{display:flex;gap:10px}
  .row .big{margin-bottom:0}
  .job{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
  .job:first-child{border-top:0;padding-top:0}
  .job .t{min-width:74px;font-weight:800;font-size:17px}
  .job .t small{display:block;font-weight:600;color:var(--muted);font-size:12px;margin-top:2px}
  .job .b{flex:1;min-width:0}
  .job .n{font-weight:700;font-size:17px}
  .job .a{color:var(--ink2);font-size:14.5px;margin-top:2px}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eef2ee;color:var(--ink2);margin-top:6px;text-transform:uppercase;letter-spacing:.04em}

  .line{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
  .line:first-of-type{border-top:0}
  .line .d{flex:1;font-weight:600}
  .line .d small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}

  .line .x{width:38px;height:38px;border-radius:50%;background:#f3f5f3;color:var(--muted);font-size:20px;font-weight:700}

  .auth .big{min-height:62px;font-size:19px}

  .lang button{min-height:44px;padding:0 14px;border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:700}
  .lang button.on{border-color:var(--accent);background:var(--accent-soft)}
  .install{background:#fff8e8;border:1px solid #f3e2b8;border-radius:var(--r);padding:12px 14px;font-size:14px;color:#6b4e12;margin-bottom:12px}
  .install b{display:block;margin-bottom:2px}
  .install button{margin-top:8px;background:var(--warn);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700}
  .empty{text-align:center;color:var(--muted);padding:24px 8px;font-size:16px}
  .back{background:none;color:#fff;font-weight:700;font-size:15px;padding:6px 10px;border-radius:10px}
  a.map{display:inline-block;margin-top:8px;color:var(--accent-deep);font-weight:700;text-decoration:none;font-size:15px}

  @keyframes sh{to{background-position:-200% 0}}

  .inv:first-child{border-top:0}
  .inv .n{font-weight:700}.inv .s{font-size:13px;color:var(--muted)}
  .inv .amt{font-weight:800;font-variant-numeric:tabular-nums}
  .sm{min-height:42px;padding:0 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent-deep);font-weight:700;font-size:14px}
</style>

", photos:"Fotos", emerg:"Fuera de horario", bio_t:"Bloqueo con Face ID / huella", bio_on:"Pedir Face ID o huella al abrir Donna", bio_unsupported:"Este teléfono o navegador no ofrece Face ID / huella aquí.", bio_set:"Bloqueo activado en este teléfono.", bio_fail:"No se pudo configurar. Intenta de nuevo.", unlock_t:"Donna está bloqueada", unlock:"Desbloquear", unlock_pw:"Usar contraseña", unlock_fail:"No se reconoció. Intenta de nuevo." }
};
// Spanish command aliases so a Spanish-speaking owner can talk to Donna naturally; mapped to the English commands crew-text understands.
const ES_CMD = [[/^(voy en camino|en camino|saliendo|ya voy)\s*(\d+)?/i,(m)=>"omw "+(m[2]||"")],[/^(llegu[eé]|ya llegu[eé]|aqu[ií] estoy)/i,()=>"here"],[/^(termin[eé]|listo|ya acab[eé]|acab[eé])/i,()=>"done"],[/^(voy tarde|tarde|retrasado)\s*(\d+)?/i,(m)=>"late "+(m[2]||"")],[/^(hoy|trabajos|agenda)/i,()=>"today"],[/^(qu[eé] sigue|siguiente|pr[oó]ximo)/i,()=>"next"],[/^(ayuda)/i,()=>"help"],[/^(s[ií]|ok|bien|est[aá] bien|correcto)$/i,()=>"ok"],[/^(enviar|env[ií]a|manda|mandar)/i,()=>"send"],[/^(despu[eé]s|luego|espera)/i,()=>"later"],[/^(pagado|pagaron|me pagaron|efectivo)/i,()=>"paid cash"],[/^(cheque)/i,()=>"paid check"],[/^(nota)\s+(.+)/i,(m)=>"note "+m[2]],[/^(agrega|agregar|a[ñn]ade)\s+(.+?)\s+(\d+(?:\.\d+)?)$/i,(m)=>`add ${m[2]} ${m[3]}`],[/^(precio)\s+(\d+(?:\.\d+)?)/i,(m)=>"price "+m[2]],[/^(descuento)\s+(\d+(?:\.\d+)?)/i,(m)=>"discount "+m[2]]];

let lang = (()=>{ try{ return localStorage.getItem("donna_lang") || ((navigator.language||"en").startsWith("es") ? "es" : "en"); }catch(e){ return "en"; } })();
const t = (k, vars) => { let s = (STR[lang] && STR[lang][k]) || STR.en[k] || k; if(vars) for(const v in vars) s = s.replace("{"+v+"}", vars[v]); return s; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(fn, body){
  const { data:{ session: s } } = await db.auth.getSession(); if(!s) throw new Error("no session");
  const r = await fetch(FN+fn, { method:"POST", headers:{ "Content-Type":"application/json", Authorization:"Bearer "+s.access_token, apikey:SB_KEY }, body:JSON.stringify(body||{}) });
  return r.json();
}
function fmtTime(iso){ try{ return new Intl.DateTimeFormat(lang==="es"?"es-US":"en-US",{ timeZone:(acct&&acct.settings&&acct.settings.timezone)||undefined, hour:"numeric", minute:"2-digit" }).format(new Date(iso)); }catch(e){ return ""; } }

function paintNav(){ nav.style.display="flex"; nav.querySelectorAll("button").forEach(b=>{ b.classList.toggle("on", b.dataset.go===state.screen || (state.screen==="job"&&b.dataset.go==="today")); }); nav.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t)); }

// ---------- install banner ----------
let deferredInstall=null; window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferredInstall=e; });
function installBanner(){
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone; if(standalone) return "";
  let dismissed=false; try{ dismissed = localStorage.getItem("donna_install_dismissed")==="1"; }catch(e){}
  if(dismissed) return "";
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  return `<div class="install"><b>${t("install_t")}</b>${ios?t("install_ios"):t("install_and")}${(!ios&&deferredInstall)?`<br><button id="installBtn">${t("install_btn")}</button>`:""} <button id="installX" style="background:none;color:#6b4e12;float:right;margin-top:0;padding:0 6px;font-size:18px">×</button></div>`;
}
function wireInstall(){ const b=document.getElementById("installBtn"); if(b) b.onclick=async()=>{ if(deferredInstall){ deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall=null; render(); } }; const x=document.getElementById("installX"); if(x) x.onclick=()=>{ try{ localStorage.setItem("donna_install_dismissed","1"); }catch(e){} render(); }; }

// ---------- Face ID / fingerprint lock (per phone) ----------
// The phone's own authenticator gates the already-saved session. It never leaves the device and the server isn't involved;
// it's a lock on the app, the same idea as a banking app asking for your face before showing balances.
const BIO_KEY="donna_bio_cred";
const b64=(buf)=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64=(s)=>Uint8Array.from(atob(String(s).replace(/-/g,"+").replace(/_/g,"/")), c=>c.charCodeAt(0));
function bioCred(){ try{ return localStorage.getItem(BIO_KEY)||""; }catch(e){ return ""; } }
async function bioAvailable(){ try{ return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }catch(e){ return false; } }
async function bioEnroll(){
  const uid=(session&&session.user&&session.user.id)||"donna";
  const cred=await navigator.credentials.create({ publicKey:{
    challenge:crypto.getRandomValues(new Uint8Array(32)),
    rp:{ name:"Donna", id:location.hostname },
    user:{ id:new TextEncoder().encode(uid), name:(me&&me.email)||"donna", displayName:(me&&me.full_name)||"Donna" },
    pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
    authenticatorSelection:{ authenticatorAttachment:"platform", userVerification:"required", residentKey:"preferred" },
    timeout:60000, attestation:"none" } });
  try{ localStorage.setItem(BIO_KEY, b64(cred.rawId)); }catch(e){}
  try{ sessionStorage.setItem("donna_unlocked","1"); }catch(e){}
  return true;
}
async function bioVerify(){
  const id=bioCred(); if(!id) return true;
  await navigator.credentials.get({ publicKey:{ challenge:crypto.getRandomValues(new Uint8Array(32)), rpId:location.hostname, allowCredentials:[{ type:"public-key", id:unb64(id), transports:["internal"] }], userVerification:"required", timeout:60000 } });
  try{ sessionStorage.setItem("donna_unlocked","1"); }catch(e){}
  return true;
}
function bioLocked(){ if(!bioCred()) return false; try{ return sessionStorage.getItem("donna_unlocked")!=="1"; }catch(e){ return true; } }

    <button class="big" id="unlock">${t("unlock")}</button>
    <button class="big alt" id="unlockPw">${t("unlock_pw")}</button>
    <div class="msg err">${msg?esc(msg):""}</div></div>`;
  document.getElementById("unlock").onclick=async()=>{ try{ await bioVerify(); render(); }catch(e){ renderLock(t("unlock_fail")); } };
  document.getElementById("unlockPw").onclick=async()=>{ try{ localStorage.removeItem(BIO_KEY); }catch(e){} await db.auth.signOut(); session=null; render(); };
  // Try straight away; iOS may want a tap first, in which case the button is right there.
  bioVerify().then(()=>render()).catch(()=>{});
}

// ---------- boot ----------
async function boot(){
  const { data:{ session: s } } = await db.auth.getSession(); session=s;
  if(!session){ renderAuth(); return; }
  try{
    const { data: u } = await db.from("users").select("id, full_name, email, account_id, role").eq("id", session.user.id).maybeSingle(); me=u;
    if(u){ const { data: a } = await db.from("accounts").select("id, name, industry, settings").eq("id", u.account_id).maybeSingle(); acct=a; }
  }catch(e){}
  state.screen="today"; render();
}
db.auth.onAuthStateChange((ev, s)=>{ if(ev==="SIGNED_IN"&&!session){ session=s; boot(); } });
if("serviceWorker" in navigator){ navigator.serviceWorker.register("/crew-sw.js").catch(()=>{}); }
boot();
</script>
</body>
</html>
