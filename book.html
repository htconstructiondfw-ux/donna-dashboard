<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Book an appointment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4efe9; --card:#fffdfb; --ink:#2b2228; --ink2:#5c5057; --muted:#978a90;
    --line:#ece3db; --line2:#f4ede6;
    --accent:#a05c6b; --accent-deep:#834655; --accent-soft:#f6e9ec;
    --ok:#4e7a5a; --danger:#b4443a;
    --shadow:0 12px 42px -14px rgba(74,45,55,.20);
    --radius:18px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Figtree',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:540px;margin:0 auto;padding:30px 18px 52px}
  .brand{display:flex;align-items:center;gap:13px;margin:6px 2px 22px}
  .brand .dot{width:50px;height:50px;border-radius:15px;background:linear-gradient(140deg,var(--accent),var(--accent-deep));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:23px;font-family:'Fraunces',Georgia,serif;box-shadow:0 7px 20px -7px rgba(131,69,86,.55)}
  .brand b{font-family:'Fraunces',Georgia,serif;font-size:27px;font-weight:600;letter-spacing:-.015em;line-height:1.08;display:block}
  .brand small{display:block;color:var(--muted);font-size:13px;font-weight:500;margin-top:4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:14px}
  h2{font-family:'Fraunces',Georgia,serif;font-size:17px;margin:14px 0 4px;font-weight:500}
  .step-label{font-size:12px;letter-spacing:.01em;color:var(--accent-deep);font-weight:600;margin:0 0 16px;display:flex;align-items:center;gap:8px}
  .step-label:before{content:"";width:18px;height:1.5px;background:var(--accent);border-radius:2px}
  .prog{display:flex;gap:7px;margin:0 0 20px}
  .prog .seg{flex:1;display:flex;flex-direction:column;gap:7px}
  .prog .seg:before{content:"";height:3px;border-radius:3px;background:var(--line);transition:.25s}
  .prog .seg.on:before{background:var(--accent)}
  .prog .seg span{font-size:10.5px;color:var(--muted);font-weight:600}
  .prog .seg.on span{color:var(--accent-deep)}
  .opt{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:16px 2px;cursor:pointer;border-bottom:1px solid var(--line2);transition:padding .14s}
  .opt:last-of-type{border-bottom:none}
  .opt:hover{padding-left:7px}
  .opt.has-av{align-items:center}
  .opt .nm{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:18.5px;letter-spacing:-.01em}
  .opt .meta{color:var(--muted);font-size:13px;margin-top:3px}
  .opt .desc{color:var(--ink2);font-size:13px;margin-top:6px;line-height:1.45}
  .opt .price{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:16.5px;white-space:nowrap}
  .opt .go{color:#cdbfc4;font-size:22px;line-height:1;align-self:center;transition:.14s}
  .opt:hover .go{color:var(--accent);transform:translateX(3px)}
  .pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.03em;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-deep);margin-left:8px;vertical-align:middle}
  .incl{list-style:none;margin:8px 0 0;padding:0}
  .incl li{font-size:12.5px;color:var(--ink2);padding-left:18px;position:relative;margin-bottom:2px}
  .incl li:before{content:"\2726";position:absolute;left:0;color:var(--accent);font-size:11px}
  .av{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;flex:none;font-family:'Fraunces',Georgia,serif}
  .daygroup{margin-bottom:18px}
  .dayh{font-family:'Fraunces',Georgia,serif;font-size:15.5px;font-weight:500;color:var(--ink);margin:0 0 11px;display:flex;align-items:center;gap:9px}
  .dayh:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{border:1px solid var(--line);border-radius:12px;padding:11px 15px;font-size:14.5px;font-weight:500;cursor:pointer;background:#fff;transition:.14s;color:var(--ink)}
  .chip:hover{border-color:var(--accent);color:var(--accent-deep)}
  .chip.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
  label.f{display:block;font-size:13px;font-weight:600;color:var(--ink);margin:0 0 7px}
  input.inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;background:#fffefc;margin-bottom:14px;transition:.14s}
  input.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:#fff}
  .hp{position:absolute;left:-9999px;top:-9999px;height:0;width:0;opacity:0}
  .btn{width:100%;border:none;border-radius:13px;padding:15px;font:inherit;font-weight:600;font-size:15.5px;background:var(--accent);color:#fff;cursor:pointer;transition:.14s;box-shadow:0 8px 20px -8px rgba(131,69,86,.55)}
  .btn:hover{background:var(--accent-deep)}
  .btn:disabled{opacity:.5;cursor:default;box-shadow:none}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:600;box-shadow:none}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent-deep)}
  .pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
  .pg{width:auto!important;padding:11px 16px;font-size:14px}
  .back{background:none;border:none;color:var(--muted);font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;padding:2px 0;margin-bottom:14px;transition:.14s}
  .back:hover{color:var(--accent-deep)}
  .summary{font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:15px;color:var(--ink2);margin-bottom:18px}
  .msg{font-size:13.5px;margin-top:12px}
  .msg.err{color:var(--danger)}
  .center{text-align:center;padding:22px 8px}
  .center .big{width:68px;height:68px;margin:0 auto 18px;border-radius:50%;background:linear-gradient(140deg,var(--accent),var(--accent-deep));color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 10px 28px -8px rgba(131,69,86,.6)}
  .center h3{margin:0 0 8px;font-size:24px;font-family:'Fraunces',Georgia,serif;font-weight:500}
  .center p{color:var(--muted);margin:0;line-height:1.6}
  .other{text-align:center;font-size:13px;color:var(--muted);line-height:2}
  .other a{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1.5px solid var(--accent-soft)}
  .foot{text-align:center;color:#b3a7ad;font-size:11.5px;margin-top:22px}
  .foot a{color:#8a7d83}
  .spin{color:var(--muted);font-size:13.5px;text-align:center;padding:20px}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot" id="b-dot">·</span><div><b id="b-name">Booking</b><small id="b-sub">Loading…</small></div></div>
  <div id="app"><div class="card"><div class="spin">Loading…</div></div></div>
  <div class="foot">Powered by <a href="https://sidekicklogistics.com" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;font-weight:600">Sidekick Logistics</a></div>
</div>
<script>
const API="https://hingbdtmxozbjetzwibj.supabase.co/functions/v1/book-public";
const qs=new URLSearchParams(location.search);
const ACCOUNT=qs.get('s')||qs.get('a')||(location.pathname.split('/book/')[1]||'').replace(/\/+$/,'');
const S={info:null,service:null,stylist:null,slot:null,otpId:null,channel:null,slotStart:null};
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(action,extra){ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({action,account:ACCOUNT},extra||{}))}); return r.json().catch(()=>({ok:false})); }

function card(inner){ app.innerHTML=`<div class="card">${inner}</div>`; }
function initials(n){ return (String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('')||'?').toUpperCase(); }
function progress(active){
  const team = S.info && S.info.salon_team && !S.preStylist;
  const steps = team ? ['Service','Stylist','Time','Details'] : ['Service','Time','Details'];
  const i = steps.indexOf(active);
  return `<div class="prog">`+steps.map((s,idx)=>`<div class="seg ${idx<=i?'on':''}"><span>${esc(s)}</span></div>`).join('')+`</div>`;
}
function prettyPhone(p){ return p?String(p).replace(/^\+1(\d{3})(\d{3})(\d{4})$/,'($1) $2-$3'):''; }
function otherWays(){
  const p=S.info&&S.info.phone, e=S.info&&S.info.email;
  if(!p && !e) return '';
  const parts=[];
  if(p) parts.push(`Prefer to call? <a href="tel:${esc(String(p).replace(/[^0-9+]/g,''))}">${esc(prettyPhone(p)||p)}</a>`);
  if(e) parts.push(`Prefer email? <a href="mailto:${esc(e)}">${esc(e)}</a>`);
  return `<div class="card other">${parts.join('<br>')}</div>`;
}

async function boot(){
  if(!ACCOUNT){ card('<div class="center"><h3>Page not found</h3><p>This booking link looks incomplete.</p></div>'); return; }
  const info=await api('info');
  if(!info||!info.ok){
    const m = info&&info.reason==='not_enabled' ? 'Online booking is not turned on for this business yet.' : 'We could not load this booking page.';
    card(`<div class="center"><h3>Unavailable</h3><p>${esc(m)}</p></div>`); return;
  }
  S.info=info;
  const preId=qs.get('stylist');
  if(preId && info.salon_team){ S.preStylist=(info.stylists||[]).find(s=>s.id===preId)||null; }
  $("#b-name").textContent=info.business;
  $("#b-dot").textContent=(info.business||'B').trim().charAt(0).toUpperCase();
  $("#b-sub").textContent= S.preStylist ? ('Book with '+S.preStylist.name) : 'Book an appointment';
  document.title='Book · '+info.business;
  stepService();
}

function stepService(){
  const svc=S.info.services||[];
  if(!svc.length){ card('<div class="center"><h3>Nothing to book yet</h3><p>This business has not added any services.</p></div>'); return; }
  const cats={};
  svc.forEach(s=>{ const k=s.category||''; (cats[k]=cats[k]||[]).push(s); });
  let html=progress('Service')+'<div class="step-label">Choose a service</div>';
  Object.keys(cats).forEach(cat=>{
    if(cat) html+=`<h2>${esc(cat)}</h2>`;
    cats[cat].forEach(s=>{
      const meta=[s.dur+' min', s.new_only?'New clients':''].filter(Boolean).join('  ·  ');
      const incl=(s.includes&&s.includes.length)?`<ul class="incl">${s.includes.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`:'';
      html+=`<div class="opt" data-svc="${s.id}">
        <div><div class="nm">${esc(s.name)}${s.special?'<span class="pill">Special</span>':''}</div>
        <div class="meta">${esc(meta)}</div>
        ${s.description?`<div class="desc">${esc(s.description)}</div>`:''}${incl}</div>
        <div style="display:flex;align-items:center;gap:12px;flex:none">${s.price?`<div class="price">${esc(s.price)}</div>`:''}<span class="go">&rsaquo;</span></div></div>`;
    });
  });
  if(S.preStylist) html=`<div class="summary">Booking with ${esc(S.preStylist.name)}</div>`+html;
  app.innerHTML=`<div class="card">${html}</div>`+otherWays();
  document.querySelectorAll('[data-svc]').forEach(el=>el.onclick=()=>{ S.service=svc.find(x=>x.id===el.dataset.svc); S.slot=null; S.slotStart=null; if(S.preStylist){ S.stylist=S.preStylist; stepTime(); } else { S.stylist=null; (S.info.salon_team?stepStylist():stepTime()); } });
}

function stepStylist(){
  const pl=S.info.provider_label||'stylist';
  const list=S.info.stylists||[];
  let html=`<button class="back" id="bk">&larr; Services</button>`+progress('Stylist')+`<div class="step-label">Choose a ${esc(pl)}</div>`;
  html+=`<div class="opt has-av" data-sty="any"><div class="av">✦</div><div style="flex:1"><div class="nm">Any ${esc(pl)}</div><div class="meta">First available</div></div><span class="go">&rsaquo;</span></div>`;
  list.forEach(s=>{ html+=`<div class="opt has-av" data-sty="${s.id}"><div class="av">${esc(initials(s.name))}</div><div style="flex:1"><div class="nm">${esc(s.name)}</div></div><span class="go">&rsaquo;</span></div>`; });
  card(html);
  $("#bk").onclick=stepService;
  document.querySelectorAll('[data-sty]').forEach(el=>el.onclick=()=>{ S.stylist = el.dataset.sty==='any'?null:list.find(x=>x.id===el.dataset.sty); S.slotStart=null; stepTime(); });
}

async function stepTime(){
  const who = S.stylist? (' with '+S.stylist.name) : '';
  const goBack=()=> (S.info.salon_team && !S.preStylist) ? stepStylist() : stepService();
  card(`<button class="back" id="bk">&larr; Back</button>`+progress('Time')+`<div class="step-label">Pick a time</div><div class="summary">${esc(S.service.name)}${esc(who)}</div><div class="spin">Finding open times…</div>`);
  $("#bk").onclick=goBack;
  const r=await api('slots',{service_id:S.service.id, stylist_id:S.stylist?S.stylist.id:null, start_date:S.slotStart||null});
  const slots=(r&&r.ok&&r.slots)||[];
  const nextStart=(r&&r.next_start)||null, prevStart=(r&&r.prev_start)||null;
  let html=`<button class="back" id="bk2">&larr; Back</button>`+progress('Time')+`<div class="step-label">Pick a time</div><div class="summary">${esc(S.service.name)}${esc(who)}</div>`;
  if(!slots.length){ html+=`<p style="color:var(--muted)">No open times in this range.${nextStart?' Try later dates below.':' Please check back or contact us.'}</p>`; }
  else{
    const days={}; slots.forEach(s=>{ (days[s.day]=days[s.day]||[]).push(s); });
    Object.keys(days).forEach(day=>{
      html+=`<div class="daygroup"><div class="dayh">${esc(day)}</div><div class="chips">`;
      days[day].forEach(s=>{ html+=`<button class="chip" data-iso="${esc(s.iso)}">${esc(s.label)}</button>`; });
      html+='</div></div>';
    });
  }
  if(prevStart||nextStart){
    html+=`<div class="pager">`+
      (prevStart?`<button class="btn ghost pg" data-start="${esc(prevStart)}">&larr; Earlier</button>`:`<span></span>`)+
      (nextStart?`<button class="btn ghost pg" data-start="${esc(nextStart)}">Later dates &rarr;</button>`:`<span></span>`)+
      `</div>`;
  }
  card(html);
  $("#bk2").onclick=goBack;
  document.querySelectorAll('[data-iso]').forEach(el=>el.onclick=()=>{ S.slot=el.dataset.iso; stepDetails(); });
  document.querySelectorAll('.pg').forEach(el=>el.onclick=()=>{ S.slotStart=el.dataset.start; stepTime(); });
}

function stepDetails(){
  const gate=S.info.sms_gate;
  const who = S.stylist? (' with '+S.stylist.name) : '';
  const whenTxt=new Date(S.slot).toLocaleString([], {weekday:'long',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'});
  card(`<button class="back" id="bk">&larr; Times</button>`+progress('Details')+`<div class="step-label">Your details</div>
    <div class="summary">${esc(S.service.name)}${esc(who)} · ${esc(whenTxt)}</div>
    <label class="f">Your name</label><input class="inp" id="d-name" autocomplete="name" placeholder="First and last name">
    <label class="f">Mobile number</label><input class="inp" id="d-phone" inputmode="tel" autocomplete="tel" placeholder="(555) 123-4567">
    <label class="f">Email${gate?' <span style="color:var(--muted);font-weight:400">(optional)</span>':''}</label><input class="inp" id="d-email" type="email" autocomplete="email" placeholder="you@email.com">
    <input class="hp" id="d-hp" tabindex="-1" autocomplete="off" placeholder="Leave this blank">
    <button class="btn" id="d-go">Send me a code</button>
    <div class="msg" id="d-msg"></div>
    <p style="font-size:11.5px;color:var(--muted);margin:14px 0 0">We'll ${gate?'text':'email'} you a quick code to confirm it's really you. No account needed.</p>`);
  $("#bk").onclick=stepTime;
  $("#d-go").onclick=sendCode;
}

async function sendCode(){
  const btn=$("#d-go"), msg=$("#d-msg");
  const name=$("#d-name").value.trim(), phone=$("#d-phone").value.trim(), email=$("#d-email").value.trim();
  const hp=$("#d-hp").value;
  const setErr=t=>{ msg.className='msg err'; msg.textContent=t; };
  if(!name){ setErr('Please enter your name.'); return; }
  const gate=S.info.sms_gate;
  if(!phone){ setErr('Please enter your mobile number.'); return; }
  if(!gate && !email){ setErr('Please enter your email so we can send your code.'); return; }
  btn.disabled=true; const o=btn.textContent; btn.textContent='Sending…'; msg.textContent='';
  const r=await api('start',{service_id:S.service.id, stylist_id:S.stylist?S.stylist.id:null, start_iso:S.slot, name, phone, email, hp});
  btn.disabled=false; btn.textContent=o;
  if(r&&r.ok){ S.otpId=r.otp_id; S.channel=r.channel; stepCode(r.hint); return; }
  const reasons={slot_gone:'Sorry, that time was just taken. Please pick another.',too_many:'Too many attempts. Please try again later.',need_phone:'Please enter your mobile number.',need_contact:'Please add a phone or email.',send_failed:'We could not send your code. Check your details and try again.',spam:'Something went wrong. Please try again.'};
  setErr(reasons[r&&r.reason]||'Something went wrong. Please try again.');
  if(r&&r.reason==='slot_gone'){ setTimeout(stepTime,1200); }
}

function stepCode(hint){
  card(`<button class="back" id="bk">&larr; Back</button>`+progress('Details')+`<div class="step-label">Enter your code</div>
    <p class="summary">We sent a 4-digit code to ${esc(hint||'you')}. Enter it to confirm your booking.</p>
    <input class="inp" id="c-code" inputmode="numeric" maxlength="4" placeholder="1234" style="letter-spacing:8px;text-align:center;font-size:22px;font-family:'Fraunces',serif">
    <button class="btn" id="c-go">Confirm booking</button>
    <button class="btn ghost" id="c-resend" style="margin-top:9px">Resend code</button>
    <div class="msg" id="c-msg"></div>`);
  $("#bk").onclick=()=>stepDetails();
  $("#c-go").onclick=confirmCode;
  $("#c-resend").onclick=()=>stepDetails();
  setTimeout(()=>$("#c-code").focus(),100);
}

async function confirmCode(){
  const btn=$("#c-go"), msg=$("#c-msg");
  const code=$("#c-code").value.trim();
  if(code.length<4){ msg.className='msg err'; msg.textContent='Enter the 4-digit code.'; return; }
  btn.disabled=true; const o=btn.textContent; btn.textContent='Confirming…'; msg.textContent='';
  const r=await api('verify',{otp_id:S.otpId, code});
  btn.disabled=false; btn.textContent=o;
  if(r&&r.ok){ success(r.when_label); return; }
  const reasons={wrong_code:'That code is not right. Try again.',expired:'That code expired. Please resend.',locked:'Too many tries. Please start over.',used:'That code was already used.',slot_gone:'Sorry, that time was just taken. Please pick another.'};
  msg.className='msg err'; msg.textContent=reasons[r&&r.reason]||'Could not confirm. Try again.';
  if(r&&(r.reason==='slot_gone')){ setTimeout(stepTime,1400); }
}

function success(whenLabel){
  const who = S.stylist? (' with '+S.stylist.name) : '';
  card(`<div class="center"><div class="big">&#10003;</div><h3>You're booked!</h3>
    <p>${esc(S.service.name)}${esc(who)}<br><b style="color:var(--ink)">${esc(whenLabel||'')}</b></p>
    <p style="margin-top:12px">A confirmation is on its way. See you then!</p></div>`);
}

boot();
</script>
</body>
</html>
