<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Donna — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";}</script>
<style>
  :root{
    --ink:#13243d; --ink-2:#22375a; --canvas:#eef1f7; --surface:#ffffff;
    --line:#dfe5f0; --line-2:#eef1f7; --muted:#5d6e8c; --muted-2:#8b99b3;
    --signal:#e0892e; --signal-soft:#fbf0e0; --signal-line:#f0c790;
    --site:#c8742a; --virtual:#1f8a86; --ok:#2f9e6f; --danger:#c0492f;
    --r:13px; --r-sm:9px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45}
  h1,h2,h3,.display{font-family:'Bricolage Grotesque','Inter',sans-serif;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit;font-size:14px;color:var(--ink)}
  :focus-visible{outline:2.5px solid var(--signal);outline-offset:2px;border-radius:4px}
  a{color:inherit}
  .app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
  .side{background:var(--ink);color:#cdd8ea;padding:22px 16px;display:flex;flex-direction:column;gap:4px}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
  .brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(150deg,var(--signal),#e6a85a);display:grid;place-items:center;color:#fff;flex:none}
  .brand .mark svg{width:17px;height:17px}
  .brand b{font-family:'Bricolage Grotesque';font-size:18px;color:#fff;font-weight:700;letter-spacing:-.02em}
  .brand small{display:block;font-size:10.5px;color:#7e8db0;letter-spacing:.12em;text-transform:uppercase;margin-top:1px}
  .nav-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#62739a;padding:14px 8px 6px}
  .nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;font-size:13.5px;font-weight:500;color:#bcc9dc;border:none;background:none;width:100%;text-align:left;transition:.13s}
  .nav-item svg{width:16px;height:16px;flex:none;opacity:.85}
  .nav-item:hover{background:#1d3252;color:#fff}
  .nav-item.active{background:#26416a;color:#fff}
  .nav-item.soon{opacity:.5;cursor:default}
  .nav-item.soon:hover{background:none;color:#bcc9dc}
  .nav-item .tag{margin-left:auto;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#7e8db0;border:1px solid #2e486f;padding:1px 5px;border-radius:20px}
  .side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid #213a5e;font-size:12px;color:#8493b4}
  .side-foot b{color:#dde6f3;font-weight:600;display:block;font-size:12.5px}
  .side-foot .out{background:none;border:none;color:#8fa0c2;font-size:12px;margin-top:9px;padding:0;text-decoration:underline}
  .side-foot .out:hover{color:#fff}
  .main{padding:0;overflow:auto}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 30px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .crumbs{font-size:12.5px;color:var(--muted)} .crumbs b{color:var(--ink);font-weight:600}
  .acct-chip{display:flex;align-items:center;gap:9px;font-size:13px}
  .acct-chip .av{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
  .acct-chip .who b{font-weight:600;font-size:13px} .acct-chip .who span{color:var(--muted);font-size:11.5px}
  .page{padding:30px;max-width:920px}
  .page-head{margin-bottom:24px} .page-head h1{font-size:27px;font-weight:700}
  .page-head p{color:var(--muted);font-size:14px;margin-top:4px;max-width:62ch}
  /* billing */
  .bl-terms{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
  .bl-term{flex:1;min-width:110px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
  .bl-term b{display:block;font-size:13.5px} .bl-term span{font-size:11.5px;color:var(--muted)}
  .bl-term.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)} .bl-term.on span{color:var(--ok);font-weight:600}
  .bl-plans{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:640px){.bl-plans{grid-template-columns:1fr}}
  .bl-plan{position:relative;border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;background:var(--surface);display:flex;flex-direction:column}
  .bl-plan.pro{border-color:var(--ink);box-shadow:0 10px 30px -18px rgba(16,26,36,.45)} .bl-plan.cur{outline:2px solid var(--ok)}
  .bl-tag{position:absolute;top:-9px;right:12px;background:var(--ink);color:#fff;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:2px 9px}
  .bl-pn{font-size:17px;font-weight:700} .bl-pw{font-size:12.5px;color:var(--muted);margin-top:1px}
  .bl-pp{margin:10px 0 6px;display:flex;align-items:baseline;gap:4px} .bl-pp b{font-size:30px;letter-spacing:-.02em} .bl-pp span{color:var(--muted);font-size:13px} .bl-pp s{color:var(--muted-2);font-size:13px;margin-left:6px}
  .bl-plan ul{list-style:none;margin:0 0 14px;padding:0;font-size:12.8px;color:var(--ink-2);line-height:1.7;flex:1} .bl-plan li:before{content:"✓";color:var(--ok);font-weight:800;margin-right:7px}
  .bl-fine{font-size:11.5px;color:var(--muted);margin:10px 0 0;line-height:1.5}
  .bl-sum{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap} .bl-big{font-size:18px;font-weight:700} .bl-sub{font-size:13px;color:var(--muted);margin-top:2px}
  .bl-note{margin-top:12px;background:#f1faf5;border:1px solid #bfe3d0;border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink-2);line-height:1.5}
  .bl-note.warn{background:#fff8eb;border-color:#f3d9a8}
  .bl-meter{margin-top:14px} .bl-mh{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);gap:8px;flex-wrap:wrap} .bl-mh span{color:var(--muted);font-size:12px} .bl-mh span.l{color:var(--ink-2);font-size:13px}
  .bl-inv{width:100%;border-collapse:collapse;font-size:13px} .bl-inv th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:0 8px 8px 0;border-bottom:1px solid var(--line)} .bl-inv td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line)} .bl-inv tr:last-child td{border-bottom:none}
  .bl-bar{height:8px;border-radius:99px;background:#eef1f5;margin-top:7px;overflow:hidden} .bl-bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
  .bl-extra{font-size:12px;color:var(--muted);margin-top:6px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;margin-bottom:18px}
  .card-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
  .card-h h2{font-size:16px;font-weight:600} .card-h .hint{font-size:12px;color:var(--muted-2)}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .field{margin-bottom:15px} .field:last-child{margin-bottom:0}
  label.lab{display:block;font-size:12.5px;font-weight:550;margin-bottom:6px;color:var(--ink-2)}
  label.lab .sub{font-weight:400;color:var(--muted-2)}
  .inp,select.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fbfcfe;transition:.13s}
  .inp:focus{border-color:var(--signal);background:#fff;outline:none;box-shadow:0 0 0 3px var(--signal-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:7px 13px;border:1px solid var(--line);border-radius:20px;font-size:12.5px;background:#fbfcfe;color:var(--muted);font-weight:500;transition:.12s}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer}
  .switch .track{width:40px;height:23px;border-radius:20px;background:#cdd6e6;position:relative;transition:.16s;flex:none}
  .switch .track::after{content:"";position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.16s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch input{position:absolute;opacity:0}
  .switch input:checked + .track{background:var(--ok)}
  .switch input:checked + .track::after{transform:translateX(17px)}
  .switch .txt{font-size:13px;font-weight:500} .switch .txt small{display:block;color:var(--muted-2);font-weight:400;font-size:11.5px}
  .btn{padding:10px 17px;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:550;color:var(--ink);transition:.13s}
  .btn:hover{border-color:var(--ink-2)} .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.primary:hover{background:#0e1d33} .btn.sm{padding:6px 12px;font-size:12.5px}
  .btn:disabled{opacity:.55;cursor:default}
  .preview{background:linear-gradient(165deg,#16294a,#0f1f39);border-radius:var(--r);padding:22px 24px;color:#dbe5f5;position:relative;overflow:hidden}
  .preview::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 88% -10%,rgba(224,137,46,.22),transparent 60%)}
  .preview .live{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--signal);font-weight:600;position:relative}
  .preview .live .dot{width:8px;height:8px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 0 rgba(224,137,46,.6);animation:pulse 1.8s infinite}
  .preview.off .live{color:#6b7c9e} .preview.off .live .dot{background:#6b7c9e;animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,137,46,.55)}70%{box-shadow:0 0 0 9px rgba(224,137,46,0)}100%{box-shadow:0 0 0 0 rgba(224,137,46,0)}}
  @media (prefers-reduced-motion:reduce){.preview .live .dot{animation:none}}
  .preview .say{font-family:'Bricolage Grotesque';font-size:21px;line-height:1.4;font-weight:500;margin-top:14px;color:#fff;position:relative}
  .preview .say .v{color:#f4c98a}
  .preview .cap{font-size:11.5px;color:#8ea0c2;margin-top:13px;position:relative}
  .preview .prev-foot{display:flex;align-items:center;gap:14px;margin-top:17px;position:relative;flex-wrap:wrap}
  .preview .prev-foot .cap{margin-top:0}
  .preview .play{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;padding:8px 15px;border-radius:22px;font-size:13px;font-weight:550;transition:.13s}
  .preview .play:hover{background:rgba(255,255,255,.22)} .preview .play svg{width:13px;height:13px}
  .preview .play.speaking{background:var(--signal);border-color:var(--signal)} .preview .play:disabled{opacity:.5;cursor:default}
  .sched-row{display:grid;grid-template-columns:96px 1fr 1fr;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--line-2)}
  .sched-row:first-of-type{border-top:none} .sched-row .day{font-weight:600;font-size:13px}
  .win{display:flex;align-items:center;gap:8px}
  .win .times{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
  .win .times input{width:96px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:#fbfcfe}
  .win.off .times{opacity:.35;pointer-events:none}
  .col-h{display:grid;grid-template-columns:96px 1fr 1fr;gap:14px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);padding-bottom:6px;font-weight:600}
  .mini-switch{position:relative;display:inline-flex;align-items:center}
  .mini-switch input{position:absolute;opacity:0;width:34px;height:20px;margin:0;cursor:pointer}
  .mini-switch .t{width:34px;height:20px;border-radius:14px;background:#cdd6e6;transition:.15s;flex:none}
  .mini-switch .t::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .mini-switch input:checked + .t{background:var(--ink-2)} .mini-switch input:checked + .t::after{transform:translateX(14px)}
  .block-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:8px;background:#fbfcfe}
  .block-item .bt{font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:20px}
  .bt.dnd{background:#eef1f7;color:var(--muted)} .bt.vacation{background:#e7f3f2;color:var(--virtual)} .bt.holiday{background:var(--signal-soft);color:var(--signal)}
  .block-item .bx{font-size:13px;font-weight:500} .block-item .bx small{display:block;color:var(--muted-2);font-weight:400;font-size:11.5px}
  .block-item .rm{margin-left:auto;color:var(--muted-2);background:none;border:none;font-size:13px;padding:4px 6px;border-radius:6px}
  .block-item .rm:hover{color:var(--danger);background:#faecea}
  .m-item{border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px;margin-bottom:9px;background:#fbfcfe}
  .m-item.new{border-color:var(--signal-line);background:var(--signal-soft)}
  .m-item.done{opacity:.6}
  .m-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .m-who{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
  .m-new{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--signal);border:1px solid var(--signal-line);padding:1px 6px;border-radius:20px}
  .m-when{font-size:11.5px;color:var(--muted-2);white-space:nowrap}
  .m-num{display:inline-block;font-size:12.5px;color:var(--ink-2);font-weight:500;margin-top:2px;text-decoration:none}
  .m-num:hover{text-decoration:underline}
  .m-text{font-size:13.5px;color:var(--ink-2);margin-top:7px;line-height:1.5}
  .m-actions{margin-top:11px}
  .nav-item .tag.unread{background:var(--signal);border-color:var(--signal);color:#fff}
  .appt-status{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:2px 8px;border-radius:20px;background:#eef1f7;color:var(--muted)}
  .appt-status.s-scheduled{background:var(--signal-soft);color:var(--signal)}
  .appt-status.s-confirmed{background:#e7f4ee;color:var(--ok)}
  .appt-status.s-cancelled{background:#faecea;color:var(--danger)}
  .appt-status.s-completed{background:#e9f0fb;color:var(--ink-2)}
  .set-rows{display:flex;flex-direction:column}
  .set-row{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid var(--line-2);font-size:13.5px}
  .set-row:first-child{border-top:none}
  .set-row .k{color:var(--muted)}
  .set-row .v{font-weight:600;text-align:right;word-break:break-word}
  .lang-badge{display:inline-block;margin-left:8px;font-size:10px;letter-spacing:.04em;font-weight:700;padding:2px 8px;border-radius:20px;background:#e9f0fb;color:var(--ink-2);vertical-align:middle}
  .call-item{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 15px;margin-bottom:8px;background:#fbfcfe;cursor:pointer;transition:.12s}
  .call-item:hover{border-color:var(--ink-2)}
  .call-item.open{border-color:var(--signal);background:var(--signal-soft)}
  .call-item.live{border-color:var(--signal-line)}
  .livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--signal);margin-right:6px;vertical-align:middle;box-shadow:0 0 0 0 rgba(224,137,46,.6);animation:pulse 1.8s infinite}
  .calls-live{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ok);font-weight:600}
  .calls-live .d{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .transcript{display:flex;flex-direction:column;gap:9px}
  .tline{display:flex;flex-direction:column;max-width:80%}
  .tline .who{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-2);font-weight:600;margin-bottom:3px}
  .tline .bub{padding:9px 13px;border-radius:13px;font-size:13.5px;line-height:1.45}
  .tline.donna{align-self:flex-start}
  .tline.donna .bub{background:#eef1f7;color:var(--ink);border-bottom-left-radius:3px}
  .tline.caller{align-self:flex-end;align-items:flex-end}
  .tline.caller .bub{background:var(--ink);color:#fff;border-bottom-right-radius:3px}
  .tline.system .bub,.tline.admin .bub{background:var(--signal-soft);color:var(--signal);font-size:12.5px}
  .appt-status.s-answered,.appt-status.s-booked{background:#e7f4ee;color:var(--ok)}
  .appt-status.s-message_taken{background:var(--signal-soft);color:var(--signal)}
  .type-item{display:flex;align-items:center;gap:14px;padding:13px 16px;border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:9px;background:#fbfcfe}
  .type-item .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
  .ic.phone{background:#e7f3f2;color:var(--virtual)} .ic.virtual{background:#e9f0fb;color:var(--ink-2)} .ic.in_person{background:var(--signal-soft);color:var(--site)}
  .type-item .ic svg{width:17px;height:17px}
  .type-item .nm{font-weight:600;font-size:14px} .type-item .nm small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:1px}
  .type-item .mode{margin-left:auto;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2);font-weight:600;white-space:nowrap}
  .staff-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:13px 16px;border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:9px;background:#fbfcfe}
  .staff-row .staff-main{flex:1 1 360px;min-width:0} .staff-row .staff-main b{font-weight:600;font-size:14px} .staff-row .staff-main small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .staff-row .staff-meta{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none} .staff-row .staff-act{flex:none}
  .pill{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;color:var(--muted-2);border:1px solid var(--line);border-radius:20px;padding:2px 8px;white-space:nowrap}
  .pill.ok{color:var(--ok);border-color:#bfe3d0;background:#f1faf5} .pill.mgr{color:var(--ink-2);border-color:#c9d6ea;background:#eef3fb}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
  .cal-dow span{text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-2)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-cell{min-height:66px;border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 7px;cursor:pointer;background:#fcfdff;position:relative;transition:border-color .1s}
  .cal-cell.out{opacity:.4} .cal-cell:hover{border-color:var(--muted-2)}
  .cal-cell.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
  .cal-cell.today .cal-dnum{background:var(--ink);color:#fff;border-radius:50%;width:21px;height:21px;display:inline-flex;align-items:center;justify-content:center}

    <div class="msg" id="auth-msg"></div>
    ${signup?`
    <div class="field"><label class="lab">Invite code <span class="sub">Donna is in closed beta</span></label><input class="inp" id="f-invite" placeholder="DONNA-XXXX-XXXX" autocapitalize="characters"></div>

    <div class="grid-2">
      <div class="field"><label class="lab">Your name</label><input class="inp" id="f-name" placeholder="Full name"></div>

    <div class="grid-2">
      <div class="field"><label class="lab">Email</label><input class="inp" id="f-email" type="email" placeholder="you@business.com" value="${signup?'':esc((()=>{try{return localStorage.getItem('donna-last-email')||''}catch(e){return ''}})())}"></div>

function renderForgot(){
  document.getElementById("root").innerHTML = `
  <div class="gate"><div class="gate-card">
    <div class="brand"><span class="mark">${I.bot}</span><div><b>${esc(DEFAULT_NAME)}</b><small>Reset your password</small></div></div>

function authErr(t){ const m=$("#auth-msg"); m.className="msg err"; m.textContent=t; }
function authOk(t){ const m=$("#auth-msg"); m.className="msg ok"; m.textContent=t; }

async function doSignup(){
  const email=$("#f-email").value.trim(), password=$("#f-pass").value;
  const invite=($("#f-invite")?$("#f-invite").value:"").trim();
  if(!invite){ authErr("An invite code is required. Donna is in closed beta."); return; }
  if(!email||password.length<8){ authErr("Enter an email and a password of at least 8 characters."); return; }
  $("#f-go").disabled=true;
  const { data, error } = await db.auth.signUp({ email, password, options:{ data:{
    invite_code:invite,
    company:$("#f-company").value.trim(), industry:$("#f-industry").value,
    full_name:$("#f-name").value.trim(), title:$("#f-title").value.trim(), phone:$("#f-phone").value.trim()
  }}});
  $("#f-go").disabled=false;
  if(error){
    const m=(error.message||"").toLowerCase();
    if(m.includes("invite")||m.includes("database error saving")) authErr("That invite code is not valid or has already been used. Check it and try again.");
    else authErr(error.message);
    return;
  }
  if(data.session){ await boot(); }            // email confirmation off -> straight in
  else { authOk("Account created. Check your email to confirm, then sign in."); state.authMode="login"; setTimeout(renderAuth,1600); }
}
async function doLogin(){
  const email=$("#f-email").value.trim(), password=$("#f-pass").value;
  if(!email||!password){ authErr("Enter your email and password."); return; }
  $("#f-go").disabled=true;
  const { error } = await db.auth.signInWithPassword({ email, password });
  $("#f-go").disabled=false;
  if(error){ authErr(error.message); return; }
  try{ localStorage.setItem('donna-last-email', email); }catch(e){}
  await boot();
}
async function doForgot(){
  const email=$("#f-email").value.trim();
  if(!email){ authErr("Enter your email."); return; }
  $("#f-go").disabled=true;
  const redirectTo = location.href.split('#')[0];
  const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo });
  $("#f-go").disabled=false;
  if(error){ authErr(error.message); return; }
  authOk("If an account exists for that email, a reset link is on its way. Check your inbox.");
}
async function doReset(){
  const p1=$("#f-pass").value, p2=$("#f-pass2").value;
  if(p1.length<8){ authErr("Password must be at least 8 characters."); return; }
  if(p1!==p2){ authErr("Passwords do not match."); return; }
  $("#f-go").disabled=true;
  const { error } = await db.auth.updateUser({ password:p1 });
  $("#f-go").disabled=false;
  if(error){ authErr(error.message); return; }
  authOk("Password updated. Signing you in…");
  pendingRecovery=false;
  setTimeout(boot, 1200);
}
// Full reload on sign-out so nothing cached in memory (team, properties, listings, invoices) survives into the next login.
async function signOut(){ try{ await db.auth.signOut(); }catch(_e){} location.replace(location.pathname); }

/* ===================== DATA LOAD ===================== */
async function loadData(){
  const { data:{ user } } = await db.auth.getUser();
  if(!user) return false;
  const { data: me } = await db.from('users').select('*').eq('id', user.id).maybeSingle();
  if(!me){ return false; }   // trigger may still be settling
  state.owner = { id:me.id, name:me.full_name||"Owner", email:me.email, title:me.title||"Owner", phone:me.phone||"", role:me.role||"owner", bookable:!!me.is_bookable };
  const { data: acct } = await db.from('accounts').select('*').eq('id', me.account_id).single();
  state.account = { id:acct.id, company:acct.name, industry:acct.industry, plan:acct.plan, status:acct.status, settings:acct.settings||{}, timezone:(acct.settings&&acct.settings.timezone)||'America/Chicago' };
  const { data: asst } = await db.from('assistants').select('*').eq('account_id', acct.id).order('created_at').limit(1).maybeSingle();
  if(asst){
    state.assistantId = asst.id;
    state.assistant = {
      name:asst.assistant_name||DEFAULT_NAME, greetingLabel:asst.greeting_label||"the office",
      voice:asst.voice_id||"warm-female", languages:(asst.languages&&asst.languages.length)?asst.languages:["en"],
      number:asst.twilio_number||"", recordingNotice:!(asst.routing&&asst.routing.recording_notice===false), active:true,
      routing:(asst.routing&&typeof asst.routing==='object')?asst.routing:{}
    };
  }
  const { data: types } = await db.from('appointment_types').select('*').eq('account_id', acct.id).order('created_at');
  state.types = (types||[]).map(typeFromRow);
  const { data: rules } = await db.from('availability_rules').select('*').eq('user_id', me.id);
  state.schedule = DAYS.map(()=>({ working:{on:false,start:"08:00",end:"18:00"}, bookable:{on:false,start:"09:00",end:"15:00"} }));
  (rules||[]).forEach(r=>{ const w = r.rule_type==='working'?state.schedule[r.day_of_week].working:state.schedule[r.day_of_week].bookable; w.on=true; w.start=(r.start_time||"08:00").slice(0,5); w.end=(r.end_time||"18:00").slice(0,5); });
  const { data: blocks } = await db.from('calendar_blocks').select('*').eq('user_id', me.id).eq('source','manual').order('starts_at');
  state.blocks = (blocks||[]).map(b=>({ id:b.id, type:b.block_type, start:(b.starts_at||"").slice(0,10), end:(b.ends_at||"").slice(0,10), reason:b.reason||"" }));
  await loadAppointments();
  // Reception/business activity is for managers only; stylists get a focused, own-schedule view.
  if(isManager()){
    await loadMessages();
    await loadCalls();
    await loadContacts();
    await loadGaps();
    await loadConversations();
  } else {
    await loadMessages(); // RLS scopes a stylist to messages addressed to them
    state.calls=[]; state.contacts=[]; state.gaps=[]; state.conversations=[];
    if(!['schedule','appointments','clients','messages','mylink'].includes(state.view)) state.view='appointments';
  }
  return true;
}

/* ===================== APP SHELL ===================== */
function isManager(){ return ['owner','admin'].includes((state.owner&&state.owner.role)||'owner'); }
function salonOn(){ const f=(state.account&&state.account.settings&&state.account.settings.features)||{}; return !!f.salon; }
function propertyOn(){ const f=(state.account&&state.account.settings&&state.account.settings.features)||{}; return !!f.property_management; }
// Payments (shared module, exposed per vertical): contractors today; any account with features.payments later.
function paymentsOn(){ const ac=state.account||{}; const f=(ac.settings&&ac.settings.features)||{}; return ac.industry==='contractor' || ac.industry==='junior' || !!f.payments || !!f.junior; }
function realEstateOn(){ const ac=state.account||{}; const f=(ac.settings&&ac.settings.features)||{}; return ac.industry==='real_estate' || !!f.real_estate; }
function reSettings(){ return (state.account&&state.account.settings&&state.account.settings.real_estate)||{}; }
// Solo vs team is driven by the plan: starter is solo, Pro/Enterprise is a team.
function salonMode(){ return teamAllowed() ? 'team' : 'solo'; }
function isSolo(){ return salonOn() && salonMode()==='solo'; }
function showStaff(){ return isManager() && teamAllowed(); }
// What this salon calls the people who take appointments (stylist/technician/barber/…).
function providerLabel(){ const ac=state.account||{}; const s=ac.settings||{}; if(s.provider_label) return String(s.provider_label).toLowerCase(); const ind=String(s.industry||ac.industry||'').toLowerCase(); const f=s.features||{}; if(ind==='contractor') return 'technician'; if(ind==='real_estate'||f.real_estate) return 'agent'; if(f.property_management||ind==='property_management') return 'property manager'; if(f.salon||ind==='salon') return 'stylist'; return 'team member'; }
function bookableLabel(){ const ac=state.account||{}; const s=ac.settings||{}; const ind=String(s.industry||ac.industry||'').toLowerCase(); const f=s.features||{}; if(ind==='contractor') return ['Takes jobs', `${aName()} can book and dispatch jobs to this person.`]; if(ind==='real_estate'||f.real_estate) return ['Takes showings', `${aName()} can book showings and route leads to this agent.`]; if(f.property_management||ind==='property_management') return ['Takes visits', `${aName()} can book inspections and visits with this manager.`]; return ['Takes appointments', `${aName()} can book clients with this person.`]; }
function providerLabelCap(){ const s=providerLabel(); return s.charAt(0).toUpperCase()+s.slice(1); }
function providerLabelPlural(){ return providerLabel()+'s'; }
// Team mode (multiple providers) is a Pro feature; starter is solo-only.
function teamAllowed(){ const p=String((state.account&&state.account.plan)||'').toLowerCase(); return p==='pro'||p==='enterprise'; }
function renderApp(){
  const mgr=isManager();
  if(!mgr && juniorOn()){ if(![...JR_VIEWS,'messages','account'].includes(state.view)||state.view==='jr_parent') state.view='jr_home'; }
  else if(!mgr && !['today','schedule','appointments','clients','messages','waitlist','mylink','jobs','money','account','listings','leads','requests','properties'].includes(state.view)) state.view='today';
  if(mgr && juniorOn() && !state._jrHomed){ state._jrHomed=true; state.view='jr_parent'; }
  // A solo owner lives in their day; land there on first load, then leave navigation free.
  if(mgr && isSolo() && !state._homed){ state._homed=true; if(state.view==='assistant') state.view='today'; }
  if(new URLSearchParams(location.search).get('mine')) state.view=mgr?'settings':'account';
  else if(mgr && new URLSearchParams(location.search).get('calendar')) state.view='settings';
  if(mgr && new URLSearchParams(location.search).get('dues')) state.view='dues';
  if(mgr && new URLSearchParams(location.search).get('payments') && !state._payReturned){ state._payReturned=true; state.view=(salonOn()&&!paymentsOn())?'money':'settings'; setTimeout(()=>{ if($("#pay-card")) paintPaymentsCard(true); },600); try{ history.replaceState(null,'',location.pathname); }catch(e){} }
  let navConfig, navActivity, soon=[];
  if(mgr){
    const pm=pmMode();
    navConfig=[["assistant","Assistant",I.bot],["schedule","Schedule",I.cal],["types",pm?"Visit types":(salonOn()?"Services":"Appointment types"),I.tag]];
    if(showStaff()) navConfig.push(["staff","Team",I.users]);
    navConfig.push(["knowledge","Knowledge",I.book],["booking",pm?"Self-scheduling":"Booking page",I.link]);
    if(!pm) navConfig.push(["intake","Intake forms",I.clip],["promotions","Promotions",I.promo]);
    navConfig.push(["notifications","Notifications",I.bell],["settings","Settings",I.gear]);
    navActivity=[["calls","Calls",I.phone],["appointments","Appointments",I.appt],["messages","Phone messages",I.msg],["contacts",salonOn()?"Clients":"Contacts",I.users],["gaps","Questions",I.book],["conversations","Inbox",I.mail]];
    if(salonOn()) navActivity.splice(2,0,["waitlist","Waitlist",I.clock]);
    if(!pmMode()) navActivity.splice(0,0,["today","Today",I.clock]);
    if(paymentsOn()) navActivity.splice(1,0,["jobs","Jobs & money",I.card]);
    if(salonOn()) navActivity.splice(pmMode()?0:1,0,["money","Checkout & money",I.card]);
    // Real estate + managed rentals on one account: say what each list IS, not two near-synonyms with the same icon.
    //   Listings = what the agent is selling / leasing (house icon)   ·   Managed rentals = homes they manage for owners (building)
    //   Vendors = the repair people for those managed homes (wrench)  ·   Leads & documents = buyers/sellers/renters + e-sign
    const re=realEstateOn(), prop=propertyOn();
    if(re){ navConfig.splice(1,0,["listings",prop?"Listings (for sale & rent)":"Listings",I.home]); navActivity.splice(1,0,["leads","Leads & documents",I.sign]); }
    if(prop){ navConfig.splice(re?2:1,0,["properties",re?"Managed rentals":"Properties",I.building]); navConfig.splice(re?3:2,0,["contractors",re?"Vendors":"Contractors",I.wrench]); navActivity.splice(0,0,["requests",re?"Maintenance requests":"Service requests",I.wrench]); }
    if(prop||re){ navActivity.splice(prop?1:2,0,["dues","Communities & dues",I.home]); navActivity.splice(prop?2:3,0,["rent","Rent",I.card]); }
    soon=[["billing","Billing",I.card]];  // rendered as a real nav item under "Running"
  } else {
    // Stylist: focused view — their own bookings, messages, clients, and their own availability.
    navConfig=[["today","Today",I.clock],["appointments","My appointments",I.appt],["messages","Phone messages",I.msg],["clients","Clients",I.users],["schedule","My availability",I.cal]];
    if(salonOn()) navConfig.splice(3,0,["waitlist","Waitlist",I.clock]);
    if(salonOn()) navConfig.push(["mylink","My booking link",I.link]);
    if(paymentsOn()) navConfig.splice(1,0,["jobs","Jobs & money",I.card]);
    if(salonOn()) navConfig.splice(1,0,["money","My money",I.card]);
    // Agents: their listings, leads and documents. Property managers: their properties and requests. (Rows are filtered server-side.)
    if(realEstateOn()){ navConfig.splice(1,0,["listings","My listings",I.home],["leads","My leads & documents",I.sign]); navConfig=navConfig.filter(n=>n[0]!=='clients'); }
    if(propertyOn()){ navConfig.splice(1,0,["requests",realEstateOn()?"Maintenance requests":"Service requests",I.wrench],["properties","My properties",I.building]); }
    navConfig.push(["account","My account",I.gear]);
    navActivity=[];
  }
  if(juniorOn()){
    // Kid: a short, friendly menu. Parent: the same pages plus Parent corner and the grown-up settings.
    const jr=[["jr_home","Home",I.clock],["jr_jobs","Jobs",I.appt],["jr_customers","Customers",I.users],["jr_money","Money",I.card],["jr_stuff","Supplies",I.clip],["jr_posts","Posts and flyers",I.promo],["jr_plan","My business plan",I.book]];
    if(mgr){ navConfig=[["jr_parent","Parent corner",I.users],["assistant","Assistant",I.bot],["schedule","Schedule",I.cal],["staff","Team",I.users],["knowledge","Knowledge",I.book],["settings","Settings",I.gear]]; navActivity=jr.concat([["calls","Calls",I.phone],["messages","Phone messages",I.msg],["appointments","Appointments",I.appt]]); soon=[["billing","Billing",I.card]]; }
    else { navConfig=jr.concat([["messages","Phone messages",I.msg],["account","My account",I.gear]]); navActivity=[]; }
  }
  const navCount=v=>{ if(v==='messages') return unreadCount(); if(v==='conversations') return (state.conversations||[]).filter(c=>c.status==='awaiting_staff').length; if(v==='gaps') return (state.gaps||[]).length; return 0; };
  const navBtn=n=>{ const _c=navCount(n[0]); return `<button class="nav-item ${state.view===n[0]?'active':''}" data-v="${n[0]}">${n[2]}<span>${n[1]}</span>${_c?`<span class="tag unread">${_c}</span>`:''}</button>`; };
  const initials=(state.owner.name||"O").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();

  const cg=$("#bl-change"); if(cg) cg.onclick=()=>{ const el=$("#bl-pick"); const open=el.style.display==='none'; el.style.display=open?'block':'none'; cg.textContent=open?'Close':'Change plan'; if(open) bindPlanPicker(el, r.prices, { term:b.term, current:{tier:b.tier,term:b.term}, cta:'Switch to' }, async(tier,term)=>{

      if(!(await uiConfirm(msg,{okText:'Switch plan',cancelText:'Not now'}))) return false;

  const ad=$("#bl-addon"); if(ad) ad.onclick=async()=>{ const j=r.prices.junior||{}; const on=!b.texting_addon;
    if(!(await uiConfirm(on?`Add two-way texting? ${blMoney(j.addon_cents||500)} a month is added to your plan and a one-time ${blMoney(j.addon_setup_cents||2000)} setup goes on your next bill.`:'Remove two-way texting from your plan? Texts will go out from Donna only.',{okText:on?'Add it':'Remove it',cancelText:'Not now'}))) return;

  const cd=$("#bl-card"); if(cd) cd.onclick=async()=>{ cd.disabled=true; const res=await billingApi({ action:'card' }); if(res.ok&&res.url) location.href=res.url; else { cd.disabled=false; m.style.color='var(--danger)'; m.textContent=blErr(res); } };
  const cn=$("#bl-cancel"); if(cn) cn.onclick=async()=>{
    const msg=b.sub_status==='trialing'?`Cancel your free trial? ${aName()} keeps answering until ${b.trial_anchored?blDate(b.trial_end):'the trial ends'}, then stops, and you won't be charged.`:(committed?`Your ${b.term==='2y'?'2-year':'1-year'} plan runs until ${blDate(b.commitment_ends_at)}. Billing continues monthly until then, and the plan ends that day instead of going month to month.`:`End your plan? ${aName()} keeps answering until ${blDate(b.current_period_end)}, then stops. You won't be charged again.`);
    if(!(await uiConfirm(msg,{okText:b.sub_status==='trialing'?'Cancel trial':'End plan',cancelText:'Keep my plan'}))) return;
    cn.disabled=true; done(await billingApi({ action:'cancel' })); };
  document.querySelectorAll('[data-bl-ext]').forEach(x=>x.onclick=async()=>{ const term=x.dataset.blExt; const pr=r.prices.tiers[b.tier].price;
    const msg=term===b.term?`Extend for another ${term==='2y'?'2 years':'year'} at ${blMoney(pr[term])} a month? It starts when your current commitment ends on ${blDate(b.commitment_ends_at)}.`:`Switch to a 2-year plan at ${blMoney(pr['2y'])} a month? The lower price starts now, and the 2 years start when your current commitment ends on ${blDate(b.commitment_ends_at)}.`;
    if(!(await uiConfirm(msg,{okText:'Extend',cancelText:'Not now'}))) return; x.disabled=true; done(await billingApi({ action:'extend', term })); });
  const rs=$("#bl-resume"); if(rs) rs.onclick=async()=>{ rs.disabled=true; done(await billingApi({ action:'resume' })); };

// Coming back from Stripe Checkout: confirm right away (the webhook may still be on its way).
async function billingReturn(){
  const q=new URLSearchParams(location.search); const kind=q.get('billing'); if(!kind) return;
  try{ history.replaceState(null,'',location.pathname); }catch(_e){}
  if(kind==='cancelled'){ state._billingNote='Checkout was cancelled. Nothing was charged.'; return; }
  const sid=q.get('session_id'); if(!sid) return;
  const r=await billingApi({ action:'confirm', session_id:sid });
  if(r.ok){ state._billingFresh=r; state.billingOk=true; }
}

function greetingText(){ const a=state.assistant; let s=`Hello, this is <span class="v">${esc(a.name||DEFAULT_NAME)}</span> with ${esc(a.greetingLabel||"the office")}. `; if(a.recordingNotice) s+=`Just so you know, this call may be recorded for quality and training. `; const oq=((a.routing||{}).opening_question||"").trim(); return s+(oq?esc(oq):`How can I help you?`); }
function greetingPlain(){ const a=state.assistant; let s=`Hello, this is ${a.name||DEFAULT_NAME} with ${a.greetingLabel||"the office"}. `; if(a.recordingNotice) s+=`Just so you know, this call may be recorded for quality and training. `; const oq=((a.routing||{}).opening_question||"").trim(); return s+(oq?oq:`How can I help you?`); }
function pickVoice(g){ const all=window.speechSynthesis.getVoices(); const en=all.filter(v=>/^en(-|_|$)/i.test(v.lang)); const pool=en.length?en:all; const f=/(female|samantha|victoria|zira|karen|moira|tessa|susan|fiona|serena|allison|ava|jenny|aria)/i; const m=/(daniel|alex|david|fred|aaron|thomas|oliver|arthur|gordon|guy|ryan)/i; const want=g==="female"?f:m; return pool.find(v=>want.test(v.name))||pool[0]||null; }
function speakGreeting(btn){ if(!('speechSynthesis' in window))return; const lbl=btn.querySelector(".lbl"); if(window.speechSynthesis.speaking){window.speechSynthesis.cancel();return;} const u=new SpeechSynthesisUtterance(greetingPlain()); const v=pickVoice(state.assistant.voice.includes("female")?"female":"male"); if(v)u.voice=v; u.rate=1;u.pitch=1; u.onstart=()=>{btn.classList.add("speaking");lbl.textContent="Stop";}; u.onend=u.onerror=()=>{btn.classList.remove("speaking");lbl.textContent="Play greeting";}; window.speechSynthesis.speak(u); }

async function saveAssistant(){

function winHTML(i,kind,w){ return `<div class="win ${w.on?'':'off'}" id="win-${kind}-${i}"><label class="mini-switch"><input type="checkbox" id="sw-${kind}-${i}" ${w.on?'checked':''}><span class="t"></span></label><span class="times"><input type="time" id="st-${kind}-${i}" value="${w.start}"> – <input type="time" id="et-${kind}-${i}" value="${w.end}"></span></div>`; }
function blockHTML(b,idx){ const fmt=d=>d?new Date(d+"T00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"}):""; const range=b.start===b.end?fmt(b.start):`${fmt(b.start)} – ${fmt(b.end)}`; return `<div class="block-item"><span class="bt ${b.type}">${b.type==="dnd"?"DND":b.type}</span><span class="bx">${esc(b.reason||({dnd:"Do Not Disturb",vacation:"Time off",holiday:"Holiday"}[b.type]))}<small>${range}</small></span><button class="rm" data-id="${b.id||''}" data-i="${idx}" title="Remove">✕</button></div>`; }

async function saveHours(){

    if(d.bookable.on) rows.push({account_id:state.account.id,user_id:state.owner.id,rule_type:'bookable',appointment_type_id:null,day_of_week:i,start_time:d.bookable.start,end_time:d.bookable.end});
  });

async function addBlock(){
  const s=$("#b-start").value; if(!s){ const b=$("#b-add"); const o=b.textContent; b.textContent="Pick a date"; setTimeout(()=>b.textContent=o,1100); return; }
  const en=$("#b-end").value||s;

async function removeBlock(id,idx){

async function verifyVideo(provider){
  const msg=$("#vid-msg"); const setMsg=(t,c)=>{ if(msg){ msg.style.color=c||"var(--muted)"; msg.textContent=t; } };
  const gb=$("#vid-google"), mb=$("#vid-ms"); if(gb) gb.disabled=true; if(mb) mb.disabled=true;
  setMsg("Verifying…");
  let r=null; try{ r=(await db.functions.invoke("donna-video",{body:{action:"verify",provider}})).data; }catch(_e){}
  if(gb) gb.disabled=false; if(mb) mb.disabled=false;
  if(r&&r.ok){ setMsg("Verified.","var(--ok)"); paintVideoCard(); return; }
  const reason=r&&r.reason;
  const pname=provider==="microsoft"?"Microsoft":"Google";
  if(reason==="not_connected"){ setMsg(pname+" isn't connected yet. Opening the sign-in — approve access, then come back and click Verify again.","var(--muted)"); connectCalendar(provider); return; }
  if(reason==="teams_unavailable"){ setMsg("That Microsoft account can't create Teams meetings. Teams needs a business Microsoft 365 account. Use Google Meet, or a business Microsoft account.","var(--danger)"); return; }
  if(reason==="auth_failed"){ setMsg("Please reconnect "+pname+" and try again.","var(--danger)"); connectCalendar(provider); return; }
  setMsg("Couldn't verify "+pname+". Try again.","var(--danger)");
}

async function saveTypeEdit(id){

  const set=(t,c)=>{ if(msg){ msg.style.color=c||'var(--muted)'; msg.textContent=t; } };
  const name=(g('name').value||'').trim(); if(!name){ set('Give it a name.','var(--danger)'); return; }
  const mode=g('mode').value;
  if(mode==='virtual'){ let vp=state.videoProvider; if(!vp){ try{ const r=await db.functions.invoke('donna-video',{body:{action:'status'}}); if(r.data&&r.data.ok) vp=r.data.video_provider; }catch(_e){} state.videoProvider=vp; } if(!vp){ set('Verify a video provider before using Virtual.','var(--danger)'); return; } }

  const ovOn=!!(g('ov')&&g('ov').checked); let overlap=ovOn?(+(g('ovmin')&&g('ovmin').value)||0):0; if(overlap>dur) overlap=dur; if(overlap<0) overlap=0;
  const recall=(+((g('recall')&&g('recall').value)||0)||0);
  const incl=((g('includes')&&g('includes').value)||'').split('\n').map(s=>s.trim()).filter(Boolean);
  const special=!!(g('special')&&g('special').checked);
  const patch={ name, mode, default_duration_min:dur, buffer_after_min:+g('after').value||0, requires_travel:(!salonOn()&&g('travel').checked), overlap_minutes:overlap, rebook_after_days: recall>0?recall:null,
    description:((g('desc')&&g('desc').value.trim())||null), price:((g('price')&&g('price').value.trim())||null), category:((g('category')&&g('category').value.trim())||null), includes: incl.length?incl:null,
    is_special:special, special_starts: special?((g('sstart')&&g('sstart').value)||null):null, special_ends: special?((g('send')&&g('send').value)||null):null, new_clients_only: special?!!(g('newonly')&&g('newonly').checked):false };
  const btn=document.querySelector('#types [data-save-type="'+id+'"]'); if(btn){ btn.disabled=true; btn.textContent='Saving…'; } set('Saving…');

async function loadActivity(limit){
  const el=$("#act-list"); if(!el) return;
  const money=c=>'$'+(Math.round(c||0)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  try{

    if(error) throw error; const rows=data||[];
    if(!rows.length){ el.innerHTML='<p style="font-size:13px;color:var(--muted)">Nothing yet. Voids, price changes, approvals and team changes will show up here with who did them.</p>'; return; }
    const verb=r=>{ const d=r.details||{}; const L=r.label?`<b>${esc(r.label)}</b>`:'';
      switch(r.action){
        case 'invoice.void': return `voided invoice ${L}${d.total_cents?` (${money(d.total_cents)})`:''}`;
        case 'invoice.reprice': return `changed invoice ${L} from ${money(d.from_cents)} to ${money(d.to_cents)}`;
        case 'invoice.paid': return `marked invoice ${L} paid${d.method?` (${esc(d.method)})`:''}${d.total_cents?` · ${money(d.total_cents)}`:''}`;
        case 'estimate.void': return `voided estimate ${L}`;
        case 'estimate.approve': return `approved estimate ${L}${d.total_cents?` (${money(d.total_cents)})`:''} to go out`;
        case 'estimate.reprice': return `changed estimate ${L} from ${money(d.from_cents)} to ${money(d.to_cents)}`;
        case 'user.deactivate': return `deactivated ${L}`;
        case 'user.reactivate': return `reactivated ${L}`;
        case 'user.create': return `added ${L}${d.role?` as ${esc(d.role==='admin'?'manager':providerLabel())}`:''}${d.invited?' (invited by email)':''}`;
        case 'user.role': return `changed ${L}'s role from ${esc(d.from||'')} to ${esc(d.to||'')}`;
        case 'user.bookable_on': return `made ${L} bookable`;
        case 'user.bookable_off': return `took ${L} off the booking list`;
        default: if(/\.reassign$/.test(r.action)) return `moved ${r.entity} ${L} ${d.from?`from ${esc(d.from)} `:''}to ${esc(d.to||'unassigned')}`; return `${esc(r.action)} ${L}`;
      } };
    el.innerHTML=`<div style="display:flex;flex-direction:column">${rows.map(r=>`<div style="display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line-2);font-size:13px"><div style="min-width:150px;color:var(--muted);font-size:12px">${esc(new Date(r.created_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))}</div><div><b>${esc(r.actor_name||(r.actor_user_id?'Someone':aName()))}</b> ${verb(r)}</div></div>`).join('')}</div>`;
    const more=$("#act-more"); if(more) more.style.display=(rows.length>=(limit||40)&&(limit||40)<200)?'':'none';
  }catch(e){ el.innerHTML='<p style="font-size:13px;color:var(--danger)">Could not load.</p>'; }
}

function unreadCount(){ return state.messages.filter(m=>m.status==='new').length; }
function parseMsg(body){
  let s=body||"", urgent=false, forName="";
  const mu=/^\[URGENT\]\s*/.exec(s); if(mu){ urgent=true; s=s.slice(mu[0].length); }
  const mf=/^\(For ([^)]+)\)\s*/.exec(s); if(mf){ forName=mf[1]; s=s.slice(mf[0].length); }
  const m = /^Message from (.+?)(?: \(callback: (.+?)\))?: ([\s\S]*)$/.exec(s);
  if(m) return { name:m[1], number:m[2]||"", text:m[3], urgent, forName };
  return { name:"", number:"", text:s, urgent, forName };
}
function fmtWhen(iso){
  const d=new Date(iso), now=new Date();
  const t=d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  return d.toDateString()===now.toDateString() ? `Today ${t}` : d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+` · ${t}`;
}

function msgHTML(m){

async function renderThread(){
  const c=(state.conversations||[]).find(x=>x.id===state.openConvId);
  if(!c){ state.openConvId=null; return pageConversations(); }
  const { data:msgs } = await db.from('conversation_messages').select('*').eq('conversation_id',c.id).order('created_at',{ascending:true});
  state.threadMsgs = msgs||[];
  const draft = [...state.threadMsgs].reverse().find(m=>m.direction==='outbound' && m.status==='queued');
  const lastIn = [...state.threadMsgs].reverse().find(m=>m.direction==='inbound');
  const replyingTo = lastIn ? `<div class="th-replyto"><div class="th-role">Replying to ${esc(c.customer_name||c.customer_identifier||'the customer')}</div><div class="th-quote">${esc((lastIn.subject?('Re: '+lastIn.subject+'\n\n'):'')+(lastIn.body||''))}</div></div>` : '';
  const rowsHtml = state.threadMsgs.map(m=>{
    if(m.direction==='outbound' && m.status!=='sent') return '';
    const role = m.direction==='inbound'?(c.channel==='sms'?'Client (text)':'Customer'):(m.actor==='staff'?'You':aName());
    const cls = m.direction==='inbound'?'th-in':'th-out';
    return `<div class="th-msg ${cls}"><div class="th-role">${esc(role)}${m.subject?' \u00b7 '+esc(m.subject):''}</div><div class="th-body">${esc(m.body||'')}</div></div>`;
  }).join("");
  const draftHtml = c.channel==='sms' ? `
    <div class="th-msg th-out">
      <div class="th-role">Text back as ${esc(state.account.name||'the business')}</div>
      <textarea class="th-edit" id="th-draft" style="min-height:80px" placeholder="Type a text to ${esc(c.customer_name||c.customer_identifier||'the client')}… ${esc(aName())} keeps handling their replies."></textarea>
      <div class="th-actions"><span class="th-msgtxt" id="th-msg"></span>
        <button class="btn sm primary" data-act="sendsms">Send text</button>
      </div>
    </div>` : draft ? `
    <div class="th-msg th-draft">
      <div class="th-role">${esc(aName())}'s draft \u2014 review before sending</div>
      ${replyingTo}
      <textarea class="th-edit" id="th-draft">${esc(draft.body||'')}</textarea>
      <div class="th-actions"><span class="th-msgtxt" id="th-msg"></span>
        <button class="btn sm" data-act="discard">Discard</button>
        <button class="btn sm primary" data-act="send" data-mid="${draft.id}">Approve & send</button>
      </div>
    </div>` : `
    <div class="th-msg th-out">
      <div class="th-role">Reply as ${esc(aName())}</div>
      ${replyingTo}
      <textarea class="th-edit" id="th-draft" placeholder="Type a reply to send to ${esc(c.customer_identifier||'the customer')}\u2026"></textarea>
      <div class="th-actions"><span class="th-msgtxt" id="th-msg"></span>
        <button class="btn sm primary" data-act="sendnew">Send</button>
      </div>
    </div>`;
  $("#page").innerHTML=`
  <style>
    .th-msg{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
    .th-in{background:var(--surface)} .th-out{background:#f2f7ff} .th-draft{background:#fff8ec;border-color:#f0d9a8}
    .th-role{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-bottom:4px}
    .th-body{white-space:pre-wrap;line-height:1.5;color:var(--ink)}
    .th-edit{width:100%;min-height:140px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;line-height:1.55;background:var(--surface);color:var(--ink);resize:vertical}
    .th-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;align-items:center}
    .th-msgtxt{font-size:12.5px;margin-right:auto}
    .th-replyto{border-left:3px solid #d9b877;background:#fffdf7;padding:8px 12px;border-radius:0 8px 8px 0;margin:4px 0 10px}
    .th-quote{white-space:pre-wrap;color:#6b5a38;font-size:13px;line-height:1.5;max-height:160px;overflow:auto;margin-top:3px}
  </style>
  <div class="page">
    <div class="page-head"><button class="btn sm" id="th-back">\u2190 Inbox</button>
      <h1 style="margin-top:10px">${esc(c.customer_name||c.customer_identifier||'Customer')}</h1>
      <p>${esc(c.customer_identifier||'')}</p></div>
    <div class="card">${rowsHtml}${draftHtml}</div>
  </div>`;
  $("#th-back").onclick=()=>{ state.openConvId=null; pageConversations(); };

}
function bindThreadActions(c){
  const msg=$("#th-msg");
  const send=async(mid)=>{
    const ta=$("#th-draft"); const bodyText=ta?ta.value.trim():"";
    if(!bodyText){ if(msg){msg.style.color='var(--danger)';msg.textContent='Nothing to send.';} return; }
    const btns=document.querySelectorAll('.th-actions .btn'); btns.forEach(b=>b.disabled=true);
    if(msg){ msg.style.color='var(--muted)'; msg.textContent='Sending\u2026'; }
    try{
      const payload = mid ? { message_id:mid, body:bodyText } : { conversation_id:c.id, body:bodyText };
      const { data, error }=await db.functions.invoke("email-send",{ body:payload });
      if(error || !data || !data.ok){ throw new Error((data&&data.error)||(error&&error.message)||'send failed'); }
      await loadConversations(); state.openConvId=c.id; renderThread();
    }catch(e){ btns.forEach(b=>b.disabled=false); if(msg){msg.style.color='var(--danger)';msg.textContent='Could not send. '+(e.message||'');} }
  };
  const sBtn=document.querySelector('[data-act="send"]'); if(sBtn) sBtn.onclick=()=>send(sBtn.dataset.mid);
  const tBtn=document.querySelector('[data-act="sendsms"]'); if(tBtn) tBtn.onclick=async()=>{
    const ta=$("#th-draft"); const bodyText=ta?ta.value.trim():""; if(!bodyText){ if(msg){msg.style.color='var(--danger)';msg.textContent='Nothing to send.';} return; }
    tBtn.disabled=true; if(msg){ msg.style.color='var(--muted)'; msg.textContent='Sending…'; }
    try{ const { data, error }=await db.functions.invoke("staff-text",{ body:{ action:'reply', conversation_id:c.id, body:bodyText } }); if(error||!data||!data.ok) throw new Error((data&&data.error)||(error&&error.message)||'send failed'); await loadConversations(); state.openConvId=c.id; renderThread(); }
    catch(e){ tBtn.disabled=false; if(msg){ msg.style.color='var(--danger)'; msg.textContent='Could not send. '+(e.message||''); } }
  };
  const nBtn=document.querySelector('[data-act="sendnew"]'); if(nBtn) nBtn.onclick=()=>send(null);
  const dBtn=document.querySelector('[data-act="discard"]');
  if(dBtn) dBtn.onclick=async()=>{
    const draft=[...state.threadMsgs].reverse().find(m=>m.direction==='outbound'&&m.status==='queued');
    if(!draft) return;
    dBtn.disabled=true;
    await db.from('conversation_messages').update({status:'failed'}).eq('id',draft.id);
    await db.from('conversations').update({status:'active'}).eq('id',c.id);
    await loadConversations(); state.openConvId=c.id; renderThread();
  };
}

function gapHTML(g){
  const n=g.times_asked||1;
  return `<div class="g-item" data-id="${g.id}">
    <div class="g-q">${esc(g.question)}</div>
    <div class="g-meta">Asked ${n} time${n>1?'s':''}${g.updated_at?' \u00b7 last '+fmtWhen(g.updated_at):''}</div>
    <textarea class="g-ans" data-a="${g.id}" placeholder="Type the answer ${esc(aName())} should give\u2026"></textarea>
    <div class="g-actions"><span class="g-msg" id="g-msg-${g.id}"></span>
      <button class="btn sm" data-act="dismiss" data-id="${g.id}">Dismiss</button>
      <button class="btn sm primary" data-act="answer" data-id="${g.id}">Save answer</button>
    </div>
  </div>`;
}
function bindGapActions(){
  document.querySelectorAll('#g-list [data-act]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.id, act=b.dataset.act;
    const g=(state.gaps||[]).find(x=>x.id===id); if(!g) return;
    const msg=$("#g-msg-"+id);
    if(act==='dismiss'){
      b.disabled=true;
      const { error }=await db.from('knowledge_gaps').update({status:'dismissed',updated_at:new Date().toISOString(),resolved_at:new Date().toISOString()}).eq('id',id);
      if(!error){ state.gaps=(state.gaps||[]).filter(x=>x.id!==id); pageGaps(); } else { b.disabled=false; if(msg){msg.style.color='var(--danger)';msg.textContent='Could not dismiss.';} }
      return;
    }
    if(act==='answer'){
      const ta=document.querySelector('[data-a="'+id+'"]'); const answer=ta?ta.value.trim():"";
      if(!answer){ if(msg){msg.style.color='var(--danger)';msg.textContent='Type an answer first.';} return; }
      b.disabled=true; const o=b.textContent; b.textContent='Saving\u2026';
      try{
        const { data, error }=await db.functions.invoke("knowledge-upsert",{ body:{ title:g.question, category:'FAQ', content:answer } });
        if(error || !data || !data.ok){ throw new Error((data&&data.error)||(error&&error.message)||'save failed'); }
        await db.from('knowledge_gaps').update({status:'answered',answer,updated_at:new Date().toISOString(),resolved_at:new Date().toISOString()}).eq('id',id);
        state.gaps=(state.gaps||[]).filter(x=>x.id!==id); pageGaps();
      }catch(e){ b.disabled=false; b.textContent=o; if(msg){msg.style.color='var(--danger)';msg.textContent='Could not save. '+(e.message||'');} }
      return;
    }
  });
}

function contactMatch(c,q){
  if(!q) return true; q=q.toLowerCase();
  return (c.name||"").toLowerCase().includes(q) || (c.phone||"").toLowerCase().includes(q) ||
         (c.company||"").toLowerCase().includes(q) || (c.interest||"").toLowerCase().includes(q);
}

function ctSpeak(text){ if(!('speechSynthesis' in window)||!text) return; try{ window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(String(text)); u.rate=.95; window.speechSynthesis.speak(u); }catch(e){} }

/* ===== Contacts: source labels, add, import, export ===== */
const CI="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:13.5px;background:var(--surface);color:var(--ink)";
const CL="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:3px";
function sourceLabel(sv){ const m={manual:"Added by hand", import:"Imported (CSV)", phone:"Imported (phone)", email:"Emailed in", donna:"Saved by "+aName(), "called-in":"Saved by "+aName(), call:"Saved by "+aName()}; return m[String(sv||"").toLowerCase()]||""; }
function normPhone(raw){ let d=String(raw||"").trim(); const plus=d[0]==='+'; d=d.replace(/\D/g,""); if(!d) return ""; if(plus) return "+"+d; if(d.length===10) return "+1"+d; if(d.length===11 && d[0]==='1') return "+"+d; return "+"+d; }
function cleanSpoken(name){ const w=String(name||"").trim().split(/\s+/)[0]||""; return /^[\p{L}][\p{L}'\u2019-]{1,19}$/u.test(w)?w:""; }
function ctField(lab,id,ph,full){ return '<div'+(full?' style="grid-column:1/-1"':'')+'><label style="'+CL+'">'+lab+'</label><input id="'+id+'" placeholder="'+(ph||'')+'" style="'+CI+'"></div>'; }
function ctOverlay(inner){ const o=document.createElement('div'); o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px"; o.innerHTML='<div style="background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:20px">'+inner+'</div>'; o.addEventListener('click',e=>{ if(e.target===o) o.remove(); }); document.body.appendChild(o); return o; }
async function ctSuggest(name,language,input,btn){ name=String(name||"").trim(); if(!name){ uiAlert("Type the name first, then tap Suggest."); return; } const old=btn.textContent; btn.textContent="\u2026"; btn.disabled=true; try{ const { data, error } = await db.functions.invoke('donna-suggest-pronunciation', { body:{ name:name, language:language||"" } }); if(error) throw error; const sug=String((data&&data.suggestion)||"").trim(); if(sug){ input.value=sug; input.focus(); ctSpeak(sug); } else { uiAlert("Couldn't generate a suggestion. You can type how it sounds instead."); } }catch(err){ uiAlert("Suggestion failed: "+(err.message||err)); } finally{ btn.textContent=old; btn.disabled=false; } }

function parseCSV(text){ const rows=[]; let i=0,field="",row=[],inq=false; const pF=()=>{row.push(field);field="";}; const pR=()=>{rows.push(row);row=[];}; while(i<text.length){ const ch=text[i]; if(inq){ if(ch==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inq=false;i++;continue; } field+=ch;i++;continue; } if(ch==='"'){inq=true;i++;continue;} if(ch===','){pF();i++;continue;} if(ch==='\r'){i++;continue;} if(ch==='\n'){pF();pR();i++;continue;} field+=ch;i++; } if(field.length||row.length){pF();pR();} return rows.filter(r=>r.some(x=>String(x).trim().length)); }
function rowsFromCSV(text){ const rows=parseCSV(text); if(rows.length<1) return []; const head=rows[0].map(h=>h.trim().toLowerCase()); const idx=ns=>{ for(const n of ns){ const j=head.indexOf(n); if(j>=0) return j; } return -1; }; const iName=idx(["name","full name","fullname","display name","client name","customer name","client","customer","first name","given name","first","first_name","firstname"]); const iLast=idx(["last name","surname","family name","last","last_name","lastname"]); const iPhone=idx(["phone","phone number","mobile","mobile phone","cell","cell phone","cellphone","mobile number","primary phone","phone_number","mobile_phone","cell_phone","number","phone 1 - value"]); const iEmail=idx(["email","e-mail","email address","email_address","email 1 - value"]); const iCo=idx(["company","organization","organisation","org"]); const iNotes=idx(["notes","note","client notes","customer notes","comments"]); const iAll=idx(["allergies","allergy","sensitivities"]); const out=[]; for(let r=1;r<rows.length;r++){ const c=rows[r]; let nm=(iName>=0?(c[iName]||""):"").trim(); if(iLast>=0 && (c[iLast]||"").trim()) nm=(nm+" "+c[iLast].trim()).trim(); const ph=iPhone>=0?normPhone(c[iPhone]||""):""; const em=iEmail>=0?(c[iEmail]||"").trim():""; const co=iCo>=0?(c[iCo]||"").trim():""; const notes=iNotes>=0?(c[iNotes]||"").trim().slice(0,2000):""; const allergies=iAll>=0?(c[iAll]||"").trim().slice(0,300):""; if(!nm && !ph) continue; out.push({name:nm,phone:ph,email:em,company:co,notes,allergies,source:"import"}); } return out; }
function rowsFromVCF(text){ const cards=text.split(/BEGIN:VCARD/i).slice(1); const out=[]; for(const card of cards){ const get=re=>{ const m=card.match(re); return m?m[1].trim():""; }; let fn=get(/\nFN[^:\r\n]*:(.*)/i); if(!fn){ const n=get(/\nN[^:\r\n]*:(.*)/i); if(n){ const p=n.split(";"); fn=((p[1]||"")+" "+(p[0]||"")).trim(); } } const tel=normPhone(get(/\nTEL[^:\r\n]*:(.*)/i)); const email=get(/\nEMAIL[^:\r\n]*:(.*)/i); const org=get(/\nORG[^:\r\n]*:(.*)/i).replace(/;+\s*$/,"").replace(/;/g,", ").trim(); if(!fn && !tel) continue; out.push({name:fn,phone:tel,email:email,company:org,source:"phone"}); } return out; }

function ctImportFile(file){ const rd=new FileReader(); rd.onload=()=>{ const text=String(rd.result||""); const rows= (/\.vcf$/i.test(file.name)||/BEGIN:VCARD/i.test(text)) ? rowsFromVCF(text) : rowsFromCSV(text); if(!rows.length){ uiAlert("No contacts found in that file. A CSV needs a header row with a name or phone column (Booker, Vagaro, GlossGenius and Square client exports work as-is), or use a .vcf export."); return; } rows.forEach(r=>r.spoken=cleanSpoken(r.name)); showImportReview(rows); }; rd.readAsText(file); }
function showImportReview(rows){ const src = (rows[0]&&rows[0].source==='phone')?'phone':'import'; const items=rows.map((r,i)=>'<label style="display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line-2)"><input type="checkbox" data-i="'+i+'" checked style="margin-top:3px"><div style="flex:1;font-size:13px"><div style="font-weight:600">'+esc(r.name||'(no name)')+(r.spoken?' <span style="color:var(--muted);font-weight:400">\u00b7 says \u201c'+esc(r.spoken)+'\u201d</span>':' <span style="color:var(--danger);font-weight:400">\u00b7 no spoken name yet</span>')+'</div><div style="color:var(--muted)">'+esc(r.phone||'no number')+(r.email?' \u00b7 '+esc(r.email):'')+(r.company?' \u00b7 '+esc(r.company):'')+'</div></div></label>').join(""); const o=ctOverlay('<h2 style="margin:0 0 4px">Review import</h2><p style="color:var(--muted);font-size:13px;margin:0 0 12px">'+rows.length+' found, source will be saved as \u201c'+sourceLabel(src)+'\u201d. All checked. Uncheck anyone to skip. This only adds them to your list, it never sends anything out.</p><div id="imp-list" style="margin-bottom:14px">'+items+'</div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sm" id="imp-cancel">Cancel</button><button class="btn sm primary" id="imp-go">Add selected</button></div>'); o.querySelector('#imp-cancel').onclick=()=>o.remove(); o.querySelector('#imp-go').onclick=async()=>{ const chosen=[...o.querySelectorAll('#imp-list input[type=checkbox]')].filter(x=>x.checked).map(x=>rows[+x.dataset.i]); if(!chosen.length){ o.remove(); return; } const payload=chosen.map(r=>({account_id:state.account.id, phone:r.phone||null, name:r.name||null, preferred_name:r.spoken||null, email:r.email||null, company:r.company||null, notes:r.notes||null, allergies:r.allergies||null, source:src, list_type:'normal', updated_at:new Date().toISOString()})); const withPhone=payload.filter(p=>p.phone), noPhone=payload.filter(p=>!p.phone); const btn=o.querySelector('#imp-go'); btn.disabled=true; btn.textContent="\u2026"; let err=null; if(withPhone.length){ const r=await db.from('contacts').upsert(withPhone,{onConflict:'account_id,phone',ignoreDuplicates:true}); err=r.error; } if(!err && noPhone.length){ const r=await db.from('contacts').insert(noPhone); err=r.error; } if(err){ btn.disabled=false; btn.textContent="Add selected"; uiAlert("Import failed: "+err.message); return; } o.remove(); await loadContacts(); pageContacts(); }; }

function showExport(){ if(!state.contacts.length){ uiAlert("No contacts to export yet."); return; } const items=state.contacts.map((c,i)=>'<label style="display:flex;gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-2)"><input type="checkbox" data-i="'+i+'" checked><div style="flex:1;font-size:13px"><span style="font-weight:600">'+esc(c.name||'Unknown')+'</span> <span style="color:var(--muted)">'+esc(c.phone||'')+'</span></div></label>').join(""); const o=ctOverlay('<h2 style="margin:0 0 4px">Export contacts</h2><p style="color:var(--muted);font-size:13px;margin:0 0 12px">All selected. Uncheck anyone to leave out. This downloads a vCard (.vcf) file to your computer. Nothing is sent to Google or Microsoft.</p><div id="exp-list" style="margin-bottom:14px;max-height:40vh;overflow:auto">'+items+'</div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sm" id="exp-cancel">Cancel</button><button class="btn sm primary" id="exp-go">Download vCard</button></div>'); o.querySelector('#exp-cancel').onclick=()=>o.remove(); o.querySelector('#exp-go').onclick=()=>{ const chosen=[...o.querySelectorAll('#exp-list input[type=checkbox]')].filter(x=>x.checked).map(x=>state.contacts[+x.dataset.i]); if(!chosen.length){ o.remove(); return; } const esc2=v=>String(v||"").replace(/\r?\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;"); const vcf=chosen.map(c=>{ const L=["BEGIN:VCARD","VERSION:3.0"]; L.push("FN:"+esc2(c.name||c.phone||"Unknown")); if(c.company) L.push("ORG:"+esc2(c.company)); if(c.phone) L.push("TEL;TYPE=CELL:"+c.phone); if(c.email) L.push("EMAIL:"+esc2(c.email)); L.push("END:VCARD"); return L.join("\r\n"); }).join("\r\n"); const blob=new Blob([vcf],{type:"text/vcard"}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download="donna-contacts.vcf"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); o.remove(); }; }

function showAddContact(){ const o=ctOverlay('<h2 style="margin:0 0 12px">Add a contact</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+ctField('Name','ac-name','')+ctField('Name '+esc(aName())+' says','ac-pref','first name spoken')+'<div style="grid-column:1/-1"><label style="'+CL+'">How '+esc(aName())+' says it</label><div style="display:flex;gap:8px"><input id="ac-pron" placeholder="e.g., twong-ahn" style="'+CI+';flex:1"><button type="button" class="btn sm" id="ac-suggest">Suggest</button><button type="button" class="btn sm" id="ac-say">Preview</button></div></div>'+ctField('Company','ac-company','')+ctField('Email','ac-email','')+ctField('Phone','ac-phone','+1...')+ctField('Language','ac-language','')+ctField('Label (private, never spoken)','ac-label','your private tag')+ctField('Interest','ac-interest','',true)+'<div style="grid-column:1/-1"><label style="'+CL+'">Notes</label><textarea id="ac-notes" rows="2" style="'+CI+'"></textarea></div><div style="grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end"><button class="btn sm" id="ac-cancel">Cancel</button><button class="btn sm primary" id="ac-save">Add contact</button></div></div>'); const g=id=>{const el=o.querySelector('#'+id);return el?el.value.trim():"";}; o.querySelector('#ac-say').onclick=()=>ctSpeak(g('ac-pron')||g('ac-pref')||(g('ac-name').split(/\s+/)[0]||'')); o.querySelector('#ac-suggest').onclick=()=>ctSuggest(g('ac-name'),g('ac-language'),o.querySelector('#ac-pron'),o.querySelector('#ac-suggest')); o.querySelector('#ac-cancel').onclick=()=>o.remove(); o.querySelector('#ac-save').onclick=async()=>{ const name=g('ac-name'); const phone=normPhone(g('ac-phone')); if(!name && !phone){ uiAlert("Add at least a name or a phone number."); return; } if(phone && state.contacts.some(c=>c.phone===phone) && !(await uiConfirm("Another contact already has that number. People can share a line, like a couple, so this adds a separate contact. Add anyway?",{okText:'Add anyway',cancelText:'Go back'}))){ return; } const row={ account_id:state.account.id, name:name||null, preferred_name:g('ac-pref')||cleanSpoken(name)||null, pronunciation:g('ac-pron')||null, company:g('ac-company')||null, email:g('ac-email')||null, phone:phone||null, language:g('ac-language')||null, label:g('ac-label')||null, interest:g('ac-interest')||null, notes:g('ac-notes')||null, source:'manual', list_type:'normal', updated_at:new Date().toISOString() }; const btn=o.querySelector('#ac-save'); btn.disabled=true; btn.textContent="\u2026"; const r=await db.from('contacts').insert(row); if(r.error){ btn.disabled=false; btn.textContent="Add contact"; uiAlert("Could not add: "+r.error.message); return; } o.remove(); await loadContacts(); pageContacts(); }; }

function contactHTML(c){
  const vip=c.listType==='whitelist', blocked=c.listType==='blacklist';
  const tel=c.phone?c.phone.replace(/[^\d+]/g,''):"";
  const meta=[]; if(c.company) meta.push(`<b>${esc(c.company)}</b>`); if(c.interest) meta.push(esc(c.interest));
  const calls = c.callCount? `${c.callCount} call${c.callCount>1?'s':''}` : 'Not called yet';
  const last = c.lastCallAt? ` \u00b7 last ${fmtWhen(c.lastCallAt)}` : '';
  return `<div class="c-item ${vip?'vip':''} ${blocked?'blocked':''}" data-id="${c.id}">
    <div class="c-top">
      <span class="c-name">${esc(c.name||"Unknown caller")}</span>
      ${vip?`<span class="c-badge vip">${pmMode()?'Priority':'VIP'}</span>`:''}${blocked?'<span class="c-badge blocked">Blocked</span>':''}
      ${langBadge(c.language)}
      ${c.allergies?`<span class="c-badge" style="background:#fde8e8;color:#9b1c1c" title="${esc(c.allergies)}">Allergy</span>`:''}
      ${c.phone?`<a class="c-num" href="tel:${esc(tel)}">${esc(c.phone)}</a>`:''}
    </div>
    ${meta.length?`<div class="c-meta">${meta.join(" \u00b7 ")}</div>`:''}
    <div class="c-meta">${calls}${last}${c.source&&sourceLabel(c.source)?` \u00b7 ${esc(sourceLabel(c.source))}`:''}</div>
    ${c.lastSummary?`<div class="c-sum">\u201c${esc(c.lastSummary)}\u201d</div>`:''}
    ${c.memory?`<div class="c-sum" style="font-style:normal;color:var(--ink-2);line-height:1.5"><strong style="color:var(--muted);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-right:6px">Remembers</strong>${esc(c.memory)}</div>`:''}
    <div class="c-actions">
      <button class="btn sm" data-act="edit" data-id="${c.id}">Edit</button>
      <button class="btn sm" data-act="visits" data-id="${c.id}">${pmMode()?'Details':'Visits'}</button>
      <button class="btn sm" data-act="vip" data-id="${c.id}">${pmMode()?(vip?'Remove priority':'Mark priority'):(vip?'Remove VIP':'Mark VIP')}</button>
      <button class="btn sm" data-act="block" data-id="${c.id}">${blocked?'Unblock':'Block'}</button>
      <button class="btn sm danger" data-act="del" data-id="${c.id}">Delete</button>
    </div>
    <div class="c-visits" id="c-visits-${c.id}" style="display:none;margin-top:11px;border-top:1px solid var(--line-2);padding-top:10px"></div>
    <div class="c-edit" id="c-edit-${c.id}">
      <div><label>Name</label><input data-f="name" value="${esc(c.name)}"></div>
      <div><label>Name ${esc(aName())} says</label><input data-f="preferred_name" value="${esc(c.preferredName)}" placeholder="first name she says"></div>
      <div class="full"><label>How ${esc(aName())} says it (spell it how it sounds)</label><div style="display:flex;gap:8px"><input data-f="pronunciation" value="${esc(c.pronunciation)}" placeholder="e.g., twong-ahn" style="flex:1"><button type="button" class="btn sm" data-act="suggest" data-id="${c.id}">Suggest</button><button type="button" class="btn sm" data-act="say" data-id="${c.id}">Preview</button></div></div>
      <div><label>Company</label><input data-f="company" value="${esc(c.company)}"></div>
      <div class="full"><label>Interest</label><input data-f="interest" value="${esc(c.interest)}"></div>
      <div><label>Language</label><input data-f="language" value="${esc(c.language)}"></div>
      <div><label>Phone</label><input data-f="phone" value="${esc(c.phone)}"></div>
      <div><label>Email</label><input data-f="email" value="${esc(c.email)}"></div>
      <div><label>Label (private, never spoken)</label><input data-f="label" value="${esc(c.label)}" placeholder="your private tag"></div>
      <div class="full"><label>Source</label><input value="${esc(sourceLabel(c.source)||'—')}" disabled style="opacity:.65"></div>
      <div class="full"><label>Memory (auto, editable)</label><textarea data-f="memory" rows="3">${esc(c.memory)}</textarea></div>
      <div class="full"><label>Notes</label><textarea data-f="notes" rows="2">${esc(c.notes)}</textarea></div>
      <div class="save-row"><button class="btn sm" data-act="canceledit" data-id="${c.id}">Cancel</button><button class="btn sm primary" data-act="saveedit" data-id="${c.id}">Save</button></div>
    </div>
  </div>`;
}

function bindClientVisits(){ document.querySelectorAll('#cl-list [data-visits]').forEach(b=>b.onclick=()=>{ const id=b.dataset.visits; const p=document.getElementById('c-visits-'+id); if(!p) return; const open=p.style.display!=='none'; p.style.display=open?'none':'block'; if(!open && !p.dataset.loaded){ p.dataset.loaded='1'; loadVisits(id); } }); }
async function loadVisits(id){
  const el=document.getElementById('c-visits-'+id); if(!el) return;
  el.innerHTML='<div style="color:var(--muted);font-size:12.5px">Loading…</div>';
  let rows=[], cnotes='';
  try{
    const [aRes,cRes]=await Promise.all([
      db.from('appointments').select('starts_at,title,status,user_id,appointment_type_id,notes').eq('contact_id',id).order('starts_at',{ascending:false}).limit(50),
      db.from('contacts').select('stylist_notes, allergies, formulas, preferences').eq('id',id).maybeSingle()
    ]);
    rows=aRes.data||[]; cnotes=(cRes.data&&cRes.data.stylist_notes)||''; var ccard=cRes.data||{};
  }catch(_e){ rows=[]; }
  const typeName=tid=>{ const t=(state.types||[]).find(x=>x.id===tid); return t?t.name:''; };
  const pm=pmMode();
  const notesLabel = salonOn() ? 'Stylist notes &amp; formula' : (pm ? 'Notes about this person' : 'Notes');
  const notesPh = salonOn() ? 'e.g. Color formula: 6N + 20 vol, 35 min. Prefers a side part. Note: sensitive scalp.' : (pm ? 'e.g. Prefers text. Dog in the yard — knock first. Board treasurer at Sunset Ridge. Authorized for Suite 210 billable work.' : 'e.g. Prefers afternoon appointments. Ask about the warranty.');
  const cc=(typeof ccard!=='undefined'&&ccard)||{};
  const L=t=>`<div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;margin-bottom:4px">${t}</div>`;
  const formulaBox= salonOn()

// Interpret a wall date+time in the given IANA tz and return the matching UTC ISO instant.
function zonedToUtcISO(dateStr, timeStr, tz){
  const [y,mo,d]=String(dateStr).split('-').map(Number); const [h,mi]=String(timeStr||'0:0').split(':').map(Number);
  const guess=Date.UTC(y,(mo||1)-1,d||1,h||0,mi||0);
  const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(new Date(guess)).reduce((a,x)=>{a[x.type]=x.value;return a;},{});
  const asUTC=Date.UTC(+p.year,+p.month-1,+p.day,(+p.hour)%24,+p.minute);
  return new Date(guess-(asUTC-guess)).toISOString();
}
function utcToZonedParts(iso,tz){
  const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(new Date(iso)).reduce((a,x)=>{a[x.type]=x.value;return a;},{});
  return { date:`${p.year}-${p.month}-${p.day}`, time:`${((+p.hour)%24).toString().padStart(2,'0')}:${p.minute}` };
}

// In-app confirm/alert so dialogs don't show the browser's "<site> says" prefix.
function uiConfirm(message, opts){
  opts=opts||{};
  return new Promise(resolve=>{
    const ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;background:rgba(14,27,46,.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px';
    ov.innerHTML=`<div style="background:#fff;border-radius:14px;max-width:420px;width:100%;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(16,24,40,.3)"><div style="font-size:14.5px;line-height:1.55;color:var(--ink,#0e1b2e);margin-bottom:18px">${esc(message)}</div><div style="display:flex;gap:9px;justify-content:flex-end"><button class="btn sm" id="uic-cancel">${esc(opts.cancelText||'Cancel')}</button>${opts.alert?'':`<button class="btn sm primary" id="uic-ok">${esc(opts.okText||'OK')}</button>`}</div></div>`;
    document.body.appendChild(ov);
    const done=v=>{ ov.remove(); document.removeEventListener('keydown',onKey); resolve(v); };
    function onKey(e){ if(e.key==='Escape') done(false); if(e.key==='Enter' && !opts.alert) done(true); }
    const ok=ov.querySelector('#uic-ok'); if(ok) ok.onclick=()=>done(true);
    ov.querySelector('#uic-cancel').onclick=()=>done(opts.alert?true:false);
    ov.addEventListener('click',e=>{ if(e.target===ov) done(opts.alert?true:false); });
    document.addEventListener('keydown',onKey);
  });
}

// Is [time, time+dur] on dateStr within this user's set bookable hours? {ok, hasRules}
async function withinBookableHours(userId, dateStr, timeStr, durMin){
  let rules=[];
  try{ const { data }=await db.from('availability_rules').select('day_of_week,start_time,end_time').eq('user_id',userId).eq('rule_type','bookable'); rules=data||[]; }catch(_e){ return {ok:true, hasRules:true}; }
  if(!rules.length) return {ok:false, hasRules:false};
  const dow=new Date(dateStr+'T12:00:00').getDay();
  const [h,mi]=String(timeStr).split(':').map(Number); const startMin=h*60+(mi||0), endMin=startMin+durMin;
  const toMin=t=>{ const p=String(t).split(':'); return (+p[0])*60+(+p[1]); };
  const covered=rules.some(r=> Number(r.day_of_week)===dow && toMin(r.start_time)<=startMin && endMin<=toMin(r.end_time));
  return {ok:covered, hasRules:true};
}

async function confirmIfOutsideHours(uid, dateStr, timeStr, durMin, isSelf){

}

function bindApptActions(){
