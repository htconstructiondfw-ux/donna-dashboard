async function pmOpenReport(propId){
  const p=((state.pm&&state.pm.props)||[]).find(x=>x.id===propId); if(!p) return;
  const now=new Date(); const start=new Date(now.getFullYear(), now.getMonth()-1, 1); const end=new Date(now.getFullYear(), now.getMonth(), 1);
  const period=start.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const w=window.open('','_blank'); if(w) w.document.write('<title>Report</title><p style="font-family:system-ui;padding:30px">Building the report…</p>');
  const [srs,appr,res,comp,mtg,calls]=await Promise.all([
    db.from('service_requests').select('*').eq('property_id',propId).gte('created_at',start.toISOString()).lt('created_at',end.toISOString()).order('created_at'),
    db.from('pm_approvals').select('*').eq('property_id',propId).gte('created_at',start.toISOString()).lt('created_at',end.toISOString()),
    db.from('amenity_reservations').select('*, amenities(name)').eq('property_id',propId).gte('starts_at',start.toISOString()).lt('starts_at',end.toISOString()),
    db.from('pm_compliance_items').select('*').eq('property_id',propId).neq('status','done').lte('due_date',new Date(now.getTime()+60*864e5).toISOString().slice(0,10)).order('due_date'),
    db.from('pm_meetings').select('*').eq('property_id',propId).gte('starts_at',now.toISOString()).neq('status','cancelled').order('starts_at').limit(5),
    db.from('calls').select('id,started_at,duration_seconds,outcome').eq('account_id',state.account.id).gte('started_at',start.toISOString()).lt('started_at',end.toISOString())
  ]);
  const rows=srs.data||[]; const isHoa=p.property_type==='hoa';
  const byType={}; rows.forEach(r=>{ byType[r.request_type]=(byType[r.request_type]||0)+1; });
  const resolved=rows.filter(srDone).length; const deflected=rows.filter(srDeflected).length;
  const emgs=rows.filter(r=>r.priority==='emergency'||r.request_type==='emergency');
  const resp=emgs.filter(e=>e.acknowledged_at).map(e=>(new Date(e.acknowledged_at)-new Date(e.created_at))/60000);
  const avgResp=resp.length?Math.round(resp.reduce((a,b)=>a+b,0)/resp.length):null;
  const approved=(appr.data||[]).filter(a=>a.status==='approved'); const dollars=approved.reduce((s,a)=>s+Number(a.amount||0),0);
  const arc=rows.filter(r=>r.request_type==='arc'); const viol=rows.filter(r=>r.request_type==='violation'); const resale=rows.filter(r=>r.request_type==='resale_cert');
  const phoneRows=rows.filter(r=>r.reported_channel==='phone').length;
  const tr=(k,v)=>`<tr><td style="padding:6px 10px;color:#555">${k}</td><td style="padding:6px 10px;font-weight:600;text-align:right">${v}</td></tr>`;
  const list=(title,items)=>items.length?`<h3>${title}</h3><table style="width:100%;border-collapse:collapse;font-size:13px">${items.map(r=>`<tr style="border-top:1px solid #eee"><td style="padding:6px 8px;white-space:nowrap;color:#555">${new Date(r.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</td><td style="padding:6px 8px">${esc(srTitle(r))}${r.unit?' · '+esc(r.unit):''}</td><td style="padding:6px 8px;white-space:nowrap;text-align:right;color:#555">${esc(SR_STATUS[r.status]?SR_STATUS[r.status][0]:r.status)}${r.due_at&&!srDone(r)?' · due '+pmDay(r.due_at):''}</td></tr>`).join('')}</table>`:'';
  const html=`<!doctype html><html><head><meta charset="utf-8"><title>${esc(p.name)} — ${period} report</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:820px;margin:0 auto;padding:36px 28px;color:#182230}h1{margin:0 0 4px;font-size:22px}h2{font-size:15px;margin:26px 0 8px;padding-bottom:6px;border-bottom:2px solid #182230}h3{font-size:13px;margin:16px 0 6px;color:#333}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.kpi{border:1px solid #e5e7eb;border-radius:10px;padding:12px}.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:#555}@media print{button{display:none}}</style></head><body>
  <button onclick="window.print()" style="float:right;padding:8px 14px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer">Print / save PDF</button>
  <h1>${esc(p.name)}</h1><div style="color:#555">${isHoa?'Board report':'Owner report'} · ${period} · prepared by ${esc(state.account.company||state.account.name||'the management office')} with ${esc(aName())}</div>
  <div class="kpis"><div class="kpi"><b>${rows.length}</b><span>requests handled${phoneRows?` (${phoneRows} by phone)`:''}</span></div><div class="kpi"><b>${resolved}</b><span>resolved or closed</span></div><div class="kpi"><b>${emgs.length}</b><span>emergencies${avgResp!=null?` · avg ${avgResp} min to confirm`:''}</span></div><div class="kpi"><b>${(calls.data||[]).length}</b><span>calls answered by ${esc(aName())} (all properties)</span></div></div>
  <h2>Requests by type</h2><table style="font-size:13px;border-collapse:collapse;min-width:320px">${Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([t,n])=>tr(srTypeLabel(t),n)).join('')}${deflected?tr(isHoa?'In-home calls redirected (owner’s responsibility)':'Calls redirected per lease',deflected):''}</table>
  ${isHoa?`<h2>Governance</h2>${list('Architectural requests',arc)}${list('Violation reports',viol)}${list('Resale certificates & closing documents',resale)}${(res.data||[]).length?`<h3>Amenity reservations</h3><div style="font-size:13px">${(res.data||[]).length} reservation${(res.data||[]).length===1?'':'s'} (${Object.entries((res.data||[]).reduce((m,r)=>{ const k=(r.amenities&&r.amenities.name)||'Amenity'; m[k]=(m[k]||0)+1; return m; },{})).map(([k,v])=>esc(k)+' '+v).join(', ')})</div>`:''}`:''}
  ${emgs.length?list('Emergencies',emgs):''}
  ${list(isHoa?'Common-area work orders':'Work orders',rows.filter(r=>['maintenance','general'].includes(r.request_type)&&!srDeflected(r)))}
  <h2>Money</h2><table style="font-size:13px;border-collapse:collapse;min-width:320px">${tr('Approvals requested',(appr.data||[]).length)}${tr('Approved',approved.length+(dollars?' · '+pmMoney(dollars):''))}${tr('Declined',(appr.data||[]).filter(a=>a.status==='declined').length)}</table>
  <h2>Coming up</h2>${(comp.data||[]).length?`<h3>Compliance due in the next 60 days</h3><ul style="font-size:13px">${(comp.data||[]).map(x=>`<li>${pmFmtDate(x.due_date)} — ${esc(x.title)}${x.vendor_name?' ('+esc(x.vendor_name)+')':''}</li>`).join('')}</ul>`:'<div style="font-size:13px;color:#555">No compliance items due in the next 60 days.</div>'}${(mtg.data||[]).length?`<h3>Meetings</h3><ul style="font-size:13px">${(mtg.data||[]).map(m=>`<li>${pmWhen(m.starts_at)} — ${esc(m.title)}${m.location?' · '+esc(m.location):''}</li>`).join('')}</ul>`:''}
  <div style="margin-top:30px;font-size:11.5px;color:#777">Generated ${now.toLocaleString('en-US')} from ${esc(aName())}’s records. Every line links to a logged request with its reference number.</div>
  </body></html>`;
  if(w){ w.document.open(); w.document.write(html); w.document.close(); }
}

      `Donna never posts to social media. She helps write the post and reminds ${k} when it is time to post it.`,

  // ---- one lease: charges, payments, actions

      ${l.autopay?`<div class="rn-msg" style="margin-bottom:10px"><b>Autopay is on</b> (${esc(l.autopay.brand||l.autopay.method)}${l.autopay.last4?' ending '+esc(l.autopay.last4):''}). Rent is drawn on each due date, with a heads-up to the tenant 3 days before.</div>`:''}
      ${l.block_payments?`<div class="rn-msg" style="margin-bottom:10px;color:#8a5a00"><b>Payments are stopped for this tenant.</b> The pay page tells them to call your office, and ${esc(aName())} sends no pay links, reminders or late fees. ${l.block_reason?'Note: '+esc(l.block_reason):''}</div>`:''}
      <div id="rn-l-form"></div>
      ${invs.length?`<div class="rn-wrap"><table class="rn-t"><thead><tr><th>Bill</th><th>Due</th><th>Status</th><th class="r">Amount</th><th class="r">Paid</th><th></th></tr></thead><tbody>${invs.map(i=>{ const open=!i.paid_at&&i.status!=='void'; const late=open&&i.due_at&&i.due_at<today; const proc=(r.processing||[]).filter(p=>p.invoice_id===i.id).reduce((t,p)=>t+p.amount_cents,0);
        return `<tr><td>${esc(((i.lines||[])[0]||{}).desc||i.number)}<div class="rn-sub">${esc(i.number)}${i.late_fee_applied_at?' · late fee added':''}</div></td><td>${esc(dDate(i.due_at))}</td>
          <td>${i.status==='void'?'<span class="rn-st none">Canceled</span>':i.paid_at?`<span class="rn-st paid">Paid ${esc(dDate(i.paid_at))}</span>`:proc?`<span class="rn-st open">Bank clearing</span>`:late?'<span class="rn-st late">Late</span>':i.status==='draft'?'<span class="rn-st none">Not sent</span>':'<span class="rn-st open">Sent</span>'}</td>

          <td>${open?`<div class="rn-acts"><button class="btn sm" data-rec="${i.id}">Record payment</button><button class="btn sm" data-rem="${i.id}">Send reminder</button><button class="btn sm" data-copy="${esc(i.pay_url)}">Copy pay link</button>${i.paid_cents||proc?'':`<button class="btn sm" data-void="${i.id}">Cancel bill</button>`}</div>`:''}</td></tr>
          ${S.rec===i.id?`<tr><td colspan="6"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
            <div class="field" style="margin:0"><label class="lab">Amount received</label><input class="inp" id="rn-r-amt" inputmode="decimal" value="${((i.total_cents-i.paid_cents)/100).toFixed(2)}" style="width:130px"></div>

    host.querySelectorAll('[data-rec]').forEach(x=>x.onclick=()=>{ S.rec=x.dataset.rec; paintLedger(id); });

    host.querySelectorAll('[data-void]').forEach(x=>x.onclick=async()=>{ if(!(await uiConfirm('Cancel this bill? The tenant will no longer be able to pay it.'))) return; const y=await rentApi({ action:'void', invoice_id:x.dataset.void }); if(!y.ok){ msg(y.message||'Could not cancel.',true); return; } await load(); });
    const rs=$("#rn-r-save"); if(rs){ $("#rn-r-x").onclick=()=>{ S.rec=null; paintLedger(id); };
      rs.onclick=async()=>{ rs.disabled=true; const y=await rentApi({ action:'record', invoice_id:S.rec, amount_cents:dCents($("#rn-r-amt").value), method:$("#rn-r-how").value, note:$("#rn-r-note").value }); rs.disabled=false; if(!y.ok){ $("#rn-r-err").textContent=y.message||'Could not save.'; return; } S.rec=null; await load(); flash(y.paid?'Payment recorded. Paid in full.':`Payment recorded. ${dMoney(y.balance_cents)} still due.`); }; }
  }

  // ---- owner report
  async function tabReport(){
    const b=$("#rn-body"); const now=new Date(); const iso=d=>d.toLocaleDateString('en-CA'); S.rg=S.rg||'month';
    const ranges={ month:[new Date(now.getFullYear(),now.getMonth(),1),now], last:[new Date(now.getFullYear(),now.getMonth()-1,1),new Date(now.getFullYear(),now.getMonth(),0)], year:[new Date(now.getFullYear(),0,1),now] };
    const [from,to]=ranges[S.rg]; b.innerHTML=`<div class="empty">Loading…</div>`;
    const r=await rentApi({ action:'report', from:iso(from), to:iso(to) }); if(S.tab!=='report'||!$("#rn-body")) return;

async function saveContractor(){
  const msg=$("#con-msg"); const name=$("#con-name").value.trim(); const company=$("#con-company").value.trim();
  if(!name && !company){ msg.textContent='Give at least a name or company.'; return; }
  const trades=$("#con-trades").value.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
  const row={ account_id:state.account.id, name:name||company, company:company||null, trades, phone:$("#con-phone").value.trim()||null, email:$("#con-email").value.trim()||null, notes:$("#con-notes").value.trim()||null };
  msg.textContent='Saving…';
  let err=null;
  if(state.con.edit){ const r=await db.from('contractors').update(row).eq('id',state.con.edit.id); err=r.error; } else { const r=await db.from('contractors').insert(row); err=r.error; }
  if(err){ msg.textContent='Could not save.'; return; }
  state.con.edit=null; await loadContractors(); pageContractors();
}

/* ---- document upload (browser-side text extraction) ---- */
const KB_EXT_OK=['pdf','doc','docx','xls','xlsx','csv','txt'];
const KB_EXT_IMG=['jpg','jpeg','png','gif','heic','heif','webp','tif','tiff','bmp'];
async function extractText(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(ext==='txt'||ext==='csv') return await file.text();
  if(ext==='docx'){
    if(!window.mammoth) throw new Error("Reader still loading — try again in a moment.");
    const r=await window.mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});
    return r.value||"";
  }
  if(ext==='doc') throw new Error("Old .doc format isn't supported. Open it and Save As .docx, then upload.");
  if(ext==='xlsx'||ext==='xls'){
    if(!window.XLSX) throw new Error("Reader still loading — try again in a moment.");
    const wb=window.XLSX.read(await file.arrayBuffer(),{type:'array'});
    return wb.SheetNames.map(n=>{
      const csv=window.XLSX.utils.sheet_to_csv(wb.Sheets[n]);
      return (wb.SheetNames.length>1?("# "+n+"\n"):"")+csv;
    }).join("\n\n");
  }
  if(ext==='pdf'){
    if(!window.pdfjsLib) throw new Error("PDF reader still loading — try again in a moment.");
    const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    const out=[];
    for(let i=1;i<=pdf.numPages;i++){
      const tc=await (await pdf.getPage(i)).getTextContent();
      out.push(tc.items.map(it=>it.str).join(" "));
    }
    return out.join("\n\n");
  }
  throw new Error("Unsupported file type.");
}
async function handleFileUpload(e){
  const files=Array.from(e.target.files||[]); const msg=$("#kb-up-msg");
  e.target.value="";
  if(!files.length||!msg) return;
  let done=0, added=0, failed=0;
  for(const file of files){
    const ext=(file.name.split('.').pop()||'').toLowerCase();
    msg.style.color="var(--muted)"; msg.textContent=files.length>1?("Reading "+file.name+" ("+(done+1)+"/"+files.length+")…"):("Reading "+file.name+"…");
    if(KB_EXT_IMG.includes(ext)||!KB_EXT_OK.includes(ext)){ failed++; done++; continue; }
    let text="";
    try{ text=((await extractText(file))||"").trim(); }catch(err){ failed++; done++; continue; }
    if(text.length<20){ failed++; done++; continue; }
    msg.textContent="Teaching "+aName()+" from "+file.name+(files.length>1?(" ("+(done+1)+"/"+files.length+")…"):"…");
    try{
      const { data, error }=await db.functions.invoke("knowledge-ingest-document",{ body:{ filename:file.name, text } });
      if(error||!data||!data.ok) failed++; else added++;
    }catch(err){ failed++; }
    done++;
  }
  await loadDocuments(); refreshDocViews();
  if(added){ msg.style.color="var(--ok)"; msg.textContent="Added "+added+" file"+(added===1?"":"s")+" to review below"+(failed?(", "+failed+" skipped"):"")+"."; }
  else { msg.style.color="var(--danger)"; msg.textContent="Couldn't read "+failed+" file"+(failed===1?"":"s")+". Word, Excel, CSV, text, and text PDFs work; scans and photos need OCR."; }
}
function docCardHtml(d){
  const stats=state.docStats||{}; const pass=state.docPassages||{};
  const pill=(bg,fg,txt)=>`<span style="display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:${bg};color:${fg}">${txt}</span>`;
  const s=stats[d.id]||{total:0,approved:0}; const pending=s.total-s.approved;
  let status;
  if(s.total===0) status=`<span style="font-size:12px;color:var(--muted-2)">processing…</span>`;
  else if(pending>0) status=pill("var(--signal-soft)","var(--site)","Pending review · "+s.total+" passage"+(s.total===1?"":"s"));
  else status=pill("#e7f5ee","var(--ok)","Live · "+s.total+" passage"+(s.total===1?"":"s"));
  const open=state.docOpen&&state.docOpen.has(d.id);
  const viewBtn = s.total>0 ? `<button class="btn sm" data-docview="${d.id}">${open?"Hide":"View"}</button>` : "";
  const approveBtn = pending>0 ? `<button class="btn sm primary" data-docok="${d.id}">Approve</button>` : "";
  let passHtml="";
  if(open){
    const list=(pass[d.id]||[]);
    const rows = list.length ? list.map(p=>{
      const dot = p.approved ? `<span style="color:var(--ok);font-size:11px;font-weight:600">Live</span>` : `<span style="color:var(--site);font-size:11px;font-weight:600">Pending</span>`;
      return `<div style="display:flex;align-items:flex-start;gap:10px"><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:12.5px;margin-bottom:2px">${esc(p.title||"(untitled)")} <span style="margin-left:6px">${dot}</span></div><div style="font-size:12.5px;color:var(--muted)">${esc(p.content)}</div></div><button class="btn sm" data-passdel="${p.id}">Delete</button></div>`;
    }).join("") : `<div style="font-size:12px;color:var(--muted-2)">No passages.</div>`;
    const footer = pending>0 ? `<div style="display:flex;justify-content:flex-end;margin-top:4px"><button class="btn sm primary" data-docok="${d.id}">Approve ${pending} passage${pending===1?"":"s"}</button></div>` : "";
    passHtml = `<div style="margin-top:10px;border-top:1px solid var(--line-2);padding-top:10px;display:flex;flex-direction:column;gap:11px">`+rows+footer+`</div>`;
  }
  return `<div class="block-item" style="display:block"><div style="display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap"><div style="flex:1;min-width:150px"><div style="font-weight:600;font-size:13.5px;margin-bottom:4px">${esc(d.filename)}</div><div>${status}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${viewBtn}${approveBtn}<button class="btn sm" data-docdel="${d.id}">Delete</button></div></div>${passHtml}</div>`;
}
function renderDocSection(el, docs, allId, emptyTxt){
  if(!el) return;
  if(!state.docOpen) state.docOpen=new Set();
  if(!docs.length){ el.innerHTML=`<div style="font-size:12.5px;color:var(--muted-2)">${emptyTxt}</div>`; return; }
  const stats=state.docStats||{};
  let pendingDocs=0; docs.forEach(d=>{ const s=stats[d.id]||{total:0,approved:0}; if(s.total>s.approved) pendingDocs++; });
  const bar = pendingDocs>1 ? `<div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="btn sm primary" id="${allId}">Approve all (${pendingDocs})</button></div>` : "";
  el.innerHTML = bar + docs.map(docCardHtml).join("");
  const aa=$("#"+allId); if(aa) aa.onclick=()=>approveDocsIn(docs);
  el.querySelectorAll("[data-docview]").forEach(b=>b.onclick=()=>toggleDoc(b.dataset.docview));
  el.querySelectorAll("[data-docok]").forEach(b=>b.onclick=()=>approveDocument(b.dataset.docok));
  el.querySelectorAll("[data-docdel]").forEach(b=>b.onclick=()=>deleteDocument(b.dataset.docdel));
  el.querySelectorAll("[data-passdel]").forEach(b=>b.onclick=()=>deletePassage(b.dataset.passdel));
}

function ivSpeechSupported(){ return !!(window.SpeechRecognition||window.webkitSpeechRecognition); }
function ivInitCard(){
  const sel=$("#iv-lang"); if(!sel) return;
  sel.innerHTML=IV_LANGS.map(([c,l])=>`<option value="${c}">${esc(l)}</option>`).join("");
  try{ if(window.speechSynthesis){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; } }catch(e){}
  const note=$("#iv-note");
  if(!ivSpeechSupported()){ if(note){ note.style.color="var(--danger)"; note.textContent="Voice needs Chrome on a computer. You can use website import, documents, or type knowledge instead."; } $("#iv-start").disabled=true; }
  $("#iv-start").onclick=ivStart;
  $("#iv-finish").onclick=()=>ivFinish(false);
  $("#iv-cancel").onclick=()=>ivFinish(true);
}
function ivPickVoice(langTag){
  if(!window.speechSynthesis) return null;
  const vs=speechSynthesis.getVoices()||[]; const base=langTag.split("-")[0].toLowerCase();
  const inLang=vs.filter(v=>v.lang&&v.lang.toLowerCase().startsWith(base));
  const fem=/(female|samantha|victoria|karen|moira|tessa|fiona|google us english|google uk english female|zira|susan|linda|allison|ava|joanna|amelie|am[ée]lie|anna|paulina|m[óo]nica|ting-ting|kyoko|yuna|milena|google español|sara|nicky|carmit)/i;
  return inLang.find(v=>fem.test(v.name))||inLang.find(v=>/female/i.test(v.name))||inLang[0]||vs.find(v=>fem.test(v.name))||vs[0]||null;
}
function ivSpeak(text){
  return new Promise(res=>{
    if(!window.speechSynthesis){ res(); return; }
    try{ speechSynthesis.cancel(); }catch(e){}
    const u=new SpeechSynthesisUtterance(text);
    const v=ivPickVoice(state.iv.langTag); if(v){ u.voice=v; u.lang=v.lang; } else { u.lang=state.iv.langTag; }
    u.rate=1; let done=false; const fin=()=>{ if(!done){ done=true; res(); } };
    u.onend=fin; u.onerror=fin;
    speechSynthesis.speak(u);
    setTimeout(fin, Math.min(16000, 2500+text.length*75));
  });
}
function ivListen(){
  return new Promise(res=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ res(""); return; }
    const rec=new SR(); state.iv.rec=rec;
    rec.lang=state.iv.langTag; rec.interimResults=false; rec.maxAlternatives=1; rec.continuous=false;
    let got=""; let done=false;
    const finish=(t)=>{ if(done) return; done=true; try{rec.stop();}catch(e){} res(t); };
    rec.onresult=(e)=>{ try{ got=e.results[0][0].transcript||""; }catch(_){ got=""; } };
    rec.onerror=()=>finish("");
    rec.onend=()=>finish(got);
    try{ rec.start(); }catch(e){ res(""); }
  });
}
function ivAddLine(role,text){
  state.iv.transcript.push({role,text});
  const el=$("#iv-transcript"); if(!el) return;
  const who=role==="assistant"?esc(aName()):"You";
  const color=role==="assistant"?"var(--ink)":"var(--virtual)";
  el.insertAdjacentHTML("beforeend",`<div style="margin-bottom:8px"><span style="font-weight:600;color:${color}">${who}:</span> ${esc(text)}</div>`);
  el.scrollTop=el.scrollHeight;
}
function ivSetStatus(t){ const s=$("#iv-status"); if(s) s.textContent=t; }
async function ivStart(){
  if(!ivSpeechSupported()) return;
  const sel=$("#iv-lang"); const langTag=sel.value; const langName=(IV_LANGS.find(x=>x[0]===langTag)||["","English"])[1].split(" / ")[0];
  state.iv={ langTag, langName, summary:"", turn:0, transcript:[], running:true, rec:null, maxTurns:16 };
  $("#iv-setup").style.display="none"; $("#iv-panel").style.display="";
  $("#iv-transcript").innerHTML=""; ivSetStatus("Connecting…");
  try{
    const first=await ivTurn(true);
    if(!first){ ivReset(); return; }
    await ivConverse();
  }catch(e){ ivSetStatus("Something went wrong. Press Finish to save what you have."); }
}
async function ivTurn(){
  const recent=state.iv.transcript.slice(-6);
  const { data, error }=await db.functions.invoke("interview-turn",{ body:{
    languageName:state.iv.langName, summary:state.iv.summary, recent, turn:state.iv.turn, maxTurns:state.iv.maxTurns, business:aName()
  }});
  if(error || !data || !data.ok){ ivSetStatus((data&&(data.message||data.error))||(error&&error.message)||"Model error."); return null; }
  state.iv.summary=data.summary||state.iv.summary;
  ivAddLine("assistant",data.say);
  ivSetStatus("Speaking…"); await ivSpeak(data.say);
  return data;
}
async function ivConverse(){
  let done=false;
  while(state.iv.running && !done && state.iv.turn < state.iv.maxTurns+4){
    ivSetStatus("Listening… speak your answer.");
    let answer=await ivListen();
    if(!state.iv.running) break;
    if(!answer){ ivSetStatus("Didn't catch that — listening again…"); answer=await ivListen(); }
    if(!state.iv.running) break;
    if(!answer){ ivSetStatus("Still nothing. Keep talking when ready, or press Finish to save."); continue; }
    ivAddLine("user",answer);
    state.iv.turn++;
    ivSetStatus("Thinking…");
    const res=await ivTurn(false);
    if(!res) break;
    done=res.done;
  }
  if(done && state.iv.running){ await ivFinish(false); }
}
let ivFinishing=false;
async function ivFinish(cancel){
  if(ivFinishing) return; ivFinishing=true;
  if(state.iv) state.iv.running=false;
  try{ if(state.iv&&state.iv.rec) state.iv.rec.stop(); }catch(e){}
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  if(cancel){ ivReset(); ivFinishing=false; return; }
  const tr=(state.iv&&state.iv.transcript)||[];
  if(tr.filter(m=>m.role==="user").length===0){ ivSetStatus("Nothing to save yet."); ivReset(); ivFinishing=false; return; }
  ivSetStatus("Saving what you taught me…");
  try{
    const { data, error }=await db.functions.invoke("interview-extract",{ body:{ languageName:(state.iv&&state.iv.langName)||"English", transcript:tr }});
    if(error || !data || !data.ok){ ivSetStatus((data&&(data.message||data.error))||(error&&error.message)||"Couldn't save the interview."); ivFinishing=false; return; }
    ivSetStatus("Saved "+data.count+" item"+(data.count===1?"":"s")+". "+aName()+" won't use these on calls until you review and approve them in the Set up by voice card above.");
    await loadDocuments(); refreshDocViews();
    setTimeout(ivReset, 7000);
  }catch(e){ ivSetStatus("Couldn't save the interview."); }
  ivFinishing=false;
}
function ivReset(){

}
async function deleteDocument(id){

async function loadCalls(){
  const { data } = await db.from('calls').select('*').eq('account_id', state.account.id).order('started_at',{ascending:false}).limit(100);
  state.calls = data || [];
}
function fmtDur(s){ if(!s&&s!==0) return ''; const m=Math.floor(s/60), ss=s%60; return m?`${m}m ${ss}s`:`${ss}s`; }
function fmtDateTime(iso){ if(!iso) return ''; return new Intl.DateTimeFormat('en-US',{timeZone:state.account.timezone, weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}).format(new Date(iso)); }

function pageCalls(){
  $("#page").innerHTML=`
  <div class="page">
    <div class="page-head"><h1>Calls</h1><p>Every call ${esc(aName())} handles, with the full conversation. This page updates on its own: a call appears the moment it starts, and the transcript fills in when it wraps.</p></div>
    <div class="card">
      <div class="card-h"><h2>Recent calls</h2><span class="calls-live"><span class="d"></span>Live</span></div>
      <div id="calls-list"></div>
    </div>
  </div>`;
  paintCallsList();
  subscribeCalls();
}
function paintCallsList(){
  const el=$("#calls-list"); if(!el) return;
  el.innerHTML = state.calls.length
    ? state.calls.map(callRowHTML).join("")
    : `<div class="empty">${I.phone}<div>No calls yet. When someone calls ${esc(aName())}, it shows up here in real time.</div></div>`;
  el.querySelectorAll("[data-call]").forEach(b=>b.onclick=()=>openCall(b.dataset.call));
}
function callRowHTML(c){
  const live = c.status==='in_progress' || c.status==='ringing';
  const dur = (c.duration_seconds||c.duration_seconds===0)?fmtDur(c.duration_seconds):'';
  const who = c.from_number || 'Unknown caller';
  const open = state.openCallId===c.id;
  const out = c.outcome?`<span class="appt-status s-${c.outcome}" style="margin-left:8px">${esc(String(c.outcome).replace(/_/g,' '))}</span>`:'';
  const body = c.summary ? esc(c.summary)
    : (live ? `<span style="color:var(--signal)">On the line now…</span>`
            : `<span style="color:var(--muted-2)">No summary</span>`);
  return `<div class="call-item ${live?'live':''} ${open?'open':''}">
    <div class="call-head" data-call="${c.id}" style="cursor:pointer">
      <div class="m-top"><span class="m-who">${live?'<span class="livedot"></span>':''}${esc(who)}${out}${langBadge(c.language)}</span>
        <span class="m-when">${esc(fmtDateTime(c.started_at))}${dur?` · ${dur}`:''}</span></div>
      <div class="m-text">${body}</div>
    </div>
    ${open?callTxHTML(c,live):''}
  </div>`;
}
function callTxHTML(c,live){
  const lines = (state.callTranscript||[]).map(t=>`<div class="tline ${esc(t.speaker)}"><span class="who">${t.speaker==='donna'?esc(aName()):(t.speaker==='caller'?'Caller':esc(t.speaker))}</span><span class="bub">${esc(t.text)}</span></div>`).join("");
  return `<div class="call-tx" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
    ${live?`<p style="font-size:12.5px;margin-bottom:12px"><span class="livedot"></span><span style="color:var(--signal)">Call in progress — the transcript appears once it ends.</span></p>`:''}
    <div class="transcript">${lines || `<div class="empty" style="padding:22px">${live?'Listening…':'No transcript was captured for this call.'}</div>`}</div>
    ${c&&c.recording_url?`<div style="margin-top:14px"><a class="btn sm" href="${esc(c.recording_url)}" target="_blank" rel="noopener">▶ Play recording</a></div>`:''}
  </div>`;
}
async function openCall(id){
  if(state.openCallId===id){ state.openCallId=null; if(state.txChannel){db.removeChannel(state.txChannel);state.txChannel=null;} paintCallsList(); return; }
  state.openCallId=id;
  const { data } = await db.from('transcript_messages').select('*').eq('call_id',id).order('said_at',{ascending:true});
  state.callTranscript = data || [];
  paintCallsList();
  subscribeTranscript(id);
}
function paintCallDetail(){
  const el=$("#call-detail"); if(!el) return;
  if(!state.openCallId){ el.innerHTML=''; return; }
  const c = state.calls.find(x=>x.id===state.openCallId);
  const live = c && (c.status==='in_progress'||c.status==='ringing');
  const lines = (state.callTranscript||[]).map(t=>`<div class="tline ${esc(t.speaker)}"><span class="who">${t.speaker==='donna'?esc(aName()):(t.speaker==='caller'?'Caller':esc(t.speaker))}</span><span class="bub">${esc(t.text)}</span></div>`).join("");
  el.innerHTML=`<div class="card">
    <div class="card-h"><h2>Transcript</h2><button class="btn sm" id="call-close">Close</button></div>
    ${live?`<p style="font-size:12.5px;margin-bottom:12px"><span class="livedot"></span><span style="color:var(--signal)">Call in progress — the transcript appears once it ends.</span></p>`:''}
    <div class="transcript">${lines || `<div class="empty" style="padding:26px">${live?'Listening…':'No transcript was captured for this call.'}</div>`}</div>
    ${c&&c.recording_url?`<div style="margin-top:14px"><a class="btn sm" href="${esc(c.recording_url)}" target="_blank" rel="noopener">▶ Play recording</a></div>`:''}
  </div>`;
  const cl=$("#call-close"); if(cl) cl.onclick=()=>{ state.openCallId=null; if(state.txChannel){db.removeChannel(state.txChannel);state.txChannel=null;} paintCallsList(); paintCallDetail(); };
}
async function ensureRealtimeAuth(){
  try{ const { data:{ session } } = await db.auth.getSession(); if(session) db.realtime.setAuth(session.access_token); }catch(e){}
}
async function subscribeCalls(){
  if(state.callsChannel) return;
  await ensureRealtimeAuth();
  state.callsChannel = db.channel('rt-calls')
    .on('postgres_changes', { event:'*', schema:'public', table:'calls', filter:`account_id=eq.${state.account.id}` },
      async ()=>{ await loadCalls(); paintCallsList(); })
    .subscribe();
}
async function subscribeTranscript(callId){
  if(state.txChannel){ db.removeChannel(state.txChannel); state.txChannel=null; }
  await ensureRealtimeAuth();
  state.txChannel = db.channel('rt-tx-'+callId)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'transcript_messages', filter:`call_id=eq.${callId}` },
      payload=>{ state.callTranscript.push(payload.new); paintCallsList(); })
    .subscribe();
}
function teardownRealtime(){
  if(state.callsChannel){ db.removeChannel(state.callsChannel); state.callsChannel=null; }
  if(state.txChannel){ db.removeChannel(state.txChannel); state.txChannel=null; }
  state.openCallId=null; state.callTranscript=[];
}

const IMP_IDLE_MS = 5*60*1000;   // lock the tenant view after 5 min of no activity
let impIdleTimer=null, impLocked=false;
function impLock(reason){
  if(impLocked) return; impLocked=true;
  try{ db.auth.signOut({scope:'local'}); }catch(e){}
  try{ teardownRealtime(); }catch(e){}
  if('speechSynthesis' in window) try{ window.speechSynthesis.cancel(); }catch(e){}
  document.title="Session ended";
  const b=document.getElementById('imp-banner'); if(b) b.remove();
  document.getElementById("root").innerHTML=`<div class="imp-lock"><div class="imp-lock-card">
    <h2>Tenant view locked</h2>
    <p>${esc(reason||"This sandbox session ended.")}</p>
    <p class="imp-sub">Nothing was saved on this device. To view this tenant again, reopen it from the admin portal.</p>
    <button class="imp-close" onclick="window.close()">Close window</button>
  </div></div>`;
}
function impPoke(){
  if(impLocked) return;
  if(impIdleTimer) clearTimeout(impIdleTimer);
  impIdleTimer=setTimeout(()=>impLock("You were inactive for 5 minutes, so the tenant view locked itself."), IMP_IDLE_MS);
}
function impBanner(company){
  const css=document.createElement('style');
  css.textContent=`#imp-banner{position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#13243d;color:#fff;font:500 13px 'Inter',sans-serif;padding:9px 16px;display:flex;align-items:center;gap:10px;justify-content:center;box-shadow:0 -2px 14px rgba(0,0,0,.18)}#imp-banner b{color:#f0c790}#imp-banner button{margin-left:14px;background:#e0892e;color:#fff;border:none;border-radius:7px;padding:5px 12px;font:600 12px 'Inter';cursor:pointer}.dotpulse{width:8px;height:8px;border-radius:50%;background:#2f9e6f;animation:dp 1.6s infinite}@keyframes dp{0%{box-shadow:0 0 0 0 rgba(47,158,111,.6)}70%{box-shadow:0 0 0 7px rgba(47,158,111,0)}100%{box-shadow:0 0 0 0 rgba(47,158,111,0)}}.imp-lock{min-height:100vh;display:grid;place-items:center;background:var(--canvas,#eef1f7);padding:24px}.imp-lock-card{background:#fff;border:1px solid #dfe5f0;border-radius:13px;padding:30px;max-width:380px;text-align:center}.imp-lock-card h2{font-family:'Bricolage Grotesque','Inter',sans-serif;font-size:21px;margin-bottom:8px;color:#13243d}.imp-lock-card p{color:#5d6e8c;font-size:13.5px;margin-bottom:8px}.imp-lock-card .imp-sub{font-size:12px;color:#8b99b3}.imp-close{margin-top:16px;background:#e0892e;color:#fff;border:none;border-radius:9px;padding:9px 16px;font-weight:600;cursor:pointer}`;
  document.head.appendChild(css);

  el.innerHTML=`<span class="dotpulse"></span> Viewing <b>${esc(company||'tenant')}</b> as admin · in-memory only, not saved on this device <button id="imp-exit">Close</button>`;
  document.body.appendChild(el);
  document.getElementById('imp-exit').onclick=()=>window.close();
}
async function startImpSession(){
  let ok=await loadData();
  if(!ok){ await new Promise(r=>setTimeout(r,900)); ok=await loadData(); }
  if(!ok){ document.getElementById("root").innerHTML=`<div class="booting">Could not load this tenant.</div>`; return; }
  renderApp();
  impBanner(state.account && state.account.company);
  ['mousemove','mousedown','keydown','scroll','touchstart','click'].forEach(ev=>window.addEventListener(ev, impPoke, {passive:true}));
  impPoke();
}
async function bootImpersonation(){
  document.getElementById("root").innerHTML=`<div class="booting">Opening tenant view…</div>`;
  try{ history.replaceState(null,"",location.pathname+"?imp=1"); }catch(e){}
  let gotSession=false;
  // If the tenant session is ever lost (e.g. refresh fails), lock the view so
  // writes can never silently go out unauthenticated and look like they saved.
  db.auth.onAuthStateChange((event)=>{ if(event==='SIGNED_OUT' && gotSession && !impLocked){ impLock("Your tenant session ended. Reopen it from the admin portal."); } });
  // On a reload within the same tab, the session is already in sessionStorage.
  try{ const { data:{ session } } = await db.auth.getSession(); if(session){ gotSession=true; await startImpSession(); return; } }catch(e){}
  window.addEventListener('message', async (e)=>{
    if(e.origin!==location.origin) return;
    const d=e.data||{};
    if(d.type==='donna-imp-session' && d.access_token && d.refresh_token && !gotSession){
      gotSession=true;
      const { error } = await db.auth.setSession({ access_token:d.access_token, refresh_token:d.refresh_token });
      if(error){ document.getElementById("root").innerHTML=`<div class="booting">Could not open this tenant view.</div>`; return; }
      await startImpSession();
    }
  });
  if(window.opener){ try{ window.opener.postMessage({type:'donna-imp-ready'}, location.origin); }catch(e){} }
  else { document.getElementById("root").innerHTML=`<div class="booting">Please open this view from the admin portal.</div>`; return; }
  setTimeout(()=>{ if(!gotSession && !impLocked){ document.getElementById("root").innerHTML=`<div class="booting">No tenant session received. Reopen from the admin portal.</div>`; } }, 15000);
}

    if(ok===false){ next.disabled=false; next.textContent=o; return; }
    if(ok==='stay'){ next.disabled=false; next.textContent=o; return; }
    state.wizStep=(state.wizStep||0)+1; await wzPersist({}); renderWizard();

  const back=$("#wz-back"); if(back) back.onclick=async()=>{ state.wizStep=Math.max(0,(state.wizStep||0)-1); await wzPersist({}); renderWizard(); };

      box.innerHTML=`${line(wt('Send all calls'),c.all)}${line(wt('Only when busy / no answer'),c.busy_noanswer)}<div class="hint" style="font-size:12px;color:var(--muted);margin-top:4px">${wt('On a cell phone, tap <b>{0}</b>, press call, and wait for the confirmation tone. To undo later: <code>{1}</code>.', wt('Dial it'), esc(c.off))}</div>`; };
    const paintCarriers=()=>{ const el=$("#wz-carriers"); if(!codes||!el) return; el.innerHTML=Object.keys(codes).map(k=>`<span class="wz-chip ${g.carrier===k?'sel':''}" data-car="${k}">${esc(codes[k].name)}</span>`).join(''); el.querySelectorAll('[data-car]').forEach(x=>x.onclick=()=>{ g.carrier=x.dataset.car; paintCarriers(); paintCodes(); }); };
    setupApi({ action:'forward_codes' }).then(r=>{ if(r.ok){ codes=r.codes; paintCarriers(); paintCodes(); } });
    $("#wz-fcheck").onclick=async()=>{ const b=$("#wz-fcheck"), m=$("#wz-fmsg"); const biz=normPhone($("#wz-bizphone").value); if(!/^\+1\d{10}$/.test(biz)){ m.textContent=wt('Enter your business line first.'); return; } b.disabled=true; m.innerHTML='<span class="wz-pulse"></span>'+wt('{0} is calling your line…', esc(g.aname));
      const settings=Object.assign({}, state.account.settings||{}); settings.business=Object.assign({}, settings.business||{}, { phone:biz }); await db.from('accounts').update({settings}).eq('id',state.account.id); state.account.settings=settings;
      const r=await setupApi({ action:'forward_check', business_number:biz }); if(!r.ok){ m.textContent=wt('Could not place the check call: {0}', r.error||''); b.disabled=false; return; }
      let n=0; const t=setInterval(async()=>{ n++; const s=await setupApi({ action:'forward_status', since:r.since }); if(s.ok&&s.forwarded){ clearInterval(t); m.style.color='var(--ok)'; m.textContent=wt('It works — calls to your line now reach {0}.', g.aname); g.fwdOk=true; b.textContent=wt('Verified'); return; } if(n>=10){ clearInterval(t); m.style.color='var(--danger)'; m.textContent=wt('I didn\'t get the call. Check the code and try again, or continue and I\'ll remind you.'); b.disabled=false; } },4000); };
    wzBindNav(async()=>{ if(g.mode==='forward'){ const biz=normPhone($("#wz-bizphone").value); if(biz){ const settings=Object.assign({}, state.account.settings||{}); settings.business=Object.assign({}, settings.business||{}, { phone:biz }); settings.phone=Object.assign({}, settings.phone||{}, { mode:'forward', carrier:g.carrier, forwarding_verified:!!g.fwdOk }); await db.from('accounts').update({settings}).eq('id',state.account.id); state.account.settings=settings; } } else { const settings=Object.assign({}, state.account.settings||{}); settings.phone=Object.assign({}, settings.phone||{}, { mode:'new' }); await db.from('accounts').update({settings}).eq('id',state.account.id); state.account.settings=settings; } return true; },{});
  },
  // 4 — try her. Donna calls the owner's cell. Then live.
  4:function(){
    const g=state.wz; const donna=(state.assistant&&state.assistant.number)||'';
    document.getElementById("root").innerHTML=wzShell(`
      <h1>${wt('Hear her for yourself.')}</h1>
      <p class="lede">${wt('{0} will call your cell right now, exactly the way she\'ll answer for your customers. Ask her your hours, your prices, book something. Then you\'re live.', esc(g.aname))}</p>
      <div class="wz-row2"><div class="wz-field"><label>${wt('Your mobile')}</label><input class="wz-inp" id="wz-cell" value="${esc(g.phone||(state.owner&&state.owner.phone)||'')}" placeholder="+1 817 555 1234"></div><div class="wz-field"><label>&nbsp;</label><button class="btn primary" id="wz-callme" style="width:100%">${wt('Call me now')}</button></div></div>
      <div class="wz-msg" id="wz-m">${donna?'':'<span style="color:var(--danger)">'+wt('Set up the number first (previous step).')+'</span>'}</div>
      <div class="wz-sec"><h3>${wt('What happens when you go live')}</h3><div style="font-size:13.5px;line-height:1.7;color:var(--ink-2)">
        <div>• ${wt('{0} answers {1} 24/7 and books inside your hours.', esc(g.aname), state.account.settings&&state.account.settings.phone&&state.account.settings.phone.mode==='forward'?wt('your forwarded line'):wt('her number'))}</div>
        <div>• ${wt('Missed calls, messages and bookings get texted to {0} and emailed to {1}.', g.phone?esc(prettyPhone(g.phone)):wt('you'), esc((state.account.settings&&state.account.settings.alert_email)||wt('you')))}</div>
        <div>• ${wt('Anything I still need, I\'ll text you one question at a time over the next few days. No forms.')}</div>
      </div></div>
    `,{nextLabel:wt('Go live'), altLabel:'', noExit:true});
    $("#wz-callme").onclick=async()=>{ const b=$("#wz-callme"), m=$("#wz-m"); const to=normPhone($("#wz-cell").value); if(!/^\+1\d{10}$/.test(to)){ m.style.color='var(--danger)'; m.textContent=wt('Enter a US mobile number.'); return; } b.disabled=true; b.textContent=wt('Calling…'); g.phone=to; await db.from('users').update({ phone:to }).eq('id',state.owner.id); state.owner.phone=to;
      const r=await setupApi({ action:'test_call', to }); if(!r.ok){ m.style.color='var(--danger)'; m.textContent=r.error==='needs_number'?wt('Set up the number first.'):wt('Could not call: {0}', r.message||r.error||''); b.disabled=false; b.textContent=wt('Call me now'); return; }
      m.style.color='var(--ok)'; m.innerHTML='<span class="wz-pulse"></span>'+wt('Ringing your phone now. Pick up and say hi.'); setTimeout(()=>{ b.disabled=false; b.textContent=wt('Call me again'); },20000); };
    wzBindNav(async()=>{ await wzFinish(false); return 'stay'; },{busyLabel:wt('Going live…')});
  }
};
// Finish: mark complete, create the email address, apply the preset, reload, tutorial. `partial` = "finish later" — still live, Donna chases the rest.
// Setup step 3, before the number: choose a plan and add a card (Stripe Checkout). Exempt and already-subscribed accounts skip it.
async function wzPlanGate(){
  const root=document.getElementById("root");
  root.innerHTML=wzShell(`<h1>${wt('Start your free trial.')}</h1><div class="wz-msg" style="color:var(--muted)">${wt('Loading plans…')}</div>`,{noFooter:true});
  const r=await billingApi({ action:'status' });
  if(r.ok&&(r.exempt||(r.billing&&['trialing','active','past_due'].includes(r.billing.sub_status)))){ state.billingOk=true; WZ_RENDER[3](); return; }
  if(!r.ok){ root.innerHTML=wzShell(`<h1>${wt('Start your free trial.')}</h1><div class="wz-msg" style="color:var(--danger)">${esc(blErr(r))}</div>`,{nextLabel:wt('Continue'),altLabel:''}); wzBindNav(async()=>false,{}); return; }
  root.innerHTML=wzShell(`
    <h1>${wt('Start your free trial.')}</h1>
    <p class="lede">${wt('Pick a plan and add a card. Your 14 free days start when {0} answers her first real call, and you can cancel any time before then without being charged.', esc(state.wz&&state.wz.aname||DEFAULT_NAME))}</p>
    <div id="wz-plan"></div><div class="wz-msg" id="wz-m">${state._billingNote?esc(state._billingNote):''}</div>
  `,{nextLabel:wt('Continue'), altLabel:''});
  state._billingNote=null;
  bindPlanPicker($("#wz-plan"), r.prices, { term:'mtm', cta:wt('Start free with') }, async(tier,term)=>{ await wzPersist({}); return startCheckout(tier,term,$("#wz-m")); });
  wzBindNav(async()=>{ const m=$("#wz-m"); m.style.color='var(--danger)'; m.textContent=wt('Choose a plan to continue.'); return false; },{});
}
async function wzFinish(partial){
  await wzPersist({ completed:true, completed_at:new Date().toISOString(), tutorial_done:false, finished_partial:!!partial });
  let address='';
  try{ const { data }=await db.functions.invoke("provision-email",{ body:{} }); if(data&&data.ok&&data.address) address=data.address; }catch(_e){}
  try{ await db.functions.invoke("apply-preset",{ body:{ industry: state.account.industry||'' } }); }catch(_e){}
  try{ await loadData(); }catch(_e){}
  try{ const bk=(state.account.settings&&state.account.settings.booking)||{}; if(bk.enabled===undefined && state.types && state.types.length){ const settings=Object.assign({}, state.account.settings||{}, { booking:Object.assign({}, bk, { enabled:true }) }); const { error }=await db.from('accounts').update({settings}).eq('id',state.account.id); if(!error) state.account.settings=settings; } }catch(_e){}
  state.wizStep=0; state.wz=null;
  try{ if(location.search) history.replaceState(null,'',location.pathname); }catch(_e){}
  renderApp();
  if(!partial) wzStartTutorial(address);
}
// Setup by phone: Donna is on the line with the owner; this screen waits, then shows what she set up.
function wzPhoneSetupWait(){
  const g=state.wz;
  document.getElementById("root").innerHTML=wzShell(`
    <h1><span class="wz-pulse"></span>${wt('{0} is calling you.', esc(DEFAULT_NAME))}</h1>
    <p class="lede">${wt('Pick up and chat — she\'ll ask about your hours, what people book, and how you want calls handled. This screen fills in as you talk. Hang up whenever you\'re done.')}</p>
    <div class="wz-msg" id="wz-m" style="color:var(--muted)">${wt('Waiting for the call to finish…')}</div>
    <div id="wz-ps-out" style="margin-top:12px"></div>
  `,{noFooter:true, noExit:true});
  let n=0; clearInterval(state._psTimer);
  state._psTimer=setInterval(async()=>{ n++; if(n>90){ clearInterval(state._psTimer); $("#wz-m").textContent=wt('That took a while. You can keep going on screen.'); $("#wz-ps-out").innerHTML='<button class="btn primary" id="wz-ps-screen">'+wt('Continue on screen')+'</button>'; $("#wz-ps-screen").onclick=()=>{ state.wizStep=0; renderWizard(); }; return; }
    const r=await setupApi({ action:'phone_setup_result', call_id:g.callId, apply:true });
    if(!r.ok||!r.done) return;
    clearInterval(state._psTimer);
    if(r.empty){ $("#wz-m").textContent=wt(r.message||'The call was too short.'); $("#wz-ps-out").innerHTML='<button class="btn primary" id="wz-ps-screen">'+wt('Continue on screen')+'</button>'; $("#wz-ps-screen").onclick=()=>{ state.wizStep=0; renderWizard(); }; return; }
    try{ await loadData(); }catch(_e){}
    g.applied=true; g.industry=state.account.industry||g.industry;
    const p=r.proposal||{};
    $("#wz-m").style.color='var(--ok)'; $("#wz-m").textContent=wt('Got it. Here is what I set up:');
    $("#wz-ps-out").innerHTML=`<div class="wz-kv">${r.summary?`<div style="margin-bottom:8px">${esc(r.summary)}</div>`:''}${p.hours?`<div><b>${wt('Hours')}</b> ${DAYS.filter((d,i)=>p.hours.days[i]).map(d=>wt(d.slice(0,3))).join(', ')} ${esc(p.hours.open)}–${esc(p.hours.close)}</div>`:''}${(p.services||[]).length?`<div><b>${wt('Services')}</b> ${esc(p.services.map(s=>s.name+(s.price?' '+s.price:'')).join(', '))}</div>`:''}${(p.team||[]).length?`<div><b>${wt('Team')}</b> ${esc(p.team.map(t=>t.name).join(', '))}</div>`:''}${p.transfer_number?`<div><b>${wt('Transfers')}</b> ${wt('to {0}', esc(prettyPhone(p.transfer_number)))}</div>`:''}${p.policies?`<div><b>${wt('Notes')}</b> ${esc(p.policies)}</div>`:''}</div><div class="hint" style="font-size:12.5px;color:var(--muted);margin-top:8px">${wt('Something off? Notes live under <b>Knowledge</b> and transfers under <b>Assistant</b> once you\'re in — change anything there, or tell {0} by text and she\'ll fix it.', esc(DEFAULT_NAME))}</div><div style="margin-top:14px"><button class="btn primary" id="wz-ps-next">${wt('Next: your phone number')}</button></div>`;
    $("#wz-ps-next").onclick=async()=>{ state.wizStep=3; await wzPersist({}); renderWizard(); };
  },5000);
}
function prettyPhone(p){ const d=String(p||'').replace(/\D/g,''); if(d.length===11&&d[0]==='1') return `(${d.slice(1,4)}) ${d.slice(4,7)}-${d.slice(7)}`; if(d.length===10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`; return p||''; }
// "Donna asks you later": what setup still needs, shown on Today and texted one question at a time. Answer here or let her text you.
async function paintSetupQueue(){
  const el=$("#setup-queue"); if(!el) return;
  const ob=obState()||{}; if(ob.queue_dismissed_at && Date.now()-new Date(ob.queue_dismissed_at).getTime()<7*864e5) return;
  const r=await setupApi({ action:'queue' }); if(!r.ok||!(r.items||[]).length){ el.innerHTML=''; return; }
  const items=r.items.slice(0,4);
  el.innerHTML=`<div class="card" style="border-color:#cfe3d6;background:linear-gradient(180deg,#f6fbf7,#fff)"><div class="card-h"><h2>${esc(aName())} has ${r.items.length===1?'one question':r.items.length+' questions'} for you</h2><button class="btn sm" id="sq-later">Text me instead</button></div>
    <p style="font-size:12.5px;color:var(--muted);margin:-4px 0 10px">Answer here in a sentence, or let her text you one at a time. Either way she fills it in herself.</p>
    ${items.map(i=>`<div style="padding:9px 0;border-top:1px solid var(--line-2)"><div style="font-size:13.5px;font-weight:600">${esc(i.question)}</div><div style="font-size:12px;color:var(--muted);margin:2px 0 6px">${esc(i.why)}</div>
      ${i.kind==='link'?`<button class="btn sm primary" data-sq-go="${i.key}">${i.key==='stripe'?'Connect Stripe':'Open'}</button>`:`<div style="display:flex;gap:6px;flex-wrap:wrap"><input class="inp" data-sq-in="${i.key}" placeholder="Type your answer…" style="flex:1;min-width:220px"><button class="btn sm primary" data-sq-save="${i.key}">Save</button><button class="btn sm" data-sq-skip="${i.key}" title="Not relevant to me">Not needed</button></div>`}
      <div data-sq-msg="${i.key}" style="font-size:12px;color:var(--muted);margin-top:4px;min-height:14px">${i.asked_at?'Texted you '+new Date(i.asked_at).toLocaleDateString()+' — reply there or answer here.':''}</div></div>`).join('')}
  </div>`;
  el.querySelectorAll('[data-sq-save]').forEach(b=>b.onclick=async()=>{ const k=b.dataset.sqSave; const inp=el.querySelector(`[data-sq-in="${k}"]`); const m=el.querySelector(`[data-sq-msg="${k}"]`); const text=(inp.value||'').trim(); if(!text){ m.textContent='Type something first.'; return; } b.disabled=true; m.textContent='Saving…'; const r2=await setupApi({ action:'answer', key:k, text }); if(r2.ok){ m.style.color='var(--ok)'; m.textContent=r2.note||'Got it.'; setTimeout(()=>{ paintSetupQueue(); try{ loadData(); }catch(_e){} },900); } else { m.style.color='var(--danger)'; m.textContent='Could not save.'; b.disabled=false; } });
  el.querySelectorAll('[data-sq-skip]').forEach(b=>b.onclick=async()=>{ await setupApi({ action:'answered', key:b.dataset.sqSkip }); paintSetupQueue(); });
  el.querySelectorAll('[data-sq-go]').forEach(b=>b.onclick=()=>{ const k=b.dataset.sqGo; if(k==='stripe'){ state.view=salonOn()?'money':(paymentsOn()?'jobs':'settings'); } else state.view='assistant'; renderPage(); });
  $("#sq-later").onclick=async()=>{ const b=$("#sq-later"); b.disabled=true; const first=items.find(i=>i.kind!=='link')||items[0]; const r2=await setupApi({ action:'ask', key:first.key }); const { data:fresh }=await db.from('accounts').select('settings').eq('id',state.account.id).maybeSingle(); /* re-read: ask() just wrote asked/pending_question server-side */ const settings=Object.assign({}, (fresh&&fresh.settings)||state.account.settings||{}); settings.onboarding=Object.assign({}, settings.onboarding||{}, { queue_dismissed_at:new Date().toISOString(), text_mode:true }); await db.from('accounts').update({settings}).eq('id',state.account.id); state.account.settings=settings; el.innerHTML=`<div class="card"><p style="font-size:13px;color:var(--muted);margin:0">${r2.ok&&r2.sent?esc(aName())+' just texted you the first one. She\'ll send the rest over the next few days.':'Could not text you — is your mobile on your account? '+esc(aName())+' will ask here instead.'}</p></div>`; };
}
function wzStartTutorial(address){
  const stops=[
    {t:wt("You're live."), b:(address?wt("Customers can now call your number and email {0}.", address):wt("Customers can now reach {0}.", aName()))+" "+wt("{0} answers and handles the routine, and brings you in when it matters.", aName())},
    {t:"Inbox", b:wt("Email conversations show up under Inbox. {0} drafts replies and holds them for your approval, so nothing goes out without you.", aName())},
    {t:"Knowledge", b:wt("Everything {0} says comes from Knowledge. Review what we imported from your website, add documents, or type answers. Approve an item before she uses it.", aName())},
    {t:"Messages and Calls", b:wt("Missed calls, messages, and booking requests land here and get emailed to you, so you can follow up fast.")},
    {t:wt("Your booking link"), b:wt("Under Booking page you'll find a link and a QR code people can use to book themselves, any time. Put it on your Google listing, Instagram, and website, and {0} can text it to callers too.", aName())},
    {t:wt("Try her now"), b:wt("Call your own number and say hello. That's the fastest way to hear how {0} sounds to your customers.", aName())}
  ];
  let i=0;
  const host=document.createElement('div'); host.id='wz-tour'; document.body.appendChild(host);
  const paint=()=>{
    const s=stops[i];
    host.innerHTML=`
    <style>
      #wz-tour{position:fixed;inset:0;background:rgba(17,24,20,.55);display:flex;align-items:center;justify-content:center;z-index:9999}
      .tour-card{background:#fff;color:#111;max-width:420px;width:calc(100% - 40px);border-radius:16px;padding:24px}
      .tour-step{font-size:12px;color:#789;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
      .tour-card h3{font-size:19px;margin:6px 0 8px} .tour-card p{line-height:1.55;color:#445;margin:0 0 18px}
      .tour-foot{display:flex;align-items:center;gap:8px} .tour-dots{display:flex;gap:5px;margin-right:auto}
      .tour-d{width:7px;height:7px;border-radius:50%;background:#dfe5e2} .tour-d.on{background:#2f6f4f}
      .tour-card .btn{border:0;border-radius:9px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
      .btn-skip{background:transparent;color:#789} .btn-go{background:#2f6f4f;color:#fff}
    </style>
    <div class="tour-card">
      <div class="tour-step">${wt('Getting started')}</div>
      <h3>${esc(s.t)}</h3><p>${esc(s.b)}</p>
      <div class="tour-foot"><div class="tour-dots">${stops.map((_,j)=>`<span class="tour-d ${j===i?'on':''}"></span>`).join("")}</div>
        <button class="btn btn-skip" id="tour-skip">${i===stops.length-1?wt('Close'):wt('Skip')}</button>
        <button class="btn btn-go" id="tour-next">${i===stops.length-1?wt('Done'):wt('Next')}</button></div>
    </div>`;
    const close=async()=>{ host.remove(); try{ await wzMarkTutorialDone(); }catch(_e){} };
    $("#tour-skip").onclick=close;
    $("#tour-next").onclick=()=>{ if(i>=stops.length-1){ close(); } else { i++; paint(); } };
  };
  paint();
}
async function wzMarkTutorialDone(){
  const cur=(state.account.settings&&state.account.settings.onboarding)||{};
  const onboarding=Object.assign({}, cur, {tutorial_done:true});
  const settings=Object.assign({}, state.account.settings||{}, {onboarding});
  await db.from('accounts').update({settings}).eq('id',state.account.id);
  state.account.settings=settings;
}

async function boot(){
  if(IMP){ return bootImpersonation(); }
  if(pendingRecovery){ state.authMode="reset"; renderAuth(); return; }
  document.getElementById("root").innerHTML=`<div class="booting">Loading…</div>`;
  const { data:{ session } } = await db.auth.getSession();
  if(!session){ renderAuth(); return; }
  let ok = await loadData();
  if(!ok){ await new Promise(r=>setTimeout(r,1200)); ok = await loadData(); } // give the signup trigger a moment
  if(ok){ if(new URLSearchParams(location.search).get('billing')){ await billingReturn(); if(!needsOnboarding()&&isManager()) state.view='billing'; }
    const forceSetup=new URLSearchParams(location.search).has('setup')&&isManager(); if(forceSetup){ state.wizStep=0; state.wz=null; } if(needsOnboarding()||forceSetup){ renderWizard(); } else { renderApp(); } } else { renderAuth(); }
}
db.auth.onAuthStateChange((event)=>{ if(event==='PASSWORD_RECOVERY'){ pendingRecovery=true; state.authMode='reset'; renderAuth(); } });
if('speechSynthesis' in window){ window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged=()=>{}; }
boot();
