    const tenants=(c.people||[]).filter(x=>x.role==='tenant'); const coiBy={}; (c.coi||[]).forEach(t=>{ const k=(t.unit||'').toLowerCase(); if(k&&!coiBy[k]) coiBy[k]=t; });
    const soon=d=>{ if(!d) return ''; const days=Math.ceil((new Date(d+'T00:00:00')-Date.now())/864e5); return days<0?`<span style="color:#b4443a">lease ended ${pmFmtDate(d)}</span>`:(days<=60?`<span style="color:#8a6d00">lease ends ${pmFmtDate(d)} (${days}d)</span>`:`lease ends ${pmFmtDate(d)}`); };
    resCards+=`<div class="card"><div class="card-h"><h2>Units &amp; leases</h2><span class="hint">who’s in each unit, lease dates, renters insurance</span></div>
      ${tenants.length?tenants.sort((a,b)=>String(a.unit||'').localeCompare(String(b.unit||''),undefined,{numeric:true})).map(t=>{ const coi=coiBy[String(t.unit||'').toLowerCase()]; return `<div class="block-item" style="align-items:flex-start"><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px">${t.unit?'Unit '+esc(t.unit)+' · ':''}${esc(t.name||'(tenant)')} ${p.require_tenant_insurance?(coi?pmPill(COI_STATUS,coi.status):'<span class="lang-badge" style="background:#fbe6e4;color:#b4443a">no insurance on file</span>'):''}</div><div style="font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span>${esc([t.phone,t.email].filter(Boolean).join(' · '))}</span><span>${soon(t.lease_end)}</span>${t.rent_due_day?`<span>rent due the ${t.rent_due_day}${['th','st','nd','rd'][(t.rent_due_day%10>3||[11,12,13].includes(t.rent_due_day%100))?0:t.rent_due_day%10]}</span>`:''}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center"><input class="inp" type="date" style="max-width:150px" id="ls-${t.id}" value="${esc(t.lease_start||'')}" title="Lease start"><input class="inp" type="date" style="max-width:150px" id="le-${t.id}" value="${esc(t.lease_end||'')}" title="Lease end"><input class="inp" style="max-width:90px" inputmode="numeric" id="rd-${t.id}" value="${t.rent_due_day||''}" placeholder="Due day"><button class="btn sm" data-lease="${t.id}">Save lease</button></div></div></div>`; }).join(''):`<div class="empty" style="padding:14px">Add tenants under People; lease dates go here.</div>`}
    </div>`;
  }
  // Upcoming visits at this property (all types)
  const ap=(c.appointments||[]);
  const visitsCard=`<div class="card"><div class="card-h"><h2>Upcoming visits here</h2><span class="hint">showings, inspections, vendor access, meetings</span></div>${ap.length?ap.map(a=>`<div class="block-item"><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px">${esc(a.title||a.kind||'Visit')}</div><div style="font-size:12px;color:var(--muted)">${pmWhen(a.starts_at)}${a.unit?' · '+esc(a.unit):''}${a.location_address?' · '+esc(a.location_address):''}</div></div></div>`).join(''):`<div class="empty" style="padding:14px">Nothing scheduled here yet.</div>`}</div>`;

  // Compliance calendar (Stage 5) — all types
  const comp=c.compliance||[];
  const compCard=`<div class="card"><div class="card-h"><h2>Compliance calendar</h2><span class="hint">${esc(aName())} reminds you, then schedules the access</span></div>
    <p style="font-size:12.5px;color:var(--muted);margin:-4px 0 10px">${isHoa?'Pool permit, backflow, playground inspection, reserve study, insurance renewal, annual meeting notice, tax filing.':isCom?'Elevator certificate, fire alarm & sprinkler, backflow, fire marshal, roof warranty inspection, insurance renewal.':'Smoke/CO detector checks, HVAC service, insurance renewal, city registration, lease renewals.'} Recurring items roll forward when you mark them done.</p>
    <div id="cp-list">${comp.length?comp.map(x=>{ const days=Math.ceil((new Date(x.due_date+'T00:00:00')-Date.now())/864e5); const late=days<0&&x.status!=='done'; return `<div class="block-item" style="${late?'border-left:3px solid var(--danger)':''}"><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px">${esc(x.title)} <span class="lang-badge">${esc(x.kind)}</span>${x.access_needed?' <span class="lang-badge" style="background:#e8f0fa;color:#164a85">needs access</span>':''}</div><div style="font-size:12px;color:${late?'#b4443a':'var(--muted)'}">${late?'Overdue — was due ':'Due '}${pmFmtDate(x.due_date)}${x.frequency_months?' · every '+x.frequency_months+' mo':''}${x.vendor_name?' · '+esc(x.vendor_name):''}${x.notes?' · '+esc(x.notes):''}</div></div><div style="display:flex;gap:6px">${x.access_needed&&x.status!=='done'?`<button class="btn sm" data-cpaccess="${x.id}">Schedule access</button>`:''}<button class="btn sm primary" data-cpdone="${x.id}">Done</button><button class="btn sm" data-cpdel="${x.id}">Remove</button></div></div>`; }).join(''):`<div class="empty" style="padding:14px">No compliance items yet.</div>`}</div>
    <div class="grid-2" style="margin-top:12px"><div class="field"><label class="lab">Item</label><input class="inp" id="cp-title" placeholder="${isHoa?'e.g. Pool health permit renewal':isCom?'e.g. Elevator annual certificate':'e.g. Smoke detector check'}"></div><div class="field"><label class="lab">Kind</label><select class="inp" id="cp-kind">${pmOpts([["inspection","Inspection"],["certificate","Certificate / permit"],["insurance","Insurance renewal"],["filing","Filing / tax"],["maintenance","Preventive maintenance"],["meeting","Meeting / notice"],["other","Other"]],'inspection')}</select></div></div>
    <div class="grid-2"><div class="field"><label class="lab">Due</label><input class="inp" type="date" id="cp-due"></div><div class="field"><label class="lab">Repeats every <span class="sub">months, blank = once</span></label><input class="inp" id="cp-freq" inputmode="numeric" placeholder="12"></div></div>
    <div class="grid-2"><div class="field"><label class="lab">Vendor <span class="sub">optional</span></label><input class="inp" id="cp-vendor" placeholder="e.g. Otis / city inspector"></div><div class="field"><label class="lab">Remind me <span class="sub">days before</span></label><input class="inp" id="cp-remind" inputmode="numeric" value="30"></div></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label style="font-size:12.5px;display:flex;align-items:center;gap:6px"><input type="checkbox" id="cp-access" style="width:auto"> needs access to ${isHoa?'homes':isCom?'suites':'units'} (${esc(aName())} coordinates)</label><button class="btn primary" id="cp-add">Add item</button><span id="cp-msg" style="font-size:12px;color:var(--muted)"></span></div>
  </div>`;
  const approvals=(c.approvals||[]);
  const apprCard=approvals.length?`<div class="card"><div class="card-h"><h2>Approvals</h2><span class="hint">one-tap, by email or text</span></div>${approvals.map(a=>`<div class="block-item"><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px">${esc(a.summary||'Approval')}${a.amount!=null?' · '+pmMoney(a.amount):''} ${pmPill({pending:['Waiting','#8a6d00','#fdf3d6'],approved:['Approved','#1f7a4d','#e7f5ee'],declined:['Declined','#b4443a','#fbe6e4'],expired:['Expired','#8a8f98','#eef0f2'],cancelled:['Cancelled','#8a8f98','#eef0f2']},a.status)}</div><div style="font-size:12px;color:var(--muted)">${esc(a.approver_name||a.approver_email||'')}${a.sent_at?' · sent '+pmWhen(a.sent_at):''}${a.decided_at?' · decided '+pmWhen(a.decided_at):''}${a.decision_note?' · '+esc(a.decision_note):''}</div></div></div>`).join('')}</div>`:'';
  return queueCard+incidentCard+hoaCards+comCards+resCards+(isHoa?'':pmMeetingsCardStandalone(p,c))+visitsCard+compCard+apprCard;
}
function pmMeetingsBlock(p, mtgs, rsvps){
  const cnt=m=>{ const r=rsvps.filter(x=>x.meeting_id===m.id); const att=r.filter(x=>x.attending&&!x.proxy).length, prox=r.filter(x=>x.proxy).length; return {att,prox,total:att+prox}; };
  return `<div style="font-weight:600;font-size:12.5px;margin:16px 0 6px;padding-top:12px;border-top:1px solid var(--line-2)">Meetings &amp; hearings <span class="hint" style="font-weight:400">${esc(aName())} answers “when is the meeting?”, takes RSVPs and proxies, and counts quorum</span></div>
    <div id="mt-list">${mtgs.length?mtgs.map(m=>{ const q=cnt(m); const quorum=m.quorum_required?` · quorum ${q.total}/${m.quorum_required}${q.total>=m.quorum_required?' ✓':''}`:''; return `<div class="block-item"><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px">${esc(m.title)} <span class="lang-badge">${esc(m.kind)}</span></div><div style="font-size:12px;color:var(--muted)">${pmWhen(m.starts_at)}${m.location?' · '+esc(m.location):''}${m.virtual_url?' · online':''} · ${q.att} attending, ${q.prox} proxies${quorum}${m.notice_sent_at?' · notice sent '+pmDay(m.notice_sent_at):''}</div></div><div style="display:flex;gap:6px">${m.notice_sent_at?'':`<button class="btn sm" data-mtnotice="${m.id}">Send notice</button>`}<button class="btn sm" data-mtdel="${m.id}">Remove</button></div></div>`; }).join(''):`<div class="empty" style="padding:14px">No meetings scheduled.</div>`}</div>
    <div class="grid-2" style="margin-top:12px"><div class="field"><label class="lab">Meeting</label><input class="inp" id="mt-title" placeholder="e.g. Annual meeting / Board meeting / Violation hearing"></div><div class="field"><label class="lab">Kind</label><select class="inp" id="mt-kind">${pmOpts([["board","Board meeting"],["annual","Annual meeting"],["special","Special meeting"],["budget","Budget meeting"],["hearing","Hearing"],["other","Other"]],'board')}</select></div></div>
    <div class="grid-2"><div class="field"><label class="lab">When</label><input class="inp" type="datetime-local" id="mt-when"></div><div class="field"><label class="lab">Where <span class="sub">or a video link</span></label><input class="inp" id="mt-where" placeholder="Clubhouse / Zoom link"></div></div>
    <div class="grid-2"><div class="field"><label class="lab">Quorum needed <span class="sub">owners or proxies — optional</span></label><input class="inp" id="mt-quorum" inputmode="numeric"></div><div class="field"><label class="lab">Agenda <span class="sub">optional</span></label><input class="inp" id="mt-agenda" placeholder="Budget vote; pool resurfacing; elections"></div></div>
    <div style="display:flex;gap:10px;align-items:center"><button class="btn primary" id="mt-add">Add meeting</button><span id="mt-msg" style="font-size:12px;color:var(--muted)"></span></div>`;
}
function pmMeetingsCardStandalone(p,c){ return `<div class="card"><div class="card-h"><h2>Meetings</h2><span class="hint">owner meetings, tenant town halls, hearings</span></div>${pmMeetingsBlock(p, c.meetings||[], c.rsvps||[])}</div>`; }

async function pmLoadPropertyExtras(id){
  const since=new Date(Date.now()-120*864e5).toISOString();
  const [srs,ams,res,ap,inc,comp,mtg,appr]=await Promise.all([
    db.from('service_requests').select('*').eq('property_id',id).gte('created_at',since).order('created_at',{ascending:false}).limit(300),
    db.from('amenities').select('*').eq('property_id',id).eq('is_active',true).order('name'),
    db.from('amenity_reservations').select('*, amenities(name)').eq('property_id',id).gte('ends_at',new Date().toISOString()).order('starts_at').limit(30),
    db.from('appointments').select('id,title,kind,starts_at,unit,location_address,status').eq('property_id',id).gte('starts_at',new Date().toISOString()).neq('status','cancelled').order('starts_at').limit(12),
    db.from('pm_incidents').select('*').eq('property_id',id).eq('is_active',true).order('started_at',{ascending:false}).limit(1),
    db.from('pm_compliance_items').select('*').eq('property_id',id).neq('status','done').order('due_date').limit(50),
    db.from('pm_meetings').select('*').eq('property_id',id).gte('starts_at',new Date(Date.now()-864e5).toISOString()).neq('status','cancelled').order('starts_at').limit(12),
    db.from('pm_approvals').select('*').eq('property_id',id).order('created_at',{ascending:false}).limit(10)
  ]);
  const mtgs=mtg.data||[]; let rsvps=[];
  if(mtgs.length){ const { data }=await db.from('pm_meeting_rsvps').select('meeting_id,attending,proxy').in('meeting_id',mtgs.map(m=>m.id)); rsvps=data||[]; }
  return { srs:srs.data||[], amenities:ams.data||[], reservations:res.data||[], appointments:ap.data||[], incidents:inc.data||[], compliance:comp.data||[], meetings:mtgs, rsvps, approvals:appr.data||[] };
}
function pmBindTypeCards(id, p, c){
  const box=$("#pm-detail"); if(!box) return;
  box.querySelectorAll('[data-pmq]').forEach(b=>b.onclick=()=>pmGoRequests(id, b.dataset.pmq));
  const rep=$("#pq-report"); if(rep) rep.onclick=()=>pmOpenReport(id);
  // incident
  const post=$("#inc-post"); if(post) post.onclick=async()=>{ const title=$("#inc-title").value.trim(), message=$("#inc-msg-text").value.trim(), eta=$("#inc-eta").value.trim(); const m=$("#inc-msg"); if(!title||!message){ m.textContent='Add a title and what to say.'; return; } m.textContent='Posting…'; const { data, error }=await db.from('pm_incidents').insert({ account_id:state.account.id, property_id:id, title, message, eta:eta||null }).select('id').maybeSingle(); if(error){ m.textContent=error.message; return; } if($("#inc-bc").checked&&data){ m.textContent='Broadcasting…'; await pmCoord('broadcast_incident',{ incident_id:data.id }); } openProperty(id); };
  const upd=$("#inc-update"); if(upd) upd.onclick=async()=>{ const inc=(c.incidents||[])[0]; if(!inc) return; await db.from('pm_incidents').update({ eta:$("#inc-eta").value.trim()||null }).eq('id',inc.id); openProperty(id); };
  const bc=$("#inc-broadcast"); if(bc) bc.onclick=async()=>{ const inc=(c.incidents||[])[0]; if(!inc) return; const m=$("#inc-msg"); m.textContent='Broadcasting…'; const r=await pmCoord('broadcast_incident',{ incident_id:inc.id }); m.textContent=r.ok?`Sent to ${r.sent||0}`:(r.error||'Could not send'); setTimeout(()=>openProperty(id),900); };
  const rs=$("#inc-resolve"); if(rs) rs.onclick=async()=>{ const inc=(c.incidents||[])[0]; if(!inc) return; const m=$("#inc-msg"); m.textContent='Clearing…'; await db.from('pm_incidents').update({ is_active:false, resolved_at:new Date().toISOString() }).eq('id',inc.id); if(inc.broadcast_at) await pmCoord('broadcast_incident',{ incident_id:inc.id, resolved:true }); openProperty(id); };
  // amenities
  const amAdd=$("#am-add"); if(amAdd) amAdd.onclick=async()=>{ const name=$("#am-name").value.trim(); const m=$("#am-msg"); if(!name){ m.textContent='Name the amenity.'; return; } const { error }=await db.from('amenities').insert({ account_id:state.account.id, property_id:id, name, hours:$("#am-hours").value.trim()||null, capacity:pmNum($("#am-cap").value), fee:$("#am-fee").value.trim()||null, deposit:$("#am-dep").value.trim()||null, rules:$("#am-rules").value.trim()||null, reservable:$("#am-res").checked }); if(error){ m.textContent=error.message; return; } openProperty(id); };
  box.querySelectorAll('[data-amdel]').forEach(b=>b.onclick=async()=>{ await db.from('amenities').update({is_active:false}).eq('id',b.dataset.amdel); openProperty(id); });
  box.querySelectorAll('[data-rescancel]').forEach(b=>b.onclick=async()=>{ await db.from('amenity_reservations').update({status:'cancelled'}).eq('id',b.dataset.rescancel); openProperty(id); });
  // board
  const bd=$("#bd-save"); if(bd) bd.onclick=async()=>{ const m=$("#bd-msg"); m.textContent='Saving…'; const board=Object.assign({}, p.board||{}, { president:$("#bd-pres").value.trim()||null, treasurer:$("#bd-treas").value.trim()||null, approver_email:$("#bd-approver").value.trim()||null, meeting_schedule:$("#bd-sched").value.trim()||null }); const { error }=await db.from('properties').update({ board }).eq('id',id); m.textContent=error?error.message:'Saved.'; if(!error) await loadProperties(); };
  // meetings
  const mt=$("#mt-add"); if(mt) mt.onclick=async()=>{ const title=$("#mt-title").value.trim(), when=$("#mt-when").value; const m=$("#mt-msg"); if(!title||!when){ m.textContent='Title and time, please.'; return; } const where=$("#mt-where").value.trim(); const { error }=await db.from('pm_meetings').insert({ account_id:state.account.id, property_id:id, title, kind:$("#mt-kind").value, starts_at:new Date(when).toISOString(), location:/^https?:/i.test(where)?null:(where||null), virtual_url:/^https?:/i.test(where)?where:null, quorum_required:pmNum($("#mt-quorum").value), agenda:$("#mt-agenda").value.trim()||null }); if(error){ m.textContent=error.message; return; } openProperty(id); };
  box.querySelectorAll('[data-mtdel]').forEach(b=>b.onclick=async()=>{ await db.from('pm_meetings').update({status:'cancelled'}).eq('id',b.dataset.mtdel); openProperty(id); });
  box.querySelectorAll('[data-mtnotice]').forEach(b=>b.onclick=async()=>{ b.disabled=true; b.textContent='Sending…'; const r=await pmCoord('meeting_notice',{ meeting_id:b.dataset.mtnotice }); b.textContent=r.ok?`Sent to ${r.sent||0}`:(r.error||'Failed'); setTimeout(()=>openProperty(id),1200); });
  // leases
  box.querySelectorAll('[data-lease]').forEach(b=>b.onclick=async()=>{ const pid=b.dataset.lease; await db.from('property_contacts').update({ lease_start:document.getElementById('ls-'+pid).value||null, lease_end:document.getElementById('le-'+pid).value||null, rent_due_day:pmNum(document.getElementById('rd-'+pid).value) }).eq('id',pid); b.textContent='Saved'; setTimeout(()=>openProperty(id),600); });
  // compliance
  const cp=$("#cp-add"); if(cp) cp.onclick=async()=>{ const title=$("#cp-title").value.trim(), due=$("#cp-due").value; const m=$("#cp-msg"); if(!title||!due){ m.textContent='Item and due date, please.'; return; } const { error }=await db.from('pm_compliance_items').insert({ account_id:state.account.id, property_id:id, title, kind:$("#cp-kind").value, due_date:due, frequency_months:pmNum($("#cp-freq").value), vendor_name:$("#cp-vendor").value.trim()||null, remind_days:pmNum($("#cp-remind").value)||30, access_needed:$("#cp-access").checked }); if(error){ m.textContent=error.message; return; } openProperty(id); };
  box.querySelectorAll('[data-cpdone]').forEach(b=>b.onclick=async()=>{ const it=(c.compliance||[]).find(x=>x.id===b.dataset.cpdone); if(!it) return; const today=new Date().toISOString().slice(0,10); if(it.frequency_months){ const d=new Date(it.due_date+'T00:00:00'); d.setMonth(d.getMonth()+Number(it.frequency_months)); while(d<new Date()) d.setMonth(d.getMonth()+Number(it.frequency_months)); await db.from('pm_compliance_items').update({ due_date:d.toISOString().slice(0,10), completed_on:today, status:'scheduled', reminded_at:null }).eq('id',it.id); } else { await db.from('pm_compliance_items').update({ status:'done', completed_on:today }).eq('id',it.id); } openProperty(id); });
  box.querySelectorAll('[data-cpdel]').forEach(b=>b.onclick=async()=>{ await db.from('pm_compliance_items').delete().eq('id',b.dataset.cpdel); openProperty(id); });
  box.querySelectorAll('[data-cpaccess]').forEach(b=>b.onclick=async()=>{ b.disabled=true; b.textContent='Scheduling…'; const r=await pmCoord('compliance_access',{ compliance_id:b.dataset.cpaccess }); b.textContent=r.ok?`Asked ${r.sent||0} ${r.sent===1?'resident':'residents'}`:(r.error||'Failed'); });
}

/* ---------- Owner / board report (printable) ---------- */
async function pmOpenReport(propId){
  const p=((state.pm&&state.pm.props)||[]).find(x=>x.id===propId); if(!p) return;
  const now=new Date(); const start=new Date(now.getFullYear(), now.getMonth()-1, 1); const end=new Date(now.getFullYear(), now.getMonth(), 1);
  const period=start.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const w=window.open('','_blank'); if(w) w.document.write('<title>Report</title><p style="font-family:system-ui;padding:30px">Building the report…</p>');
  const [srs,appr,res,comp,mtg,calls]=await Promise.all([
    db.from('service_requests').select('*').eq('property_id',propId).gte('created_at',start.toISOString()).lt('created_at',end.toISOString()).order('created_at'),
    db.from('pm_approvals').select('*').eq('property_id',propId).gte('created_at',start.toISOString()).lt('created_at',end.toISOString()),
    db.from('amenity_reservations').select('*, amenities(name)').eq('property_id',propId).gte('starts_at',start.toISOString()).lt('starts_at',end.toISOString()),
    db.from('pm_compliance_items').select('*').eq('property_id',propId).neq('status','done').lte('due_date',new Date(now.getTime()+60*864e5).toISOString().slice(0,10)).order('due_date'),
    db.from('pm_meetings').select('*').eq('property_id',propId).gte('starts_at',now.toISOString()).neq('status','cancelled').order('starts_at').limit(5),
    db.from('calls').select('id,started_at,duration_seconds,outcome').eq('account_id',state.account.id).gte('started_at',start.toISOString()).lt('started_at',end.toISOString())
  ]);
  const rows=srs.data||[]; const isHoa=p.property_type==='hoa';
  const byType={}; rows.forEach(r=>{ byType[r.request_type]=(byType[r.request_type]||0)+1; });

  <h1>${esc(p.name)}</h1><div style="color:#555">${isHoa?'Board report':'Owner report'} · ${period} · prepared by ${esc(state.account.company||state.account.name||'the management office')} with ${esc(aName())}</div>
  <div class="kpis"><div class="kpi"><b>${rows.length}</b><span>requests handled${phoneRows?` (${phoneRows} by phone)`:''}</span></div><div class="kpi"><b>${resolved}</b><span>resolved or closed</span></div><div class="kpi"><b>${emgs.length}</b><span>emergencies${avgResp!=null?` · avg ${avgResp} min to confirm`:''}</span></div><div class="kpi"><b>${(calls.data||[]).length}</b><span>calls answered by ${esc(aName())} (all properties)</span></div></div>
  <h2>Requests by type</h2><table style="font-size:13px;border-collapse:collapse;min-width:320px">${Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([t,n])=>tr(srTypeLabel(t),n)).join('')}${deflected?tr(isHoa?'In-home calls redirected (owner’s responsibility)':'Calls redirected per lease',deflected):''}</table>
  ${isHoa?`<h2>Governance</h2>${list('Architectural requests',arc)}${list('Violation reports',viol)}${list('Resale certificates & closing documents',resale)}${(res.data||[]).length?`<h3>Amenity reservations</h3><div style="font-size:13px">${(res.data||[]).length} reservation${(res.data||[]).length===1?'':'s'} (${Object.entries((res.data||[]).reduce((m,r)=>{ const k=(r.amenities&&r.amenities.name)||'Amenity'; m[k]=(m[k]||0)+1; return m; },{})).map(([k,v])=>esc(k)+' '+v).join(', ')})</div>`:''}`:''}
  ${emgs.length?list('Emergencies',emgs):''}
  ${list(isHoa?'Common-area work orders':'Work orders',rows.filter(r=>['maintenance','general'].includes(r.request_type)&&!srDeflected(r)))}
  <h2>Money</h2><table style="font-size:13px;border-collapse:collapse;min-width:320px">${tr('Approvals requested',(appr.data||[]).length)}${tr('Approved',approved.length+(dollars?' · '+pmMoney(dollars):''))}${tr('Declined',(appr.data||[]).filter(a=>a.status==='declined').length)}</table>
  <h2>Coming up</h2>${(comp.data||[]).length?`<h3>Compliance due in the next 60 days</h3><ul style="font-size:13px">${(comp.data||[]).map(x=>`<li>${pmFmtDate(x.due_date)} — ${esc(x.title)}${x.vendor_name?' ('+esc(x.vendor_name)+')':''}</li>`).join('')}</ul>`:'<div style="font-size:13px;color:#555">No compliance items due in the next 60 days.</div>'}${(mtg.data||[]).length?`<h3>Meetings</h3><ul style="font-size:13px">${(mtg.data||[]).map(m=>`<li>${pmWhen(m.starts_at)} — ${esc(m.title)}${m.location?' · '+esc(m.location):''}</li>`).join('')}</ul>`:''}
  <div style="margin-top:30px;font-size:11.5px;color:#777">Generated ${now.toLocaleString('en-US')} from ${esc(aName())}’s records. Every line links to a logged request with its reference number.</div>
  </body></html>`;
  if(w){ w.document.open(); w.document.write(html); w.document.close(); }
}

async function saveRule(){

/* ---- document upload (browser-side text extraction) ---- */
const KB_EXT_OK=['pdf','doc','docx','xls','xlsx','csv','txt'];
const KB_EXT_IMG=['jpg','jpeg','png','gif','heic','heif','webp','tif','tiff','bmp'];
async function extractText(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(ext==='txt'||ext==='csv') return await file.text();
  if(ext==='docx'){
    if(!window.mammoth) throw new Error("Reader still loading — try again in a moment.");
    const r=await window.mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});
    return r.value||"";
  }
  if(ext==='doc') throw new Error("Old .doc format isn't supported. Open it and Save As .docx, then upload.");
  if(ext==='xlsx'||ext==='xls'){
    if(!window.XLSX) throw new Error("Reader still loading — try again in a moment.");
    const wb=window.XLSX.read(await file.arrayBuffer(),{type:'array'});
    return wb.SheetNames.map(n=>{
      const csv=window.XLSX.utils.sheet_to_csv(wb.Sheets[n]);
      return (wb.SheetNames.length>1?("# "+n+"\n"):"")+csv;
    }).join("\n\n");
  }
  if(ext==='pdf'){
    if(!window.pdfjsLib) throw new Error("PDF reader still loading — try again in a moment.");
    const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    const out=[];
    for(let i=1;i<=pdf.numPages;i++){
      const tc=await (await pdf.getPage(i)).getTextContent();
      out.push(tc.items.map(it=>it.str).join(" "));
    }
    return out.join("\n\n");
  }
  throw new Error("Unsupported file type.");
}
async function handleFileUpload(e){
  const files=Array.from(e.target.files||[]); const msg=$("#kb-up-msg");
  e.target.value="";
  if(!files.length||!msg) return;
  let done=0, added=0, failed=0;
  for(const file of files){
    const ext=(file.name.split('.').pop()||'').toLowerCase();
    msg.style.color="var(--muted)"; msg.textContent=files.length>1?("Reading "+file.name+" ("+(done+1)+"/"+files.length+")…"):("Reading "+file.name+"…");
    if(KB_EXT_IMG.includes(ext)||!KB_EXT_OK.includes(ext)){ failed++; done++; continue; }
    let text="";
    try{ text=((await extractText(file))||"").trim(); }catch(err){ failed++; done++; continue; }
    if(text.length<20){ failed++; done++; continue; }
    msg.textContent="Teaching "+aName()+" from "+file.name+(files.length>1?(" ("+(done+1)+"/"+files.length+")…"):"…");
    try{
      const { data, error }=await db.functions.invoke("knowledge-ingest-document",{ body:{ filename:file.name, text } });
      if(error||!data||!data.ok) failed++; else added++;
    }catch(err){ failed++; }
    done++;
  }
  await loadDocuments(); refreshDocViews();
  if(added){ msg.style.color="var(--ok)"; msg.textContent="Added "+added+" file"+(added===1?"":"s")+" to review below"+(failed?(", "+failed+" skipped"):"")+"."; }
  else { msg.style.color="var(--danger)"; msg.textContent="Couldn't read "+failed+" file"+(failed===1?"":"s")+". Word, Excel, CSV, text, and text PDFs work; scans and photos need OCR."; }
}
function docCardHtml(d){
  const stats=state.docStats||{}; const pass=state.docPassages||{};
  const pill=(bg,fg,txt)=>`<span style="display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:${bg};color:${fg}">${txt}</span>`;
  const s=stats[d.id]||{total:0,approved:0}; const pending=s.total-s.approved;
  let status;
  if(s.total===0) status=`<span style="font-size:12px;color:var(--muted-2)">processing…</span>`;
  else if(pending>0) status=pill("var(--signal-soft)","var(--site)","Pending review · "+s.total+" passage"+(s.total===1?"":"s"));
  else status=pill("#e7f5ee","var(--ok)","Live · "+s.total+" passage"+(s.total===1?"":"s"));
  const open=state.docOpen&&state.docOpen.has(d.id);
  const viewBtn = s.total>0 ? `<button class="btn sm" data-docview="${d.id}">${open?"Hide":"View"}</button>` : "";
  const approveBtn = pending>0 ? `<button class="btn sm primary" data-docok="${d.id}">Approve</button>` : "";
  let passHtml="";
  if(open){
    const list=(pass[d.id]||[]);
    const rows = list.length ? list.map(p=>{
      const dot = p.approved ? `<span style="color:var(--ok);font-size:11px;font-weight:600">Live</span>` : `<span style="color:var(--site);font-size:11px;font-weight:600">Pending</span>`;
      return `<div style="display:flex;align-items:flex-start;gap:10px"><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:12.5px;margin-bottom:2px">${esc(p.title||"(untitled)")} <span style="margin-left:6px">${dot}</span></div><div style="font-size:12.5px;color:var(--muted)">${esc(p.content)}</div></div><button class="btn sm" data-passdel="${p.id}">Delete</button></div>`;
    }).join("") : `<div style="font-size:12px;color:var(--muted-2)">No passages.</div>`;
    const footer = pending>0 ? `<div style="display:flex;justify-content:flex-end;margin-top:4px"><button class="btn sm primary" data-docok="${d.id}">Approve ${pending} passage${pending===1?"":"s"}</button></div>` : "";
    passHtml = `<div style="margin-top:10px;border-top:1px solid var(--line-2);padding-top:10px;display:flex;flex-direction:column;gap:11px">`+rows+footer+`</div>`;
  }
  return `<div class="block-item" style="display:block"><div style="display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap"><div style="flex:1;min-width:150px"><div style="font-weight:600;font-size:13.5px;margin-bottom:4px">${esc(d.filename)}</div><div>${status}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${viewBtn}${approveBtn}<button class="btn sm" data-docdel="${d.id}">Delete</button></div></div>${passHtml}</div>`;
}
function renderDocSection(el, docs, allId, emptyTxt){
  if(!el) return;
  if(!state.docOpen) state.docOpen=new Set();
  if(!docs.length){ el.innerHTML=`<div style="font-size:12.5px;color:var(--muted-2)">${emptyTxt}</div>`; return; }
  const stats=state.docStats||{};
  let pendingDocs=0; docs.forEach(d=>{ const s=stats[d.id]||{total:0,approved:0}; if(s.total>s.approved) pendingDocs++; });
  const bar = pendingDocs>1 ? `<div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="btn sm primary" id="${allId}">Approve all (${pendingDocs})</button></div>` : "";
  el.innerHTML = bar + docs.map(docCardHtml).join("");
  const aa=$("#"+allId); if(aa) aa.onclick=()=>approveDocsIn(docs);
  el.querySelectorAll("[data-docview]").forEach(b=>b.onclick=()=>toggleDoc(b.dataset.docview));
  el.querySelectorAll("[data-docok]").forEach(b=>b.onclick=()=>approveDocument(b.dataset.docok));
  el.querySelectorAll("[data-docdel]").forEach(b=>b.onclick=()=>deleteDocument(b.dataset.docdel));
  el.querySelectorAll("[data-passdel]").forEach(b=>b.onclick=()=>deletePassage(b.dataset.passdel));
}

/* ---- voice interview ---- */
const IV_LANGS=[
  ["en-US","English"],["es-US","Spanish / Español"],["fr-FR","French / Français"],
  ["de-DE","German / Deutsch"],["it-IT","Italian / Italiano"],["pt-BR","Portuguese / Português"],
  ["zh-CN","Chinese / 中文"],["ja-JP","Japanese / 日本語"],["ko-KR","Korean / 한국어"],
  ["vi-VN","Vietnamese / Tiếng Việt"],["hi-IN","Hindi / हिन्दी"],["ru-RU","Russian / Русский"],
  ["nl-NL","Dutch / Nederlands"],["th-TH","Thai / ไทย"],["ar-SA","Arabic / العربية"]
];
function ivSpeechSupported(){ return !!(window.SpeechRecognition||window.webkitSpeechRecognition); }
function ivInitCard(){
  const sel=$("#iv-lang"); if(!sel) return;
  sel.innerHTML=IV_LANGS.map(([c,l])=>`<option value="${c}">${esc(l)}</option>`).join("");
  try{ if(window.speechSynthesis){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; } }catch(e){}
  const note=$("#iv-note");
  if(!ivSpeechSupported()){ if(note){ note.style.color="var(--danger)"; note.textContent="Voice needs Chrome on a computer. You can use website import, documents, or type knowledge instead."; } $("#iv-start").disabled=true; }
  $("#iv-start").onclick=ivStart;
  $("#iv-finish").onclick=()=>ivFinish(false);
  $("#iv-cancel").onclick=()=>ivFinish(true);
}
function ivPickVoice(langTag){
  if(!window.speechSynthesis) return null;
  const vs=speechSynthesis.getVoices()||[]; const base=langTag.split("-")[0].toLowerCase();
  const inLang=vs.filter(v=>v.lang&&v.lang.toLowerCase().startsWith(base));
  const fem=/(female|samantha|victoria|karen|moira|tessa|fiona|google us english|google uk english female|zira|susan|linda|allison|ava|joanna|amelie|am[ée]lie|anna|paulina|m[óo]nica|ting-ting|kyoko|yuna|milena|google español|sara|nicky|carmit)/i;
  return inLang.find(v=>fem.test(v.name))||inLang.find(v=>/female/i.test(v.name))||inLang[0]||vs.find(v=>fem.test(v.name))||vs[0]||null;
}
function ivSpeak(text){
  return new Promise(res=>{
    if(!window.speechSynthesis){ res(); return; }
    try{ speechSynthesis.cancel(); }catch(e){}
    const u=new SpeechSynthesisUtterance(text);
    const v=ivPickVoice(state.iv.langTag); if(v){ u.voice=v; u.lang=v.lang; } else { u.lang=state.iv.langTag; }
    u.rate=1; let done=false; const fin=()=>{ if(!done){ done=true; res(); } };
    u.onend=fin; u.onerror=fin;
    speechSynthesis.speak(u);
    setTimeout(fin, Math.min(16000, 2500+text.length*75));
  });
}
function ivListen(){
  return new Promise(res=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ res(""); return; }
    const rec=new SR(); state.iv.rec=rec;
    rec.lang=state.iv.langTag; rec.interimResults=false; rec.maxAlternatives=1; rec.continuous=false;
    let got=""; let done=false;
    const finish=(t)=>{ if(done) return; done=true; try{rec.stop();}catch(e){} res(t); };
    rec.onresult=(e)=>{ try{ got=e.results[0][0].transcript||""; }catch(_){ got=""; } };
    rec.onerror=()=>finish("");
    rec.onend=()=>finish(got);
    try{ rec.start(); }catch(e){ res(""); }
  });
}
function ivAddLine(role,text){
  state.iv.transcript.push({role,text});
  const el=$("#iv-transcript"); if(!el) return;
  const who=role==="assistant"?esc(aName()):"You";
  const color=role==="assistant"?"var(--ink)":"var(--virtual)";
  el.insertAdjacentHTML("beforeend",`<div style="margin-bottom:8px"><span style="font-weight:600;color:${color}">${who}:</span> ${esc(text)}</div>`);
  el.scrollTop=el.scrollHeight;
}
function ivSetStatus(t){ const s=$("#iv-status"); if(s) s.textContent=t; }
async function ivStart(){
  if(!ivSpeechSupported()) return;
  const sel=$("#iv-lang"); const langTag=sel.value; const langName=(IV_LANGS.find(x=>x[0]===langTag)||["","English"])[1].split(" / ")[0];
  state.iv={ langTag, langName, summary:"", turn:0, transcript:[], running:true, rec:null, maxTurns:16 };
  $("#iv-setup").style.display="none"; $("#iv-panel").style.display="";
  $("#iv-transcript").innerHTML=""; ivSetStatus("Connecting…");
  try{
    const first=await ivTurn(true);
    if(!first){ ivReset(); return; }
    await ivConverse();
  }catch(e){ ivSetStatus("Something went wrong. Press Finish to save what you have."); }
}
async function ivTurn(){
  const recent=state.iv.transcript.slice(-6);
  const { data, error }=await db.functions.invoke("interview-turn",{ body:{
    languageName:state.iv.langName, summary:state.iv.summary, recent, turn:state.iv.turn, maxTurns:state.iv.maxTurns, business:aName()
  }});
  if(error || !data || !data.ok){ ivSetStatus((data&&(data.message||data.error))||(error&&error.message)||"Model error."); return null; }
  state.iv.summary=data.summary||state.iv.summary;
  ivAddLine("assistant",data.say);
  ivSetStatus("Speaking…"); await ivSpeak(data.say);
  return data;
}
async function ivConverse(){
  let done=false;
  while(state.iv.running && !done && state.iv.turn < state.iv.maxTurns+4){
    ivSetStatus("Listening… speak your answer.");
    let answer=await ivListen();
    if(!state.iv.running) break;
    if(!answer){ ivSetStatus("Didn't catch that — listening again…"); answer=await ivListen(); }
    if(!state.iv.running) break;
    if(!answer){ ivSetStatus("Still nothing. Keep talking when ready, or press Finish to save."); continue; }
    ivAddLine("user",answer);
    state.iv.turn++;
    ivSetStatus("Thinking…");
    const res=await ivTurn(false);
    if(!res) break;
    done=res.done;
  }
  if(done && state.iv.running){ await ivFinish(false); }
}
let ivFinishing=false;
async function ivFinish(cancel){
  if(ivFinishing) return; ivFinishing=true;
  if(state.iv) state.iv.running=false;
  try{ if(state.iv&&state.iv.rec) state.iv.rec.stop(); }catch(e){}
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  if(cancel){ ivReset(); ivFinishing=false; return; }
  const tr=(state.iv&&state.iv.transcript)||[];
  if(tr.filter(m=>m.role==="user").length===0){ ivSetStatus("Nothing to save yet."); ivReset(); ivFinishing=false; return; }
  ivSetStatus("Saving what you taught me…");
  try{
    const { data, error }=await db.functions.invoke("interview-extract",{ body:{ languageName:(state.iv&&state.iv.langName)||"English", transcript:tr }});
    if(error || !data || !data.ok){ ivSetStatus((data&&(data.message||data.error))||(error&&error.message)||"Couldn't save the interview."); ivFinishing=false; return; }
    ivSetStatus("Saved "+data.count+" item"+(data.count===1?"":"s")+". "+aName()+" won't use these on calls until you review and approve them in the Set up by voice card above.");
    await loadDocuments(); refreshDocViews();
    setTimeout(ivReset, 7000);
  }catch(e){ ivSetStatus("Couldn't save the interview."); }
  ivFinishing=false;
}
function ivReset(){
  const p=$("#iv-panel"), s=$("#iv-setup"); if(p) p.style.display="none"; if(s) s.style.display="";
}
async function deleteDocument(id){
  const d=(state.documents||[]).find(x=>x.id===id);
  if(!(await uiConfirm("Delete "+(d?d.filename:"this document")+"? "+aName()+" will forget everything from it.",{okText:'Delete',cancelText:'Keep'}))) return;
  const { error }=await db.from('documents').delete().eq('id',id);
  if(!error){ state.documents=(state.documents||[]).filter(x=>x.id!==id); refreshDocViews(); }
}

async function connectCalendar(provider){
  const cfg=await calConfig(); const pc=cfg[provider]||{};
  if(!pc.configured||!pc.client_id){ uiAlert(CAL_PROVIDERS[provider].label+" isn't set up yet."); return; }
  const { data: accountId, error }=await db.rpc("donna_my_account_id");

  const params=new URLSearchParams(Object.assign({ client_id:pc.client_id, redirect_uri:p.callback, response_type:"code", scope:p.scope, state:accountId }, p.extra));
  window.location.href=p.authUrl+"?"+params.toString();
}

      sel.innerHTML=`<option value="${esc(st.calendar_id||"")}">${esc(st.calendar_id||"primary")}</option>`;

      if(msg) msg.textContent="Could not load your calendar list right now. "+aName()+" is using your current calendar.";
      return;
    }
    const acct=(data.account_email||"").toLowerCase();
    const cur = data.current || "";
    const hasCur = data.calendars.some(c=>c.id===cur);
    const optLabel=(c)=>{ let l=c.name||"Calendar"; if(c.primary) l+=" (default)"; if(c.owner && c.owner.toLowerCase()!==acct) l+=" — "+c.owner; return l; };
    sel.innerHTML = data.calendars.map(c=>`<option value="${esc(c.id)}" ${((cur&&c.id===cur)||(!cur&&c.primary))?"selected":""}>${esc(optLabel(c))}</option>`).join("");
    if(cur && !hasCur){ const o=document.createElement("option"); o.value=cur; o.textContent="Current selection"; o.selected=true; sel.insertBefore(o, sel.firstChild); }
    sel.disabled=false;
    if(msg){ msg.style.color="var(--muted)"; msg.textContent = data.account_email ? ((data.provider==="microsoft"?"Outlook":"Google")+" account: "+data.account_email) : ("Choose which calendar "+aName()+" reads and books on."); }
    sel.onchange=async()=>{
      const id=sel.value; if(!id) return;
      sel.disabled=true; if(msg){ msg.style.color="var(--muted)"; msg.textContent="Saving…"; }
      const { data:r, error:e2 } = await db.functions.invoke("donna-calendars", { body:{ action:"select", calendar_id:id } });
      sel.disabled=false;
      if(e2 || !r || !r.ok){ if(msg){ msg.style.color="var(--danger)"; msg.textContent="Could not save that calendar. Try again."; } return; }
      const name=(sel.options[sel.selectedIndex]||{}).textContent||"that calendar";
      if(msg){ msg.style.color="var(--ok)"; msg.textContent=aName()+" now reads and books on "+name+"."; }
    };
  }catch(_e){ if(msg) msg.textContent="Could not load your calendar list right now."; }
}
async function doSwitch(connectionId, calendar_id, ctl){
  const msg=$("#cal-move-msg");
  if(ctl) ctl.disabled=true;
  if(msg){ msg.style.color="var(--muted)"; msg.textContent="Switching and moving upcoming appointments…"; }
  const body={action:"switch", connection_id:connectionId}; if(calendar_id) body.calendar_id=calendar_id;
  const { data, error } = await db.functions.invoke("donna-calendars", { body });
  if(error || !data || !data.ok){ if(msg){ msg.style.color="var(--danger)"; msg.textContent="Could not switch. Please try again."; } if(ctl) ctl.disabled=false; return; }
  const s=data.summary||{moved:0,conflicts:[],failures:[],stranded:[]};
  let txt=`Switched. Moved ${s.moved||0} upcoming appointment${s.moved===1?"":"s"}.`;
  const conf=s.conflicts||[];
  if(conf.length){ txt+=` ${conf.length} overlap${conf.length===1?"s":""} something already on the new calendar and ${conf.length===1?"was":"were"} still moved for you to review: `+conf.map(c=>c.title+" ("+c.when+")").join("; ")+"."; }
  const fail=s.failures||[];
  if(fail.length){ txt+=` ${fail.length} could not be moved and stayed on the old calendar.`; }
  const strand=s.stranded||[];
  if(strand.length){ txt+=` ${strand.length} old cop${strand.length===1?"y":"ies"} could not be removed from the previous calendar, please delete ${strand.length===1?"it":"them"} there manually.`; }
  if(msg){ msg.style.color=(conf.length||strand.length||fail.length)?"var(--danger)":"var(--ok)"; msg.textContent=txt; }
  setTimeout(()=>paintCalendarCard(), 1600);
}
async function doRemove(connectionId, isActive, lbl){
  if(!(await uiConfirm("Remove "+lbl+" from "+aName()+"?"+(isActive?" It is the active calendar, so Donna will have no calendar until you make another one active.":"")+" The login is deleted here; events already on that calendar stay where they are.",{okText:'Remove',cancelText:'Keep'}))) return;
  const { data, error } = await db.functions.invoke("donna-calendars", { body:{ action:"remove", connection_id:connectionId } });
  if(error || !data || !data.ok){ uiAlert("Could not remove that account. Please try again."); return; }
  paintCalendarCard();
}

async function loadCalls(){

function fmtDur(s){ if(!s&&s!==0) return ''; const m=Math.floor(s/60), ss=s%60; return m?`${m}m ${ss}s`:`${ss}s`; }
function fmtDateTime(iso){ if(!iso) return ''; return new Intl.DateTimeFormat('en-US',{timeZone:state.account.timezone, weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}).format(new Date(iso)); }

function pageCalls(){
  $("#page").innerHTML=`
  <div class="page">
    <div class="page-head"><h1>Calls</h1><p>Every call ${esc(aName())} handles, with the full conversation. This page updates on its own: a call appears the moment it starts, and the transcript fills in when it wraps.</p></div>

      <div class="card-h"><h2>Recent calls</h2><span class="calls-live"><span class="d"></span>Live</span></div>

function paintCallsList(){

function callRowHTML(c){

  const who = c.from_number || 'Unknown caller';

function callTxHTML(c,live){

    <div class="transcript">${lines || `<div class="empty" style="padding:22px">${live?'Listening…':'No transcript was captured for this call.'}</div>`}</div>

async function openCall(id){

}
async function ensureRealtimeAuth(){
  try{ const { data:{ session } } = await db.auth.getSession(); if(session) db.realtime.setAuth(session.access_token); }catch(e){}
}
async function subscribeCalls(){
  if(state.callsChannel) return;
  await ensureRealtimeAuth();
  state.callsChannel = db.channel('rt-calls')
    .on('postgres_changes', { event:'*', schema:'public', table:'calls', filter:`account_id=eq.${state.account.id}` },
      async ()=>{ await loadCalls(); paintCallsList(); })
    .subscribe();
}
async function subscribeTranscript(callId){
  if(state.txChannel){ db.removeChannel(state.txChannel); state.txChannel=null; }
  await ensureRealtimeAuth();
  state.txChannel = db.channel('rt-tx-'+callId)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'transcript_messages', filter:`call_id=eq.${callId}` },
      payload=>{ state.callTranscript.push(payload.new); paintCallsList(); })
    .subscribe();
}
function teardownRealtime(){
  if(state.callsChannel){ db.removeChannel(state.callsChannel); state.callsChannel=null; }
  if(state.txChannel){ db.removeChannel(state.txChannel); state.txChannel=null; }
  state.openCallId=null; state.callTranscript=[];
}

const IMP_IDLE_MS = 5*60*1000;   // lock the tenant view after 5 min of no activity
let impIdleTimer=null, impLocked=false;
function impLock(reason){
  if(impLocked) return; impLocked=true;
  try{ db.auth.signOut({scope:'local'}); }catch(e){}
  try{ teardownRealtime(); }catch(e){}
  if('speechSynthesis' in window) try{ window.speechSynthesis.cancel(); }catch(e){}
  document.title="Session ended";
  const b=document.getElementById('imp-banner'); if(b) b.remove();
  document.getElementById("root").innerHTML=`<div class="imp-lock"><div class="imp-lock-card">
    <h2>Tenant view locked</h2>
    <p>${esc(reason||"This sandbox session ended.")}</p>
    <p class="imp-sub">Nothing was saved on this device. To view this tenant again, reopen it from the admin portal.</p>
    <button class="imp-close" onclick="window.close()">Close window</button>
  </div></div>`;
}
function impPoke(){
  if(impLocked) return;
  if(impIdleTimer) clearTimeout(impIdleTimer);
  impIdleTimer=setTimeout(()=>impLock("You were inactive for 5 minutes, so the tenant view locked itself."), IMP_IDLE_MS);
}
function impBanner(company){
  const css=document.createElement('style');
  css.textContent=`#imp-banner{position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#13243d;color:#fff;font:500 13px 'Inter',sans-serif;padding:9px 16px;display:flex;align-items:center;gap:10px;justify-content:center;box-shadow:0 -2px 14px rgba(0,0,0,.18)}#imp-banner b{color:#f0c790}#imp-banner button{margin-left:14px;background:#e0892e;color:#fff;border:none;border-radius:7px;padding:5px 12px;font:600 12px 'Inter';cursor:pointer}.dotpulse{width:8px;height:8px;border-radius:50%;background:#2f9e6f;animation:dp 1.6s infinite}@keyframes dp{0%{box-shadow:0 0 0 0 rgba(47,158,111,.6)}70%{box-shadow:0 0 0 7px rgba(47,158,111,0)}100%{box-shadow:0 0 0 0 rgba(47,158,111,0)}}.imp-lock{min-height:100vh;display:grid;place-items:center;background:var(--canvas,#eef1f7);padding:24px}.imp-lock-card{background:#fff;border:1px solid #dfe5f0;border-radius:13px;padding:30px;max-width:380px;text-align:center}.imp-lock-card h2{font-family:'Bricolage Grotesque','Inter',sans-serif;font-size:21px;margin-bottom:8px;color:#13243d}.imp-lock-card p{color:#5d6e8c;font-size:13.5px;margin-bottom:8px}.imp-lock-card .imp-sub{font-size:12px;color:#8b99b3}.imp-close{margin-top:16px;background:#e0892e;color:#fff;border:none;border-radius:9px;padding:9px 16px;font-weight:600;cursor:pointer}`;

  el.innerHTML=`<span class="dotpulse"></span> Viewing <b>${esc(company||'tenant')}</b> as admin · in-memory only, not saved on this device <button id="imp-exit">Close</button>`;

  document.getElementById('imp-exit').onclick=()=>window.close();

async function startImpSession(){
  let ok=await loadData();
  if(!ok){ await new Promise(r=>setTimeout(r,900)); ok=await loadData(); }
  if(!ok){ document.getElementById("root").innerHTML=`<div class="booting">Could not load this tenant.</div>`; return; }
  renderApp();
  impBanner(state.account && state.account.company);
  ['mousemove','mousedown','keydown','scroll','touchstart','click'].forEach(ev=>window.addEventListener(ev, impPoke, {passive:true}));
  impPoke();
}
async function bootImpersonation(){
  document.getElementById("root").innerHTML=`<div class="booting">Opening tenant view…</div>`;
  try{ history.replaceState(null,"",location.pathname+"?imp=1"); }catch(e){}
  let gotSession=false;
  // If the tenant session is ever lost (e.g. refresh fails), lock the view so
  // writes can never silently go out unauthenticated and look like they saved.
  db.auth.onAuthStateChange((event)=>{ if(event==='SIGNED_OUT' && gotSession && !impLocked){ impLock("Your tenant session ended. Reopen it from the admin portal."); } });
  // On a reload within the same tab, the session is already in sessionStorage.
  try{ const { data:{ session } } = await db.auth.getSession(); if(session){ gotSession=true; await startImpSession(); return; } }catch(e){}
  window.addEventListener('message', async (e)=>{
    if(e.origin!==location.origin) return;
    const d=e.data||{};
    if(d.type==='donna-imp-session' && d.access_token && d.refresh_token && !gotSession){
      gotSession=true;
      const { error } = await db.auth.setSession({ access_token:d.access_token, refresh_token:d.refresh_token });
      if(error){ document.getElementById("root").innerHTML=`<div class="booting">Could not open this tenant view.</div>`; return; }
      await startImpSession();
    }
  });
  if(window.opener){ try{ window.opener.postMessage({type:'donna-imp-ready'}, location.origin); }catch(e){} }
  else { document.getElementById("root").innerHTML=`<div class="booting">Please open this view from the admin portal.</div>`; return; }
  setTimeout(()=>{ if(!gotSession && !impLocked){ document.getElementById("root").innerHTML=`<div class="booting">No tenant session received. Reopen from the admin portal.</div>`; } }, 15000);
}

      if(error){ $("#wz-m").style.color='var(--danger)'; $("#wz-m").textContent='Could not save. Please try again.'; return false; }
      if(state.assistant) state.assistant.routing=routing;
      return true;
    },{});
  },
  7:function(){
    const g=state.wz;
    document.getElementById("root").innerHTML=wzShell(`
      <h1>Notifications</h1>
      <p class="lede">Where should ${esc(DEFAULT_NAME)} send messages, missed calls, and bookings so you don't miss anything?</p>
      <div class="wz-field"><label>Your email</label><input class="wz-inp" id="wz-alert" value="${esc(g.alert)}" placeholder="you@yourbusiness.com"></div>
      <div class="wz-msg" id="wz-m"></div>
    `,{});
    wzBindNav(async()=>{
      const email=$("#wz-alert").value.trim();
      if(!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ $("#wz-m").style.color='var(--danger)'; $("#wz-m").textContent='Please enter a valid email so you get your messages.'; return false; }
      state.wz.alert=email;
      const settings=Object.assign({}, state.account.settings||{}, {alert_email:email});
      const { error }=await db.from('accounts').update({settings}).eq('id',state.account.id);
      if(error){ $("#wz-m").style.color='var(--danger)'; $("#wz-m").textContent='Could not save. Please try again.'; return false; }
      state.account.settings=settings;
      return true;
    },{});
  },
  8:function(){
    const g=state.wz;
    const missing=[];
    if(!state.account.company) missing.push('business name');
    if(!state.assistantId) missing.push('assistant');
    if(!(state.account.settings&&state.account.settings.alert_email)) missing.push('notification email');
    document.getElementById("root").innerHTML=wzShell(`
      <h1>Ready to go live</h1>
      <p class="lede">Here's what ${esc(DEFAULT_NAME)} knows. When you go live she starts answering, and we create your dedicated email address so customers can reach her by email too.</p>
      <div style="font-size:14px;line-height:1.9;margin-bottom:6px">
        <div><b>Business:</b> ${esc(state.account.company||'not set')}</div>
        <div><b>Assistant:</b> ${esc(g.aname)} (${esc((VOICES.find(v=>v[0]===g.voice)||['','voice'])[1])})</div>
        <div><b>Open days:</b> ${esc(DAYS.filter((d,i)=>state.wz.days[i]).map(d=>d.slice(0,3)).join(', ')||'set later')} ${state.wz.days.some(Boolean)?(esc(g.hstart)+' to '+esc(g.hend)):''}</div>
        <div><b>Transfer:</b> ${g.xfer_on&&g.xfer_num?esc(g.xfer_num):'takes a message'}</div>
        <div><b>Notifications:</b> ${esc((state.account.settings&&state.account.settings.alert_email)||'not set')}</div>
        <div><b>Appointments:</b> ${(state.types&&state.types.length)?esc(state.types.map(t=>t.name).join(', ')):'none yet'}</div>
      </div>
      ${missing.length?`<div class="wz-msg" style="color:var(--danger)">Before going live, please add: ${esc(missing.join(', '))}.</div>`:`<div class="wz-msg" id="wz-m"></div>`}
    `,{nextLabel: missing.length?'Fix above':'Go live'});
    wzBindNav(async()=>{
      if(missing.length){ // jump back to the earliest missing step
        state.wizStep = !state.account.company?1:(!state.assistantId?2:7); await wzPersist({}); renderWizard(); return false;
      }
      const m=$("#wz-m"); if(m){ m.style.color='var(--muted)'; m.textContent='Creating your email address and going live…'; }
      // Mark onboarding complete FIRST so the server-side calls below merge onto fresh settings (no clobber).
      await wzPersist({ completed:true, completed_at:new Date().toISOString(), tutorial_done:false });
      let address='';
      try{ const { data }=await db.functions.invoke("provision-email",{ body:{} }); if(data&&data.ok&&data.address){ address=data.address; } }catch(e){ /* non-fatal, can retry from settings */ }
      // Apply the industry preset (persona defaults, appointment types, starter FAQ drafts). Idempotent, no-op if no preset.
      try{ await db.functions.invoke("apply-preset",{ body:{ industry: state.wz.industry||state.account.industry||'' } }); }catch(e){ /* non-fatal */ }
      // Reload everything so the app reflects the new email, the preset persona, and the
      // appointment types the preset just created (otherwise they stay empty until a reload).
      try{ await loadData(); }catch(e){
        try{ const { data:acct }=await db.from('accounts').select('settings').eq('id',state.account.id).maybeSingle(); if(acct&&acct.settings) state.account.settings=acct.settings; }catch(_e){}
      }
      // Online booking is on from day one when there is something to book. The owner can switch it off under Booking page.
      try{
        const bk=(state.account.settings&&state.account.settings.booking)||{};
        if(bk.enabled===undefined && state.types && state.types.length){
          const settings=Object.assign({}, state.account.settings||{}, { booking:Object.assign({}, bk, { enabled:true }) });
          const { error:eb }=await db.from('accounts').update({settings}).eq('id',state.account.id);
          if(!eb) state.account.settings=settings;
        }
      }catch(_e){}
      state.wizStep=0; state.wz=null;
      renderApp();
      wzStartTutorial(address);
      return false; // we already moved to the app; do NOT let wzBindNav advance/re-render the wizard
    },{});
  }
};
function wzStartTutorial(address){
  const stops=[
    {t:"You're live.", b:(address?("Customers can now call your number and email "+address+". ") : "Customers can now reach "+aName()+". ")+aName()+" answers and handles the routine, and brings you in when it matters."},
    {t:"Inbox", b:"Email conversations show up under Inbox. "+aName()+" drafts replies and holds them for your approval, so nothing goes out without you."},
    {t:"Knowledge", b:"Everything "+aName()+" says comes from Knowledge. Review what we imported from your website, add documents, or type answers. Approve an item before she uses it."},
    {t:"Messages and Calls", b:"Missed calls, messages, and booking requests land here and get emailed to you, so you can follow up fast."},
    {t:"Your booking link", b:"Under Booking page you'll find a link and a QR code people can use to book themselves, any time. Put it on your Google listing, Instagram, and website, and "+aName()+" can text it to callers too."},
    {t:"Try her now", b:"Call your own number and say hello. That's the fastest way to hear how "+aName()+" sounds to your customers."}
  ];
  let i=0;
  const host=document.createElement('div'); host.id='wz-tour'; document.body.appendChild(host);
  const paint=()=>{
    const s=stops[i];
    host.innerHTML=`
    <style>
      #wz-tour{position:fixed;inset:0;background:rgba(17,24,20,.55);display:flex;align-items:center;justify-content:center;z-index:9999}
      .tour-card{background:#fff;color:#111;max-width:420px;width:calc(100% - 40px);border-radius:16px;padding:24px}
      .tour-step{font-size:12px;color:#789;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
      .tour-card h3{font-size:19px;margin:6px 0 8px} .tour-card p{line-height:1.55;color:#445;margin:0 0 18px}
      .tour-foot{display:flex;align-items:center;gap:8px} .tour-dots{display:flex;gap:5px;margin-right:auto}
      .tour-d{width:7px;height:7px;border-radius:50%;background:#dfe5e2} .tour-d.on{background:#2f6f4f}
      .tour-card .btn{border:0;border-radius:9px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
      .btn-skip{background:transparent;color:#789} .btn-go{background:#2f6f4f;color:#fff}
    </style>
    <div class="tour-card">
      <div class="tour-step">Getting started</div>
      <h3>${esc(s.t)}</h3><p>${esc(s.b)}</p>
      <div class="tour-foot"><div class="tour-dots">${stops.map((_,j)=>`<span class="tour-d ${j===i?'on':''}"></span>`).join("")}</div>
        <button class="btn btn-skip" id="tour-skip">${i===stops.length-1?'Close':'Skip'}</button>
        <button class="btn btn-go" id="tour-next">${i===stops.length-1?'Done':'Next'}</button></div>
    </div>`;
    const close=async()=>{ host.remove(); try{ await wzMarkTutorialDone(); }catch(_e){} };
    $("#tour-skip").onclick=close;
    $("#tour-next").onclick=()=>{ if(i>=stops.length-1){ close(); } else { i++; paint(); } };
  };
  paint();
}
async function wzMarkTutorialDone(){
  const cur=(state.account.settings&&state.account.settings.onboarding)||{};
  const onboarding=Object.assign({}, cur, {tutorial_done:true});
  const settings=Object.assign({}, state.account.settings||{}, {onboarding});
  await db.from('accounts').update({settings}).eq('id',state.account.id);
  state.account.settings=settings;
}

async function boot(){
  if(IMP){ return bootImpersonation(); }
  if(pendingRecovery){ state.authMode="reset"; renderAuth(); return; }
  document.getElementById("root").innerHTML=`<div class="booting">Loading…</div>`;
  const { data:{ session } } = await db.auth.getSession();
  if(!session){ renderAuth(); return; }
  let ok = await loadData();
  if(!ok){ await new Promise(r=>setTimeout(r,1200)); ok = await loadData(); } // give the signup trigger a moment
  if(ok){ if(needsOnboarding()){ renderWizard(); } else { renderApp(); } } else { renderAuth(); }
}
db.auth.onAuthStateChange((event)=>{ if(event==='PASSWORD_RECOVERY'){ pendingRecovery=true; state.authMode='reset'; renderAuth(); } });
if('speechSynthesis' in window){ window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged=()=>{}; }
boot();
</script>
</body>
