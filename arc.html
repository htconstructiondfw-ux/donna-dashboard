<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Attach drawings & photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#182230; --ink2:#48566a; --muted:#8a97a8; --line:#e3e8ef; --line2:#eef2f6;
    --bg:#eef2f6; --card:#ffffff; --accent:#1f5fa8; --accent-deep:#164a85; --accent-soft:#e8f0fa;
    --ok:#1f7a4d; --danger:#c0392b; --shadow:0 12px 40px -16px rgba(20,45,80,.28);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Figtree',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:30px 18px 48px}
  .brand{display:flex;align-items:center;gap:13px;margin:6px 2px 20px}
  .brand .dot{width:50px;height:50px;border-radius:13px;background:linear-gradient(140deg,var(--accent),var(--accent-deep));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:22px;font-family:'Fraunces',Georgia,serif;box-shadow:0 7px 20px -8px rgba(22,74,133,.6)}
  .brand b{font-family:'Fraunces',Georgia,serif;font-size:25px;font-weight:600;letter-spacing:-.01em;line-height:1.08;display:block}
  .brand small{display:block;color:var(--muted);font-size:13px;font-weight:500;margin-top:3px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);margin-bottom:14px}
  .intro{font-size:14px;color:var(--ink2);margin:0 0 4px;line-height:1.55}
  h2.title{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:20px;margin:14px 0 6px}
  .ctx{font-size:13px;color:var(--muted);margin:0 0 18px}
  .q{margin-bottom:17px}
  label.f{display:block;font-size:13.5px;font-weight:600;color:var(--ink);margin:0 0 7px}
  label.f .req{color:var(--accent-deep);margin-left:3px}
  .help{font-size:12px;color:var(--muted);margin:-3px 0 8px}
  input.inp,select.inp{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px 13px;font:inherit;background:#fff;transition:.14s}
  input.inp:focus,select.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .row{display:flex;gap:12px}
  .row .q{flex:1}
  .yn{display:flex;gap:10px}
  .optbtn{flex:1;border:1px solid var(--line);border-radius:11px;padding:11px 14px;font:inherit;background:#fff;cursor:pointer;text-align:center;transition:.14s;color:var(--ink)}
  .optbtn:hover{border-color:var(--accent)}
  .optbtn.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px rgba(31,95,168,.12);font-weight:600;color:var(--accent-deep)}
  .file{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:13.5px;cursor:pointer;transition:.14s;background:#fbfcfe}
  .file:hover{border-color:var(--accent);color:var(--accent-deep)}
  .file.has{border-style:solid;border-color:var(--ok);color:var(--ok);background:#f0f9f4;font-weight:600}
  .btn{width:100%;border:none;border-radius:12px;padding:15px;font:inherit;font-weight:600;font-size:15.5px;background:var(--accent);color:#fff;cursor:pointer;transition:.14s;box-shadow:0 8px 20px -8px rgba(22,74,133,.55);margin-top:4px}
  .btn:hover{background:var(--accent-deep)}
  .btn:disabled{opacity:.5;cursor:default;box-shadow:none}
  .msg{font-size:13.5px;margin-top:12px}
  .msg.err{color:var(--danger)}
  .center{text-align:center;padding:22px 8px}
  .center .big{width:68px;height:68px;margin:0 auto 18px;border-radius:50%;background:linear-gradient(140deg,var(--accent),var(--accent-deep));color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px}
  .center h3{margin:0 0 8px;font-size:23px;font-family:'Fraunces',Georgia,serif;font-weight:500}
  .center p{color:var(--muted);margin:0;line-height:1.6}
  .foot{text-align:center;color:#9fb0c4;font-size:11.5px;margin-top:22px}
  .foot a{color:#7e90a6}
  .spin{color:var(--muted);font-size:13.5px;text-align:center;padding:20px}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot" id="b-dot">·</span><div><b id="b-name">Architectural request</b><small id="b-sub">Loading…</small></div></div>
  <div id="app"><div class="card"><div class="spin">Loading…</div></div></div>
  <div class="foot">Powered by <a href="https://sidekicklogistics.com" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;font-weight:600">Sidekick Logistics</a></div>
</div>
<script>
const API="https://hingbdtmxozbjetzwibj.supabase.co/functions/v1/pm-coordinate";
const qs=new URLSearchParams(location.search);
const TOKEN=qs.get('t')||(location.pathname.split('/arc/')[1]||'').replace(/\/+$/,'');
const S={data:null,files:[]};
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(action,extra){ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({action,token:TOKEN},extra||{}))}); return r.json().catch(()=>({error:'network'})); }
function card(inner){ app.innerHTML=`<div class="card">${inner}</div>`; }
async function boot(){
  if(!TOKEN){ card('<div class="center"><h3>Link looks incomplete</h3><p>Please use the full link from your message.</p></div>'); return; }
  const d=await api('arc_load');
  if(!d || !d.ok){ card('<div class="center"><h3>Not found</h3><p>This link is no longer valid. Please contact the community office.</p></div>'); return; }
  S.data=d;
  $("#b-name").textContent=d.business||'Architectural request';
  $("#b-dot").textContent=(d.business||'A').trim().charAt(0).toUpperCase();
  $("#b-sub").textContent=d.property||'Architectural request';
  document.title='Attach drawings · '+(d.business||'');
  render();
}
function render(){
  const d=S.data;
  let html=`<p class="intro">Thanks for your request${d.property?` at <b>${esc(d.property)}</b>`:''}. The committee reviews faster with a sketch or site plan showing the location, product or color samples, and a photo or two of the area.</p>`;
  html+=`<h2 class="title">${esc(d.title||'Your request')}</h2><p class="ctx">${esc(d.address||'')}${d.count?` · ${d.count} file${d.count===1?'':'s'} already attached`:''}</p>`;
  if(d.description) html+=`<div class="q" style="font-size:13.5px;color:var(--ink2);white-space:pre-wrap;background:#f7f9fc;border-radius:11px;padding:12px">${esc(d.description)}</div>`;
  html+=`<div class="q"><label class="f">Drawings, plans, samples, photos <span class="help" style="display:inline;margin:0">(up to 8, PDF or images)</span></label><label class="file" id="filelabel" for="fileinput">Tap to choose files</label><input id="fileinput" type="file" accept=".pdf,image/*" multiple style="display:none"></div>`;
  html+=`<div id="flist" style="font-size:13px;color:var(--ink2)"></div>`;
  html+=`<button class="btn" id="go">Send to the committee</button><div class="msg" id="msg"></div>`;
  card(html);
  const fi=$("#fileinput"), fl=$("#filelabel");
  fi.onchange=()=>{ S.files=Array.from(fi.files||[]).slice(0,8).filter(f=>f.size<=12*1024*1024); fl.textContent=S.files.length?`${S.files.length} file${S.files.length===1?'':'s'} selected`:'Tap to choose files'; fl.classList.toggle('has',!!S.files.length); $("#flist").innerHTML=S.files.map(f=>`• ${esc(f.name)}`).join('<br>'); };
  $("#go").onclick=submit;
}
function readFileB64(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=()=>rej(); r.onload=()=>{ const s=String(r.result||''); const i=s.indexOf(','); res(i>=0?s.slice(i+1):s); }; r.readAsDataURL(f); }); }
async function submit(){
  const btn=$("#go"), msg=$("#msg");
  if(!S.files.length){ msg.className='msg err'; msg.textContent='Choose at least one file first.'; return; }
  btn.disabled=true; const o=btn.textContent; btn.textContent='Uploading…'; msg.textContent='';
  const files=[]; for(const f of S.files){ try{ files.push({ name:f.name, type:f.type, b64:await readFileB64(f) }); }catch(_e){} }
  const r=await api('arc_upload',{ files });
  btn.disabled=false; btn.textContent=o;
  if(r&&r.ok){ card(`<div class="center"><div class="big">&#10003;</div><h3>Received — thank you</h3><p>${r.count} file${r.count===1?' is':'s are'} attached to your request. The committee will review it and the office will let you know the decision in writing. Please don't start work until you have written approval.</p></div>`); return; }
  msg.className='msg err'; msg.textContent=(r&&r.message)||(r&&r.error)||'Could not upload. Please try again.';
}
boot();
</script>
</body>
</html>
