<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Before your visit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b2228; --ink2:#5c5057; --muted:#978a90; --line:#ece3db; --line2:#f4ede6;
    --bg:#f4efe9; --card:#fffdfb; --accent:#a05c6b; --accent-deep:#834655; --accent-soft:#f6e9ec;
    --ok:#4e7a5a; --danger:#b4443a; --shadow:0 12px 42px -14px rgba(74,45,55,.20);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Figtree',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:540px;margin:0 auto;padding:30px 18px 48px}
  .brand{display:flex;align-items:center;gap:13px;margin:6px 2px 20px}
  .brand .dot{width:50px;height:50px;border-radius:15px;background:linear-gradient(140deg,var(--accent),var(--accent-deep));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:23px;font-family:'Fraunces',Georgia,serif;box-shadow:0 7px 20px -7px rgba(131,69,86,.55)}
  .brand b{font-family:'Fraunces',Georgia,serif;font-size:27px;font-weight:600;letter-spacing:-.015em;line-height:1.08;display:block}
  .brand small{display:block;color:var(--muted);font-size:13px;font-weight:500;margin-top:4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);margin-bottom:14px}
  .intro{font-size:13.5px;color:var(--ink2);margin:0 0 4px;line-height:1.5}
  h2.title{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:20px;margin:14px 0 18px}
  .q{margin-bottom:20px}
  .q:last-of-type{margin-bottom:8px}
  label.f{display:block;font-size:14px;font-weight:600;color:var(--ink);margin:0 0 8px}
  label.f .req{color:var(--accent-deep);margin-left:3px}
  .help{font-size:12px;color:var(--muted);margin:-4px 0 8px}
  input.inp,textarea.inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font:inherit;background:#fffefc;transition:.14s}
  textarea.inp{min-height:92px;resize:vertical}
  input.inp:focus,textarea.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:#fff}
  .opts{display:flex;flex-direction:column;gap:9px}
  .optbtn{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;background:#fff;cursor:pointer;text-align:left;transition:.14s;color:var(--ink)}
  .optbtn:hover{border-color:var(--accent);color:var(--accent-deep)}
  .optbtn.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px rgba(160,92,107,.12);font-weight:600;color:var(--accent-deep)}
  .yn{display:flex;gap:10px}
  .yn .optbtn{flex:1;text-align:center}
  .btn{width:100%;border:none;border-radius:13px;padding:15px;font:inherit;font-weight:600;font-size:15.5px;background:var(--accent);color:#fff;cursor:pointer;transition:.14s;box-shadow:0 8px 20px -8px rgba(131,69,86,.55)}
  .btn:hover{background:var(--accent-deep)}
  .btn:disabled{opacity:.5;cursor:default;box-shadow:none}
  .msg{font-size:13.5px;margin-top:12px}
  .msg.err{color:var(--danger)}
  .center{text-align:center;padding:22px 8px}
  .center .big{width:68px;height:68px;margin:0 auto 18px;border-radius:50%;background:linear-gradient(140deg,var(--accent),var(--accent-deep));color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 10px 28px -8px rgba(131,69,86,.6)}
  .center h3{margin:0 0 8px;font-size:23px;font-family:'Fraunces',Georgia,serif;font-weight:500}
  .center p{color:var(--muted);margin:0;line-height:1.6}
  .foot{text-align:center;color:#b3a7ad;font-size:11.5px;margin-top:22px}
  .foot a{color:#8a7d83}
  .spin{color:var(--muted);font-size:13.5px;text-align:center;padding:20px}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot" id="b-dot">·</span><div><b id="b-name">Intake</b><small id="b-sub">Loading…</small></div></div>
  <div id="app"><div class="card"><div class="spin">Loading…</div></div></div>
  <div class="foot">Powered by <a href="https://sidekicklogistics.com" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;font-weight:600">Sidekick Logistics</a></div>
</div>
<script>
const API="https://hingbdtmxozbjetzwibj.supabase.co/functions/v1/intake-public";
const qs=new URLSearchParams(location.search);
const TOKEN=qs.get('t')||(location.pathname.split('/intake/')[1]||'').replace(/\/+$/,'');
const S={data:null,answers:{}};
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(action,extra){ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({action,token:TOKEN},extra||{}))}); return r.json().catch(()=>({error:'network'})); }
function card(inner){ app.innerHTML=`<div class="card">${inner}</div>`; }

async function boot(){
  if(!TOKEN){ card('<div class="center"><h3>Link looks incomplete</h3><p>Please use the link from your appointment message.</p></div>'); return; }
  const d=await api('load');
  if(!d || d.error){ card('<div class="center"><h3>Not found</h3><p>This form link is no longer valid.</p></div>'); return; }
  S.data=d;
  $("#b-name").textContent=d.business||'Before your visit';
  $("#b-dot").textContent=(d.business||'B').trim().charAt(0).toUpperCase();
  $("#b-sub").textContent='Before your visit';
  document.title=(d.title||'Before your visit')+' · '+(d.business||'');
  if(d.submitted){ done(true); return; }
  render();
}

function render(){
  const d=S.data, qsn=d.questions||[];
  const hi = d.first_name ? `Hi ${esc(d.first_name)} — ` : '';
  let html=`<p class="intro">${hi}${esc(d.business||'We')} asked a few quick questions to get ready for your visit. Takes under a minute.</p>`;
  html+=`<h2 class="title">${esc(d.title||'A few quick questions')}</h2>`;
  qsn.forEach((q,i)=>{ html+=renderQ(q,i); });
  html+=`<button class="btn" id="go">Submit</button><div class="msg" id="msg"></div>`;
  app.innerHTML=`<div class="card">${html}</div>`;
  bind(qsn);
  $("#go").onclick=submit;
}

function renderQ(q,i){
  const id='q_'+i;
  const req=q.required?'<span class="req">*</span>':'';
  const help=q.help?`<div class="help">${esc(q.help)}</div>`:'';
  let field='';
  if(q.type==='long'){ field=`<textarea class="inp" data-q="${esc(q.id)}" id="${id}"></textarea>`; }
  else if(q.type==='yesno'){ field=`<div class="yn" data-qwrap="${esc(q.id)}">
      <button type="button" class="optbtn" data-q="${esc(q.id)}" data-val="Yes">Yes</button>
      <button type="button" class="optbtn" data-q="${esc(q.id)}" data-val="No">No</button></div>`; }
  else if(q.type==='choice'){ const opts=Array.isArray(q.options)?q.options:[];
    field=`<div class="opts" data-qwrap="${esc(q.id)}">`+opts.map(o=>`<button type="button" class="optbtn" data-q="${esc(q.id)}" data-val="${esc(o)}">${esc(o)}</button>`).join('')+`</div>`; }
  else { field=`<input class="inp" data-q="${esc(q.id)}" id="${id}" autocomplete="off">`; }
  return `<div class="q"><label class="f">${esc(q.label||'Question')}${req}</label>${help}${field}</div>`;
}

function bind(qsn){
  document.querySelectorAll('input.inp[data-q],textarea.inp[data-q]').forEach(el=>{
    el.oninput=()=>{ S.answers[el.dataset.q]=el.value; };
  });
  document.querySelectorAll('.optbtn[data-q]').forEach(el=>{
    el.onclick=()=>{
      const qid=el.dataset.q;
      document.querySelectorAll(`.optbtn[data-q="${CSS.escape(qid)}"]`).forEach(b=>b.classList.remove('sel'));
      el.classList.add('sel');
      S.answers[qid]=el.dataset.val;
    };
  });
}

async function submit(){
  const btn=$("#go"), msg=$("#msg");
  const qsn=S.data.questions||[];
  for(const q of qsn){
    if(q.required){ const v=S.answers[q.id]; if(v===undefined||v===null||(typeof v==='string'&&!v.trim())){ msg.className='msg err'; msg.textContent='Please answer: '+(q.label||'required question'); return; } }
  }
  btn.disabled=true; const o=btn.textContent; btn.textContent='Submitting…'; msg.textContent='';
  const r=await api('submit',{answers:S.answers});
  btn.disabled=false; btn.textContent=o;
  if(r&&r.ok){ done(false); return; }
  msg.className='msg err'; msg.textContent=(r&&r.error)||'Could not submit. Please try again.';
}

function done(already){
  card(`<div class="center"><div class="big">&#10003;</div><h3>${already?'Already done':'All set'}</h3>
    <p>${already?'You already filled this out — nothing more to do.':'Thanks! Your answers are saved. See you at your appointment.'}</p></div>`);
}

boot();
</script>
</body>
</html>
