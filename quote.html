<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estimate</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--accent:#1f6f4a;--accent-deep:#164f35;--bg:#f4f6f3;--card:#fff;--ink:#1b2420;--ink2:#4c5a52;--muted:#7d8a82;--line:#e3e8e4;--ok:#2d7a4f;--danger:#b4443a;--radius:18px}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Figtree',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:520px;margin:0 auto;padding:22px 16px 60px}
  .biz{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .logo{width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none}
  .biz h1{font-size:18px;margin:0;font-weight:700} .biz p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 10px 30px -22px rgba(0,0,0,.25)}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
  .num{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600} .to{font-weight:600;margin-top:2px} .addr{color:var(--ink2);font-size:14px}
  .badge{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#eef3ef;color:var(--ink2);white-space:nowrap}
  .badge.paid{background:#e4f3ea;color:var(--ok)} .badge.void{background:#f6e7e5;color:var(--danger)}
  table{width:100%;border-collapse:collapse;margin-top:6px} td{padding:10px 0;border-top:1px solid var(--line);vertical-align:top;font-size:15px} td.amt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  td .k{display:block;font-size:12px;color:var(--muted)} tr.total td{border-top:2px solid var(--ink);font-weight:700;font-size:18px;padding-top:12px}
  .notes{margin-top:14px;color:var(--ink2);font-size:14px;white-space:pre-wrap}
  .pay{display:block;width:100%;margin-top:18px;padding:17px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;font-size:18px;cursor:pointer}
  .pay:disabled{opacity:.6;cursor:default} .pay:hover:not(:disabled){background:var(--accent-deep)}
  .alt{margin-top:14px;text-align:center;color:var(--muted);font-size:13.5px}
  .done{margin-top:16px;padding:14px;border-radius:14px;background:#e4f3ea;color:var(--ok);font-weight:600;text-align:center}
  .err{margin-top:16px;padding:14px;border-radius:14px;background:#f6e7e5;color:var(--danger);text-align:center}
  .foot{margin-top:26px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6}
  .foot a{color:inherit}
  .pay.alt2{background:#fff;color:var(--ink);border:2px solid var(--line);margin-top:10px;font-size:16px;padding:14px}
  .q{margin-top:12px} .q textarea{width:100%;min-height:80px;border:2px solid var(--line);border-radius:12px;padding:10px;font:inherit}
  .exp{font-size:12.5px;color:var(--muted);margin-top:8px;text-align:center}
  .skel{height:14px;border-radius:7px;background:linear-gradient(90deg,#eceeec,#f6f7f6,#eceeec);background-size:200% 100%;animation:sh 1.2s infinite;margin:10px 0}
  @keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="card"><div class="skel" style="width:40%"></div><div class="skel"></div><div class="skel"></div><div class="skel" style="width:60%"></div></div>
</div>
<script>
const SB = "https://hingbdtmxozbjetzwibj.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhpbmdiZHRteG96YmpldHp3aWJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NDMzMzUsImV4cCI6MjA5NzExOTMzNX0.7WoJYMeIl2sclHQRSjl_AoLgYgLbQXBSn-hHV2rwlgI";
const q = new URLSearchParams(location.search);
const token = q.get("t") || (location.pathname.match(/\/quote\/([a-z0-9]+)/i) || [])[1] || "";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = c => "$" + (Math.round(c||0)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const app = document.getElementById("app");
const fmtDate = iso => new Date(iso).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});

async function load(){
  if(!token){ app.innerHTML = '<div class="card err">This estimate link isn\'t complete. Please use the link from your text or email.</div>'; return; }
  let est=null;
  try{ const r = await fetch(`${SB}/rest/v1/rpc/estimate_public`,{method:"POST",headers:{"Content-Type":"application/json",apikey:ANON,Authorization:"Bearer "+ANON},body:JSON.stringify({p_token:token})}); est = await r.json(); }catch(e){}
  if(!est || !est.id){ app.innerHTML = '<div class="card err">We couldn\'t find this estimate. Please check with the business.</div>'; return; }
  render(est);
}
function render(est){
  const b = est.business || {};
  const initials = (b.name||"?").split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  const lines = est.lines||[]; const main = lines.filter(l=>l.kind!=="optional"), opt = lines.filter(l=>l.kind==="optional");
  const expired = est.status==="expired" || (est.expires_at && new Date(est.expires_at) < new Date() && est.status==="sent");
  const open = ["sent","draft","review"].includes(est.status) && !expired;
  const label = est.status==="approved"||est.status==="converted" ? "Approved" : est.status==="declined" ? "Declined" : expired ? "Expired" : est.status==="void" ? "Withdrawn" : "For your approval";
  document.title = `Estimate ${est.number} · ${b.name||""}`;
  app.innerHTML = `
    <div class="biz"><div class="logo">${esc(initials)}</div><div><h1>${esc(b.name||"Estimate")}</h1><p>${[b.phone,b.email].filter(Boolean).map(esc).join(" · ")}</p></div></div>
    <div class="card">
      <div class="top">
        <div><div class="num">Estimate ${esc(est.number)}</div>${est.customer_name?`<div class="to">${esc(est.customer_name)}</div>`:""}${est.service_address?`<div class="addr">${esc(est.service_address)}</div>`:""}</div>
        <span class="badge ${label==="Approved"?"paid":(label==="Declined"||label==="Expired"||label==="Withdrawn")?"void":""}">${label}</span>
      </div>
      <table>
        ${main.map(l=>`<tr><td>${esc(l.desc)}${l.qty>1?`<span class="k">${l.qty} × ${money(l.unit_cents)}</span>`:""}${l.kind==="material"?`<span class="k">Materials</span>`:l.kind==="labor"?`<span class="k">Labor</span>`:""}</td><td class="amt">${l.cents===0?"No charge":money(l.cents)}</td></tr>`).join("")}
        <tr class="total"><td>Total</td><td class="amt">${money(est.total_cents)}</td></tr>
        ${opt.length?`<tr><td colspan="2" style="border-top:0;padding-top:16px"><span class="k" style="font-size:13px">Optional, only if needed (not included in the total):</span></td></tr>`+opt.map(l=>`<tr><td style="color:var(--ink2)">${esc(l.desc)}</td><td class="amt" style="color:var(--ink2)">${money(l.cents)}</td></tr>`).join(""):""}
      </table>
      ${est.notes?`<div class="notes">${esc(est.notes)}</div>`:""}
      ${est.status==="approved"||est.status==="converted" ? `<div class="done">Approved on ${fmtDate(est.approved_at)}. Thank you! ${esc(b.name||"We")} will be in touch to schedule.</div>`
        : est.status==="declined" ? `<div class="err">Declined on ${fmtDate(est.declined_at)}. Changed your mind? Call ${esc(b.name||"us")}${b.phone?` at ${esc(b.phone)}`:""}.</div>`
        : expired ? `<div class="err">This estimate has expired. Call ${esc(b.name||"us")}${b.phone?` at ${esc(b.phone)}`:""} for an updated one.</div>`
        : est.status==="void" ? `<div class="err">This estimate was withdrawn by ${esc(b.name||"the business")}.</div>`
        : `<button class="pay" id="okBtn">Approve ${money(est.total_cents)}</button><button class="pay alt2" id="noBtn">I have questions / not now</button><div id="qbox" class="q" style="display:none"><textarea id="qtxt" placeholder="Tell us what's on your mind (optional)"></textarea><button class="pay alt2" id="sendNo">Send</button></div><div class="exp">${est.expires_at?`Good through ${fmtDate(est.expires_at)}. `:""}Approving means you'd like ${esc(b.name||"us")} to do this work at this price. Nothing is charged now.</div><div id="err"></div>`}
    </div>
    <div class="foot">Sent by ${esc(b.name||"the business")} with Donna.</div>`;
  const ok = document.getElementById("okBtn"), no = document.getElementById("noBtn"), sendNo = document.getElementById("sendNo");
  const post = async (body) => { const r = await fetch(`${SB}/functions/v1/estimates`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); return r.json(); };
  if(ok) ok.onclick = async () => { ok.disabled=true; ok.textContent="Sending your approval…"; try{ const j = await post({action:"approve",token,via:"link"}); if(j.ok){ load(); return; } document.getElementById("err").innerHTML = `<div class="err">${j.error==="expired"?"This estimate has expired.":"Couldn't record that. Please call the business."}</div>`; }catch(e){ document.getElementById("err").innerHTML='<div class="err">Couldn\'t record that. Please try again.</div>'; } ok.disabled=false; ok.textContent=`Approve ${money(est.total_cents)}`; };
  if(no) no.onclick = () => { document.getElementById("qbox").style.display="block"; no.style.display="none"; };
  if(sendNo) sendNo.onclick = async () => { sendNo.disabled=true; try{ const j = await post({action:"decline",token,reason:document.getElementById("qtxt").value.trim()}); if(j.ok){ load(); return; } }catch(e){} sendNo.disabled=false; };
}
load();
</script>
</body>
</html>
