<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Invoice</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--accent:#1f6f4a;--accent-deep:#164f35;--bg:#f4f6f3;--card:#fff;--ink:#1b2420;--ink2:#4c5a52;--muted:#7d8a82;--line:#e3e8e4;--ok:#2d7a4f;--danger:#b4443a;--radius:18px}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Figtree',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:520px;margin:0 auto;padding:22px 16px 60px}
  .biz{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .logo{width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none}
  .biz h1{font-size:18px;margin:0;font-weight:700} .biz p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 10px 30px -22px rgba(0,0,0,.25)}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
  .num{font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600} .to{font-weight:600;margin-top:2px} .addr{color:var(--ink2);font-size:14px}
  .badge{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#eef3ef;color:var(--ink2);white-space:nowrap}
  .badge.paid{background:#e4f3ea;color:var(--ok)} .badge.void{background:#f6e7e5;color:var(--danger)}
  table{width:100%;border-collapse:collapse;margin-top:6px} td{padding:10px 0;border-top:1px solid var(--line);vertical-align:top;font-size:15px} td.amt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  td .k{display:block;font-size:12px;color:var(--muted)} tr.total td{border-top:2px solid var(--ink);font-weight:700;font-size:18px;padding-top:12px}
  .notes{margin-top:14px;color:var(--ink2);font-size:14px;white-space:pre-wrap}
  .pay{display:block;width:100%;margin-top:18px;padding:17px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;font-size:18px;cursor:pointer}
  .pay:disabled{opacity:.6;cursor:default} .pay:hover:not(:disabled){background:var(--accent-deep)}
  .alt{margin-top:14px;text-align:center;color:var(--muted);font-size:13.5px}
  .done{margin-top:16px;padding:14px;border-radius:14px;background:#e4f3ea;color:var(--ok);font-weight:600;text-align:center}
  .err{margin-top:16px;padding:14px;border-radius:14px;background:#f6e7e5;color:var(--danger);text-align:center}
  .foot{margin-top:26px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6}
  .foot a{color:inherit}
  .tips{margin-top:14px} .tips .k{font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600}
  .tipgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px} .tipgrid button{padding:12px 6px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-weight:700;cursor:pointer;color:var(--ink)} .tipgrid button small{display:block;font-weight:500;color:var(--muted);font-size:12px}
  .tipgrid button.on{border-color:var(--accent);background:#edf5f0;color:var(--accent-deep)}
  .tipcustom{display:flex;gap:8px;margin-top:8px;align-items:center} .tipcustom input{flex:1;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-size:16px}
  .skel{height:14px;border-radius:7px;background:linear-gradient(90deg,#eceeec,#f6f7f6,#eceeec);background-size:200% 100%;animation:sh 1.2s infinite;margin:10px 0}
  @keyframes sh{to{background-position:-200% 0}}
.methods{display:grid;gap:8px;margin-top:16px} .method{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;background:#fff} .method.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)} .method input{accent-color:var(--accent);width:18px;height:18px;margin:0} .method b{display:block;font-size:15px} .method span{font-size:13px;color:var(--muted)} .method .amt{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums} .autopay-on{margin-top:12px;font-size:13px;color:var(--ok);background:#eef7f1;border-radius:10px;padding:10px 12px}
.savecard{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);margin-top:10px;cursor:pointer}.savecard input{margin-top:3px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="card"><div class="skel" style="width:40%"></div><div class="skel"></div><div class="skel"></div><div class="skel" style="width:60%"></div></div>
</div>
<script>
const SB = "https://hingbdtmxozbjetzwibj.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhpbmdiZHRteG96YmpldHp3aWJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NDMzMzUsImV4cCI6MjA5NzExOTMzNX0.7WoJYMeIl2sclHQRSjl_AoLgYgLbQXBSn-hHV2rwlgI";
const q = new URLSearchParams(location.search);
const token = q.get("t") || (location.pathname.match(/\/pay\/([a-z0-9]+)/i) || [])[1] || "";
const justPaid = q.get("paid") === "1";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = c => "$" + (Math.round(c||0)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const app = document.getElementById("app");

async function load(attempt=0){
  if(token==="card-saved"){ app.innerHTML = q.get("cancel")==="1" ? '<div class="card"><h2 style="margin:0 0 8px">No card saved</h2><p style="color:#555;margin:0">That\'s okay. You can pay when the work is done. If you meant to add a card, open the link from your text again.</p></div>' : '<div class="card"><h2 style="margin:0 0 8px">Card saved. Thank you!</h2><p style="color:#555;margin:0">Nothing has been charged yet. You\'ll be charged only when the work is done or your bill is due, and you\'ll get a receipt by text.</p></div>'; return; }
  if(!token){ app.innerHTML = '<div class="card err">This invoice link isn\'t complete. Please use the link from your text or email.</div>'; return; }
  let inv=null;
  try{
    const r = await fetch(`${SB}/rest/v1/rpc/invoice_public`,{method:"POST",headers:{"Content-Type":"application/json",apikey:ANON,Authorization:"Bearer "+ANON},body:JSON.stringify({p_token:token})});
    inv = await r.json();
  }catch(e){}
  if(!inv || !inv.id){ app.innerHTML = '<div class="card err">We couldn\'t find this invoice. It may have been replaced; please check with the business.</div>'; return; }
  // Rent: ask Donna to settle with Stripe right away (partial payments and bank debits are not closed by the webhook).
  if(inv.rent && justPaid && !inv.paid_at && attempt===0){ try{ await fetch(`${SB}/functions/v1/rent`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"confirm",token})}); const r2 = await fetch(`${SB}/rest/v1/rpc/invoice_public`,{method:"POST",headers:{"Content-Type":"application/json",apikey:ANON,Authorization:"Bearer "+ANON},body:JSON.stringify({p_token:token})}); const j2 = await r2.json(); if(j2&&j2.id) inv=j2; }catch(e){} }
  // After Stripe redirects back, the webhook may land a second later: poll briefly until it shows paid.
  if(justPaid && !inv.paid_at && attempt < 6){ setTimeout(()=>load(attempt+1), 1500); }
  render(inv);
}

let saveCard = false;
let payMethod = "bank";   // dues: bank (no fee) is the default
let autopayPick = false;
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const longDate = d => d ? `${MONTHS[Number(d.slice(5,7))-1]} ${Number(d.slice(8,10))}, ${d.slice(0,4)}` : "";
const lsGet = k => { try{ return localStorage.getItem(k); }catch(_e){ return null; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k,v); }catch(_e){} };
let rentAuto = false; // rent: tenant ticked "pay my rent automatically"
let rentAmt = null;  // rent: cents the tenant chose to pay (partial payments on), null = the full balance
let tipPick = null; // cents chosen on this page (tickets only); null = use the invoice's saved tip
// ---- Rent: bank (no fee), card or Cash App (card fee); part payments only when the manager allows them.
function rentNums(inv, due){
  const r = inv.rent; const balance = Math.max(0, due - (r.paid_cents||0) - (r.processing_cents||0));
  const amt = (r.allow_partial && rentAmt != null) ? Math.min(balance, Math.max(0, rentAmt)) : balance;
  const method = (payMethod==="bank" && !r.bank) ? "card" : payMethod;
  const fee = method==="bank" ? 0 : (inv.card_fee_pct>0 ? Math.round(amt * inv.card_fee_pct / 100) : 0);
  return { balance, amt, method, fee };
}
function rentBox(inv, due){
  const r = inv.rent; const b = inv.business || {}; const n = rentNums(inv, due);
  const call = b.phone ? ` Please call ${esc(b.phone)}.` : " Please call the office.";
  if(r.blocked) return `<div class="err">${esc(b.name||"The office")} is not accepting online payments for this home right now.${call}</div>`;
  const clearing = r.processing_cents>0 ? `<div class="done" style="background:#eef7f1">A bank payment of ${money(r.processing_cents)} is on its way. It takes 3 to 5 business days to clear, and you'll get a receipt when it does.</div>` : "";
  const apBox = r.autopay ? `<div class="done" style="background:#eef7f1;text-align:left;margin-top:10px"><b>Autopay is on.</b> Rent is drawn from your ${r.autopay.method==="bank"?"bank account":"card"}${r.autopay.last4?" ending "+esc(r.autopay.last4):""} on each due date. <a href="#" id="rentAutoOff">Turn autopay off</a></div>` : "";
  if(n.balance<=0) return (clearing || `<div class="alt">Confirming your payment…</div>`) + apBox;
  if(!inv.can_pay_online) return `${clearing}<div class="alt">Pay ${esc(b.name||"the office")} directly${b.phone?` · ${esc(b.phone)}`:""}.</div>`;
  const cardName = r.cashapp ? "Card or Cash App" : "Card";
  return `${clearing}
    ${r.allow_partial?`<div class="tips"><div class="k">How much are you paying today?</div><div class="tipcustom"><input id="rentAmt" inputmode="decimal" value="${(n.amt/100).toFixed(2)}" aria-label="Amount to pay"><button type="button" id="rentFull" style="padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-weight:600;color:var(--muted);cursor:pointer">Full ${money(n.balance)}</button></div></div>`:""}
    <div class="methods">
      ${r.bank?`<label class="method ${n.method==="bank"?"on":""}"><input type="radio" name="rpm" value="bank" ${n.method==="bank"?"checked":""}><div><b>Bank account</b><span>No fee · sign in to your bank or enter your account</span></div><div class="amt">${money(n.amt)}</div></label>`:""}
      <label class="method ${n.method==="card"?"on":""}"><input type="radio" name="rpm" value="card" ${n.method==="card"?"checked":""}><div><b>${cardName}</b><span>${inv.card_fee_pct>0?`Includes a ${inv.card_fee_pct}% fee of ${money(Math.round(n.amt*inv.card_fee_pct/100))}`:"Debit or credit"}</span></div><div class="amt">${money(n.amt+(inv.card_fee_pct>0?Math.round(n.amt*inv.card_fee_pct/100):0))}</div></label>
    </div>
    ${r.cashapp?`<div class="alt" style="text-align:left;margin-top:10px"><b>Paying with Cash App?</b> Some Cash App accounts have lower sending limits. If yours is below your rent, Cash App will not work for this payment. Use your bank account or a card instead.</div>`:""}
    ${r.autopay?apBox
      :(n.amt>=n.balance&&!(r.paid_cents>0)?`<label class="autopay" style="display:flex;gap:10px;align-items:flex-start;margin-top:12px;text-align:left;font-size:14px;line-height:1.45"><input type="checkbox" id="rentAuto" ${rentAuto?"checked":""} style="margin-top:3px"><span><b>Pay my rent automatically each month.</b> I authorize ${esc(b.name||"my property manager")} to draw my rent${n.method==="bank"?" from this bank account (no fee)":` from this card${inv.card_fee_pct>0?` (plus the ${inv.card_fee_pct}% card fee)`:""}`} on each due date. I get a reminder 3 days before and a receipt every time, and I can turn it off any time from my rent link.</span></label>`:"")}
    <button class="pay" id="rentBtn">Pay ${money(n.amt+n.fee)} by ${n.method==="bank"?"bank":(r.cashapp?"card or Cash App":"card")}</button>
    <div class="alt">Secure payment through Stripe. Your payment goes directly to ${esc(b.name||"your property manager")}. ${r.allow_partial?"You can pay part now and the rest later.":"Full amount only."}</div><div id="payErr"></div>`;
}
function rentBind(inv, due){
  document.querySelectorAll('input[name="rpm"]').forEach(x=>x.onchange=()=>{ payMethod=x.value; render(inv); });
  const a=document.getElementById("rentAmt"); if(a) a.onchange=()=>{ const v=Math.round(Number(String(a.value).replace(/[^0-9.]/g,""))*100); rentAmt = (isFinite(v)&&v>0) ? v : null; render(inv); };
  const f=document.getElementById("rentFull"); if(f) f.onclick=()=>{ rentAmt=null; render(inv); };
  const au=document.getElementById("rentAuto"); if(au) au.onchange=()=>{ rentAuto=au.checked; };
  const off=document.getElementById("rentAutoOff"); if(off) off.onclick=async(e)=>{ e.preventDefault(); off.textContent="Turning off…"; try{ await fetch(`${SB}/functions/v1/rent`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"autopay_off",token})}); }catch(_e){} load(); };
  const btn=document.getElementById("rentBtn"); if(!btn) return;
  btn.onclick=async()=>{
    const n=rentNums(inv, due); const label=btn.textContent; btn.disabled=true; btn.textContent="Opening secure checkout…";
    try{
      const body={action:"checkout",token,method:n.method}; if(inv.rent.allow_partial && n.amt<n.balance) body.amount_cents=n.amt;
      if(rentAuto && !inv.rent.autopay && n.amt>=n.balance) body.autopay=true;
      const r=await fetch(`${SB}/functions/v1/rent`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); const j=await r.json();
      if(j.ok&&j.url){ location.href=j.url; return; }
      document.getElementById("payErr").innerHTML=`<div class="err">${esc(j.message||"Online payment isn't available right now. Please contact the office.")}</div>`;
    }catch(e){ document.getElementById("payErr").innerHTML='<div class="err">Couldn\'t open checkout. Please try again.</div>'; }
    btn.disabled=false; btn.textContent=label;
  };
}
function render(inv){
  const b = inv.business || {}; const paid = !!inv.paid_at; const isVoid = inv.status === "void";
  const isTicket = inv.kind === "ticket";
  const isDues = !!inv.bank_pay;
  const rent = inv.rent || null; const isRent = !!rent;
  const apOn = !!(inv.unit && inv.unit.autopay);
  const bankInFlight = !inv.paid_at && ((inv.paid_note && /processing/i.test(inv.paid_note)) || (justPaid && lsGet("paymethod_"+token)==="bank"));
  const base = (inv.total_cents||0) - (inv.tip_cents||0);            // services + products + tax
  const tipNow = tipPick != null ? tipPick : (inv.tip_cents||0);
  const due = base + tipNow;
  const feeCard = inv.card_fee_pct>0 ? Math.round(due * inv.card_fee_pct / 100) : 0;
  const feeNow = (isDues && payMethod==="bank") ? 0 : feeCard;
  const initials = (b.name||"?").split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  const lines = (inv.lines||[]).filter(l => l.kind !== "tax");
  document.title = `${isTicket?"Receipt":isDues?"Dues":isRent?"Rent":"Invoice"} ${inv.number} · ${b.name||""}`;
  app.innerHTML = `
    <div class="biz"><div class="logo">${esc(initials)}</div><div><h1>${esc(b.name||"Invoice")}</h1><p>${[b.phone,b.email].filter(Boolean).map(esc).join(" · ")}</p></div></div>
    <div class="card">
      <div class="top">
        <div><div class="num">${isTicket?(paid?"Receipt":"Your visit"):isDues?"Dues":isRent?"Rent":"Invoice"} ${esc(inv.number)}</div>${(isDues||isRent)&&inv.due_at&&!paid?`<div class="addr">Due ${esc(longDate(inv.due_at))}</div>`:""}${isTicket&&inv.served_by_name?`<div class="addr">with ${esc(inv.served_by_name)}</div>`:""}${inv.customer_name?`<div class="to">${esc(inv.customer_name)}</div>`:""}${inv.service_address?`<div class="addr">${esc(inv.service_address)}</div>`:""}</div>
        <span class="badge ${paid?"paid":isVoid?"void":""}">${paid?"Paid":isVoid?"Cancelled":"Due"}</span>
      </div>
      <table>
        ${lines.map(l=>`<tr><td>${esc(l.desc)}${l.qty>1?`<span class="k">${l.qty} × ${money(l.unit_cents)}</span>`:""}${l.kind==="addon"?`<span class="k">Add-on</span>`:l.kind==="product"?`<span class="k">Retail</span>`:l.kind==="gift_card"?`<span class="k">Gift card applied</span>`:l.kind==="gift_card_sale"?`<span class="k">Gift card</span>`:""}</td><td class="amt">${l.cents===0?"No charge":money(l.cents)}</td></tr>`).join("")}
        ${inv.tax_cents?`<tr><td>Sales tax</td><td class="amt">${money(inv.tax_cents)}</td></tr>`:""}
        ${tipNow?`<tr><td>Tip${inv.served_by_name?` <span class="k">for ${esc(inv.served_by_name)}</span>`:""}</td><td class="amt">${money(tipNow)}</td></tr>`:""}
        <tr class="total"><td>Total</td><td class="amt">${money(due)}</td></tr>
        ${isRent&&!paid&&rent.paid_cents>0?`<tr><td>Paid so far</td><td class="amt">-${money(rent.paid_cents)}</td></tr>`:""}
        ${isRent&&!paid&&rent.processing_cents>0?`<tr><td>Bank payment clearing</td><td class="amt">-${money(rent.processing_cents)}</td></tr>`:""}
        ${isRent&&!paid&&(rent.paid_cents>0||rent.processing_cents>0)?`<tr class="total"><td>Still due</td><td class="amt">${money(Math.max(0,due-rent.paid_cents-rent.processing_cents))}</td></tr>`:""}
      </table>
      ${(!paid && !isVoid && isTicket && inv.tips_enabled) ? `<div class="tips"><div class="k">Add a tip${inv.served_by_name?` for ${esc(inv.served_by_name)}`:""}?</div>
        <div class="tipgrid">${[15,18,20,25].map(p=>{ const c=Math.round(base*p/100); return `<button type="button" data-tip="${c}" class="${tipNow===c?'on':''}">${p}%<small>${money(c)}</small></button>`; }).join("")}</div>
        <div class="tipcustom"><input id="tipCustom" inputmode="decimal" placeholder="Other amount"><button type="button" id="tipNone" style="padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-weight:600;color:var(--muted);cursor:pointer">No tip</button></div></div>` : ""}
      ${inv.notes?`<div class="notes">${esc(inv.notes)}</div>`:""}
      ${paid ? `<div class="done">Paid${inv.paid_method&&inv.paid_method!=="card"?" ("+esc(inv.paid_method)+")":""}${inv.paid_note&&/card processing fee/.test(inv.paid_note)?` · ${esc(inv.paid_note.replace(/^.*incl\. /,"incl. "))}`:""} on ${new Date(inv.paid_at).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})}. Thank you!</div>${isRent&&rent&&rent.autopay?`<div class="done" style="background:#eef7f1;text-align:left;margin-top:10px"><b>Autopay is on.</b> Rent is drawn from your ${rent.autopay.method==="bank"?"bank account":"card"}${rent.autopay.last4?" ending "+esc(rent.autopay.last4):""} on each due date. <a href="#" id="rentAutoOff">Turn autopay off</a></div>`:""}`
        : isVoid ? `<div class="err">This invoice was cancelled by ${esc(b.name||"the business")}.</div>`
        : isRent ? rentBox(inv, due)
        : bankInFlight ? `<div class="done" style="background:#eef7f1">Bank payment started. It takes 2–4 business days to clear; you\'ll get a receipt by text when it does. Nothing else to do.</div>`
        : (inv.can_pay_online && isDues) ? `<div class="methods">
            <label class="method ${payMethod==="bank"?"on":""}"><input type="radio" name="pm" value="bank" ${payMethod==="bank"?"checked":""}><div><b>Bank account</b><span>No fee · sign in to your bank or enter your account</span></div><div class="amt">${money(due)}</div></label>
            <label class="method ${payMethod==="card"?"on":""}"><input type="radio" name="pm" value="card" ${payMethod==="card"?"checked":""}><div><b>Card</b><span>${inv.card_fee_pct>0?`Includes a ${inv.card_fee_pct}% card fee of ${money(feeCard)}`:"Debit or credit"}</span></div><div class="amt">${money(due+feeCard)}</div></label>
          </div>
          ${apOn?`<div class="autopay-on">Autopay is on${inv.unit.autopay.last4?` (${inv.unit.autopay.method==="card"?"card":"bank"} ending ${esc(inv.unit.autopay.last4)})`:""}. This will be drafted on the due date, or you can pay it now.</div>`
            : (inv.unit?`<label class="savecard"><input type="checkbox" id="autopay" ${autopayPick?"checked":""}> Pay future dues automatically from this ${payMethod==="bank"?"bank account":"card"} (autopay). You\'ll get a text before each one, and you can turn it off any time.</label>`:"")}
          <button class="pay" id="payBtn">Pay ${money(due+feeNow)} by ${payMethod==="bank"?"bank":"card"}</button>
          <div class="alt">Secure payment through Stripe. Your payment goes directly to ${esc(b.name||"the association")}${b.managed_by?`, managed by ${esc(b.managed_by)}`:""}. Full amount only.</div><div id="payErr"></div>`
        : inv.can_pay_online ? `${feeNow>0?`<div class="alt" style="margin-top:14px;text-align:left"><b>Cash or check:</b> ${money(due)} &nbsp;·&nbsp; <b>By card:</b> ${money(due+feeNow)} <span style="color:#999">(includes a ${inv.card_fee_pct}% card processing fee of ${money(feeNow)})</span></div>`:""}<button class="pay" id="payBtn">Pay ${money(due+feeNow)} by card</button>${isTicket&&inv.has_contact?`<label class="savecard"><input type="checkbox" id="saveCard" ${saveCard?"checked":""}> Keep this card on file with ${esc(b.name||"the salon")} so next time is one tap</label>`:""}<div class="alt">Secure card payment through Stripe. Your payment goes directly to ${esc(b.name||"the business")}.</div><div id="payErr"></div>`
        : (justPaid ? `<div class="alt">Confirming your payment…</div>` : `<div class="alt">Pay ${esc(b.name||"the business")} directly${b.phone?` · ${esc(b.phone)}`:""}.</div>`)}
    </div>
    <div class="foot">Sent by ${esc(b.name||"the business")}${b.managed_by?` (managed by ${esc(b.managed_by)})`:""} with Donna.<br>Payments are processed by ${esc(b.name||"the business")}'s own Stripe account; Donna never holds your money.</div>`;
  if(isRent && !isVoid) rentBind(inv, due);
  document.querySelectorAll("[data-tip]").forEach(b=>b.onclick=()=>{ tipPick=Number(b.dataset.tip); render(inv); });
  const scb=document.getElementById("saveCard"); if(scb) scb.onchange=()=>{ saveCard=scb.checked; };
  const tn=document.getElementById("tipNone"); if(tn) tn.onclick=()=>{ tipPick=0; render(inv); };
  const tc=document.getElementById("tipCustom"); if(tc) tc.onchange=()=>{ const v=Math.round(Number(String(tc.value).replace(/[^0-9.]/g,""))*100); if(isFinite(v)&&v>=0){ tipPick=v; render(inv); } };
  document.querySelectorAll('input[name="pm"]').forEach(r=>r.onchange=()=>{ payMethod=r.value; render(inv); });
  const apb=document.getElementById("autopay"); if(apb) apb.onchange=()=>{ autopayPick=apb.checked; };
  const btn = document.getElementById("payBtn");
  if(btn) btn.onclick = async () => {
    btn.disabled = true; btn.textContent = "Opening secure checkout…";
    try{
      const body = {action:"checkout",token}; if(isTicket && inv.tips_enabled) body.tip_cents = tipNow; const sc=document.getElementById("saveCard"); if(sc&&sc.checked) body.save_card = true;
      if(isDues){ body.method = payMethod; if(autopayPick && !apOn) body.autopay = true; lsSet("paymethod_"+token, payMethod); }
      const r = await fetch(`${SB}/functions/v1/payments`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      const j = await r.json();
      if(j.ok && j.url){ location.href = j.url; return; }
      document.getElementById("payErr").innerHTML = `<div class="err">${j.error==="already_paid"?"This invoice is already paid.":"Online payment isn't available right now. Please pay the business directly."}</div>`;
    }catch(e){ document.getElementById("payErr").innerHTML = '<div class="err">Couldn\'t open checkout. Please try again.</div>'; }
    btn.disabled = false; btn.textContent = `Pay ${money(due+feeNow)} by ${isDues&&payMethod==="bank"?"bank":"card"}`;
  };
}
load();
</script>
</body>
</html>
